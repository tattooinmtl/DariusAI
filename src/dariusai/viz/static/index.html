<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DariusAI</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="stylesheet" href="/vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="/vendor/codemirror/theme-dracula.min.css">
<link rel="stylesheet" href="/vendor/codemirror/addon-dialog.min.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #05060f; overflow: hidden;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif; color: #e6e9f5; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 8px; height: 8px; } ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

  /* ---- app shell: titlebar + menubar ------------------------------- */
  #app { display: flex; flex-direction: column; width: 100%; height: 100%; }
  /* The window is dragged by the `pywebview-drag-region` class on #titlebar
     (see the markup below), not by `-webkit-app-region: drag` — WebView2
     ignores that CSS unless Edge is started with the
     msWebView2EnableDraggableRegions feature flag, which is why the window
     used to be stuck in place. The app-region rules are kept only so the
     same page still drags correctly if it's ever hosted in Electron. */
  #titlebar { height: 34px; flex: none; display: flex; align-items: center; background: #0a0b18;
    border-bottom: 1px solid rgba(255,255,255,0.06); -webkit-app-region: drag; user-select: none; cursor: default; }
  #titlebar .brand { display: flex; align-items: center; gap: 8px; padding: 0 12px; font-size: 12.5px; font-weight: 600;
    letter-spacing: .03em; color: #cfd6ff; }
  #titlebar .brand .icon { font-size: 15px; filter: drop-shadow(0 0 4px #6ea8ff); }
  /* Pre-release badge: amber while the version is an alpha/beta, so it reads
     as "this is not finished yet" at a glance; plain grey once it isn't. */
  #titlebar .brand .version { font-size: 10px; font-weight: 600; letter-spacing: .04em; color: #6c7399;
    border: 1px solid rgba(255,255,255,0.12); border-radius: 9px; padding: 1px 7px; }
  #titlebar .brand .version.prerelease { color: #f0b45f; border-color: rgba(240,180,95,0.35);
    background: rgba(240,180,95,0.08); }
  #titlebar .spacer { flex: 1; }
  #titlebar .win-btn { -webkit-app-region: no-drag; width: 44px; height: 34px; border: none; background: none;
    color: #8b93b8; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  #titlebar .win-btn:hover { background: rgba(255,255,255,0.08); color: #eef1ff; }
  #titlebar .win-btn.close:hover { background: #c0392b; color: #fff; }
  /* The maximize button's icon swaps when the window is maximized: a single
     outlined square while windowed, two overlapping squares while maximized
     (the "restore" affordance). Both are in the DOM; CSS picks one. */
  #btnMaximize svg.restore { display: none; }
  #btnMaximize.maximized svg.maximize { display: none; }
  #btnMaximize.maximized svg.restore { display: block; }
  #btnReload { -webkit-app-region: no-drag; margin-right: 10px; font-family: inherit; font-size: 11px; font-weight: 600;
    color: #0a0b18; background: #f0b45f; border: none; border-radius: 999px; padding: 4px 12px; cursor: pointer;
    box-shadow: 0 0 14px rgba(240,180,95,0.45); }
  #btnReload:hover { background: #ffc978; }

  #menubar { height: 28px; flex: none; display: flex; align-items: stretch; background: #0d0f20;
    border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 12px; -webkit-app-region: no-drag; position: relative; z-index: 100; }
  .menu { position: relative; display: flex; align-items: center; padding: 0 12px; color: #9aa1c7; cursor: pointer; }
  .menu:hover, .menu.open { background: rgba(255,255,255,0.06); color: #eef1ff; }
  .menu-dropdown { display: none; position: absolute; top: 28px; left: 0; min-width: 200px; background: #14162a;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 6px; padding: 5px; box-shadow: 0 12px 32px rgba(0,0,0,0.5); }
  .menu.open .menu-dropdown { display: block; }
  .menu-item { padding: 7px 10px; border-radius: 4px; font-size: 12px; color: #cfd3ec; cursor: pointer; white-space: nowrap; }
  .menu-item:hover { background: #3b5bdb; color: #fff; }
  .menu-sep { height: 1px; background: rgba(255,255,255,0.08); margin: 4px 2px; }

  /* ---- workspace: docked row + floating layer ------------------------ */
  #workspace { position: relative; flex: 1; min-height: 0; }
  #dockRow { position: absolute; inset: 0; display: flex; flex-direction: row; overflow: hidden; }
  #floatingLayer { position: absolute; inset: 0; pointer-events: none; z-index: 50; }

  /* Splitter — 8px hit area, with a bar that only appears on hover/grab.
     The 3% white tint in the original was invisible against the #05060f
     background and gave no feedback that the column boundary was grabable. */
  .splitter { flex: 0 0 8px; cursor: col-resize; background: transparent; position: relative; }
  .splitter::before { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px;
    margin-left: -1px; background: rgba(110,168,255,0.18); border-radius: 1px; transition: background 120ms, width 120ms; }
  .splitter:hover::before, .splitter.active::before { background: #3b5bdb; width: 3px; margin-left: -1.5px; }

  .panel { display: flex; flex-direction: column; min-width: 0; background: #05060f; position: relative; overflow: hidden; }
  .panel:not(.floating) { flex: 1 1 0; border-right: none; }
  .panel.floating { position: fixed; pointer-events: auto; border: 1px solid rgba(110,168,255,0.35);
    border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); }
  .panel-titlebar { flex: none; display: flex; align-items: center; height: 30px; padding: 0 4px 0 10px;
    background: #0d0f20; border-bottom: 1px solid rgba(255,255,255,0.07); cursor: grab; user-select: none; }
  .panel-titlebar:active { cursor: grabbing; }
  .panel.floating .panel-titlebar { border-radius: 9px 9px 0 0; }
  .panel-title { font-size: 11.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: #9aa1c7; flex: 1; }
  .panel-btns { display: flex; gap: 2px; }
  .panel-btn { background: none; border: none; color: #8b93b8; font-size: 12px; width: 24px; height: 22px; border-radius: 5px; cursor: pointer; }
  .panel-btn:hover { background: rgba(255,255,255,0.1); color: #eef1ff; }
  .panel-body { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  /* Docked-mode handle = pop-out button (click to float the panel).
     Floating-mode handle = the existing nwse-resize corner.
     One element, two roles — the click handler decides which.
     Hidden by default for docked panels: the titlebar already carries a
     `panel-toggle` button that does the same pop-out action, so the
     absolute-positioned bottom-right handle was just dangling in empty
     space below docked content (visible whenever the cursor crossed the
     panel). The button is kept in the DOM because the floating-mode
     resize math still references its bounding rect, but it only renders
     when the panel is actually floating. */
  .panel-resize { display: none; }
  .panel.floating .panel-resize { display: flex; align-items: center; justify-content: center;
    position: absolute; right: 0; bottom: 0; width: 18px; height: 18px; cursor: nwse-resize;
    z-index: 5; }
  .panel.floating .panel-resize::after { content: ""; position: absolute; right: 3px; bottom: 3px;
    width: 8px; height: 8px;
    border-right: 2px solid rgba(255,255,255,0.7); border-bottom: 2px solid rgba(255,255,255,0.7); }

  /* ---- neural view ----------------------------------------------------- */
  #neuralCanvasWrap { position: absolute; inset: 0; }
  #neuralCanvasWrap canvas { display: block; position: absolute; inset: 0; cursor: grab; }
  #neuralCanvasWrap canvas.dragging { cursor: grabbing; }
  /* The HUD floats over the graph, so it's a thin strip along the top —
     four chunky opaque cards down the left used up half the panel and hid
     the thing they annotate. */
  .hud { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 5; display: flex; flex-direction: column; gap: 6px; }
  .hud-bar { display: flex; align-items: center; gap: 8px; padding: 6px 11px; border-radius: 10px;
    background: rgba(10,12,26,0.62); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border: 1px solid rgba(255,255,255,0.07); }
  .hud-bar input { flex: 1; min-width: 0; background: none; border: none; outline: none; color: #e6e9f5; font-size: 12px; }
  .hud-bar input::placeholder { color: #5b6289; }
  .hud-chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { display: inline-flex; align-items: center; gap: 5px; font-size: 10.5px; font-family: inherit; cursor: pointer;
    color: #6c7399; background: rgba(10,12,26,0.6); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border: 1px solid rgba(255,255,255,0.06); border-radius: 999px; padding: 3px 10px; transition: color .12s, border-color .12s; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; opacity: .3; transition: opacity .12s; }
  .chip.on { color: #dfe4ff; border-color: rgba(110,168,255,0.32); }
  .chip.on .dot { opacity: 1; box-shadow: 0 0 7px currentColor; }
  .hud-foot { position: absolute; left: 13px; bottom: 12px; z-index: 5; pointer-events: none;
    font-size: 10.5px; color: #6c7399; line-height: 1.7; text-shadow: 0 1px 3px #05060f; }
  /* Real-time frames-per-second readout at the bottom-right of the 3D
     viewport. Green at ~60 (locked refresh), amber in the normal band,
     red when the renderer is dropping below 29 fps. pointer-events:none
     keeps it from intercepting drags on the canvas underneath. */
  .nv-fps { position: absolute; right: 11px; bottom: 11px; z-index: 6;
    padding: 3px 8px; border-radius: 6px; font-family: ui-monospace, Consolas, monospace;
    font-size: 11px; font-weight: 600; letter-spacing: .04em; pointer-events: none;
    background: rgba(10,12,26,0.62); border: 1px solid rgba(255,255,255,0.08);
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .nv-fps.normal { color: #f0b45f; }
  .nv-fps.high   { color: #6ee7b7; }
  .nv-fps.low    { color: #f87171; }
  .hud-card { background: rgba(10,12,26,0.62); backdrop-filter: blur(9px); -webkit-backdrop-filter: blur(9px);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 10px;
    padding: 8px 10px; backdrop-filter: blur(6px); font-size: 11px; }
  .hud-card .sub { font-size: 10.5px; color: #8b93b8; margin-bottom: 5px; }
  .hud-card input[type=text] { width: 190px; background: #12142a; border: 1px solid rgba(255,255,255,0.12); color: #e6e9f5;
    border-radius: 6px; padding: 5px 7px; font-size: 11.5px; outline: none; }
  .legend-row { display: flex; align-items: center; gap: 6px; font-size: 10.5px; color: #c4c9e6; padding: 2px 0; cursor: pointer; user-select: none; }
  .legend-row input { accent-color: #6ea8ff; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  #activityLog { font-size: 10px; color: #9aa1c7; line-height: 1.55; max-height: 100px; overflow-y: auto; width: 190px; }
  #activityLog .row { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; opacity: 0.9; }
  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #6ee7b7; margin-left: 6px;
    box-shadow: 0 0 6px #6ee7b7; animation: pulse-dot 1.4s ease-in-out infinite; }
  @keyframes pulse-dot { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }

  #tooltip { position: fixed; pointer-events: none; z-index: 200; background: rgba(10,12,24,0.95); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 6px; padding: 6px 9px; font-size: 12px; max-width: 320px; display: none; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }

  #nodeInspector { position: fixed; top: 0; right: 0; height: 100%; width: 380px; background: rgba(9,10,20,0.97); border-left: 1px solid rgba(255,255,255,0.08);
    transform: translateX(100%); transition: transform 0.2s ease; z-index: 300; padding: 18px; overflow-y: auto; backdrop-filter: blur(8px); }
  #nodeInspector.open { transform: translateX(0); }
  #nodeInspector h2 { font-size: 14px; margin: 0 0 4px; color: #eef1ff; }
  #nodeInspector .meta { font-size: 11px; color: #8b93b8; margin-bottom: 10px; }
  #nodeInspector .section-label { font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: #6c7399; margin: 12px 0 4px; }
  #nodeInspector .body { font-size: 12.5px; line-height: 1.55; color: #cfd3ec; white-space: pre-wrap; }
  #nodeInspector .tags { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 4px; }
  #nodeInspector .tag { font-size: 10.5px; background: rgba(110,168,255,0.15); border: 1px solid rgba(110,168,255,0.35); color: #a9c6ff;
    border-radius: 10px; padding: 2px 8px; }
  #nodeInspector .source { font-size: 11px; color: #9aa1c7; margin: 4px 0; }
  #nodeInspector .source a { color: #7dd3fc; }
  #nodeInspector .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #8b93b8; font-size: 16px; background: none; border: none; }
  #nodeInspector .edit { position: absolute; top: 10px; right: 38px; cursor: pointer; color: #8b93b8; font-size: 12px; background: none; border: none; }
  #nodeInspector .edit:hover, #nodeInspector .close:hover { color: #eef1ff; }
  #nodeInspector label { display: block; font-size: 11px; color: #8b93b8; margin: 10px 0 4px; }
  #nodeInspector input.field, #nodeInspector select { width: 100%; background: #12142a; border: 1px solid rgba(255,255,255,0.12); color: #e6e9f5;
    border-radius: 6px; padding: 6px 8px; font-size: 12.5px; outline: none; }
  #nodeInspector textarea { width: 100%; min-height: 90px; background: #12142a; border: 1px solid rgba(255,255,255,0.12); color: #e6e9f5;
    border-radius: 6px; padding: 8px; font-size: 12.5px; font-family: inherit; line-height: 1.5; resize: vertical; outline: none; box-sizing: border-box; }
  #nodeInspector .actions { margin-top: 14px; display: flex; gap: 8px; }
  #nodeInspector .btn { background: #1b1e38; border: 1px solid rgba(255,255,255,0.15); color: #e6e9f5; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  #nodeInspector .btn:hover { border-color: rgba(255,255,255,0.3); }
  #nodeInspector .btn.primary { background: #3b5bdb; border-color: #3b5bdb; }
  #nodeInspector .btn.primary:hover { background: #4c6ef5; }
  #nodeInspector .btn.danger { background: #7f1d1d; border-color: #7f1d1d; }
  #nodeInspector .err { color: #f87171; font-size: 11.5px; margin-top: 8px; }

  /* ---- chat --------------------------------------------------------- */
  /* ---- thinking box -------------------------------------------- */
  /* A small collapsible panel that streams the agent's intermediate work
     (tool calls, intermediate narration). Collapsed by default — click
     the head to expand. The shape mirrors Claude Code / Cursor's
     reasoning panels so the affordance is familiar. */
  .chat-thinking { margin: 6px 14px; border: 1px solid rgba(110,168,255,0.25);
    border-radius: 8px; background: rgba(13,17,38,0.6); overflow: hidden; }
  .chat-thinking-head { display: flex; align-items: center; gap: 8px;
    padding: 7px 11px; cursor: pointer; user-select: none; font-size: 11.5px;
    color: #9aa1c7; transition: background 120ms; }
  .chat-thinking-head:hover { background: rgba(110,168,255,0.08); }
  .chat-thinking-icon { font-size: 13px; filter: grayscale(0.2); }
  .chat-thinking-label { flex: 1; font-weight: 500; letter-spacing: 0.02em; }
  .chat-thinking-count { font-size: 10px; padding: 1px 7px;
    background: rgba(110,168,255,0.15); border-radius: 10px;
    color: #6ea8ff; font-variant-numeric: tabular-nums; }
  .chat-thinking-toggle { font-size: 10px; color: #6c7399; transition: transform 120ms; }
  .chat-thinking.open .chat-thinking-toggle { transform: rotate(90deg); }
  .chat-thinking-body { display: none; max-height: 280px; overflow-y: auto;
    padding: 4px 0 6px 0; border-top: 1px solid rgba(110,168,255,0.1); }
  .chat-thinking.open .chat-thinking-body { display: block; }
  .chat-thinking-step { padding: 4px 12px 4px 24px; font-family: ui-monospace, Consolas, monospace;
    font-size: 10.5px; line-height: 1.55; color: #b8c0e0; white-space: pre-wrap;
    word-break: break-word; border-left: 2px solid transparent; margin-left: 8px; }
  .chat-step-tool { color: #6ea8ff; border-left-color: rgba(110,168,255,0.4); }
  .chat-step-result { color: #8b93b8; border-left-color: rgba(139,147,184,0.3); }
  .chat-step-text { color: #c4c9e6; }
  .chat-thinking.done { opacity: 0.85; }
  .chat-thinking.done .chat-thinking-label { color: #6ee7b7; }

  /* ── Chat TodoList panel (per superpowers "If it has a checklist,   ── */
  /* ── create a todo per item") — always visible above the messages, ── */
  /* ── hidden when empty so the empty-chat welcome isn't crowded.    ── */
  .chat-todos { display: none; margin: 8px 14px 0; padding: 8px 10px;
    border: 1px solid rgba(110,168,255,0.18); border-radius: 8px;
    background: rgba(13,17,38,0.5); }
  .chat-todos.has-items { display: block; }
  .chat-todos-title { display: flex; align-items: center; gap: 6px;
    font-size: 10.5px; color: #6c7399; text-transform: uppercase;
    letter-spacing: .08em; margin-bottom: 5px; }
  .chat-todos-progress { margin-left: auto; font-size: 10px; color: #6c7399;
    font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
  .chat-todos-list { list-style: none; padding: 0; margin: 0; }
  .chat-todo { display: flex; align-items: flex-start; gap: 8px;
    padding: 3px 0; font-size: 12px; line-height: 1.4; color: #cfd3ec; }
  .chat-todo-icon { flex: none; width: 14px; text-align: center;
    font-size: 11px; line-height: 16px; margin-top: 1px; }
  .chat-todo.done .chat-todo-icon { color: #6ee7b7; }   /* green checkmark */
  .chat-todo.in_progress .chat-todo-icon { color: #6ea8ff; } /* blue dot */
  .chat-todo.pending .chat-todo-icon { color: #4d5378; }    /* empty circle */
  .chat-todo.done .chat-todo-title { color: #8b93b8; text-decoration: line-through; }
  .chat-todo.in_progress .chat-todo-title { color: #e6e9f5; font-weight: 500; }
  .chat-todo.pending .chat-todo-title { color: #6c7399; }
  /* The user wants to copy phase titles out of the panel. Default
     user-select is none on the whole chat view (so drag-selecting
     text doesn't fight the pywebview drag), so we re-enable it
     just for the TodoList rows. */
  .chat-todo, .chat-todo-title { user-select: text; -webkit-user-select: text; cursor: text; }
  .chat-todo-icon { cursor: default; }
  .chat-todo-title { flex: 1; }

  /* ── Token stats footer — real-time TPS + context window gauge  ── */
  /* ── Updated by token_stats WebSocket events (see chat.py).     ── */
  .chat-stats { display: flex; align-items: center; gap: 11px;
    padding: 5px 14px; font-size: 10.5px; font-family: ui-monospace, Consolas, monospace;
    color: #6c7399; border-top: 1px solid rgba(110,168,255,0.10);
    background: rgba(10,12,26,0.55); flex: none; }
  .chat-stats-tps { color: #6ea8ff; font-weight: 600; }
  .chat-stats-cnt { color: #cfd3ec; }
  .chat-stats-pct { color: #6ee7b7; }
  .chat-stats-pct.warn { color: #f0b45f; }
  .chat-stats-pct.danger { color: #f87171; }
  .chat-stats-spacer { flex: 1; }
  /* Slash-command picker — same visual register as the other chat
     panels. Positioned absolutely below the input row when open. */
  .chat-cmd-dropdown {
    position: absolute;
    left: 10%; right: 10%; bottom: calc(100% + 4px);
    max-height: 260px;
    background: #0d0f22;
    border: 1px solid rgba(110, 168, 255, 0.35);
    border-radius: 8px;
    box-shadow: 0 -8px 24px rgba(0,0,0,0.85);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 1000;
  }
  .chat-cmd-dropdown[hidden] {
    display: none !important;
  }
  .chat-cmd-tabs {
    display: flex;
    gap: 4px;
    padding: 6px 8px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
    overflow-x: auto;
  }
  .chat-cmd-tab {
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 11px;
    color: #8b93b8;
    cursor: pointer;
    white-space: nowrap;
  }
  .chat-cmd-tab.active { background: rgba(110, 168, 255, 0.18); color: #cfe0ff; }
  .chat-cmd-list { overflow-y: auto; flex: 1; padding: 4px 0; }
  .chat-cmd-item {
    padding: 5px 14px;
    font-size: 12px;
    color: #cfd3ec;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .chat-cmd-item.highlighted { background: rgba(110, 168, 255, 0.18); color: #fff; }
  .chat-cmd-item .group-tag {
    font-size: 10px;
    color: #6c7399;
    margin-left: auto;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .chat-cmd-hint {
    padding: 4px 12px;
    font-size: 10px;
    color: #6c7399;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(255,255,255,0.02);
  }
  /* Compact button — sits next to the token stats footer. Sends
     {"type":"compact"} over the WebSocket; the server invokes
     session.compact(force=True) and replies with context_compacted. */
  .chat-compact-btn {
    background: rgba(110, 168, 255, 0.12);
    color: #6ea8ff;
    border: 1px solid rgba(110, 168, 255, 0.35);
    border-radius: 4px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s, color 0.15s;
  }
  .chat-compact-btn:hover { background: rgba(110, 168, 255, 0.22); color: #9bc1ff; }
  .chat-compact-btn:active { background: rgba(110, 168, 255, 0.30); }
  .chat-compact-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  /* Toast banner that appears after a context_compacted event —
     "⚡ Context Compacted: 154,200 → 14,100 tok (-90.8%)". */
  .chat-compact-banner {
    margin: 6px 12px 0 12px;
    padding: 6px 10px;
    border-radius: 4px;
    background: rgba(110, 168, 255, 0.10);
    border: 1px solid rgba(110, 168, 255, 0.30);
    color: #9bc1ff;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 6px;
    animation: compact-fade-in 0.18s ease-out;
  }
  @keyframes compact-fade-in {
    from { opacity: 0; transform: translateY(-3px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .chat-compact-banner .arrow { color: #4d5378; }
  .chat-compact-banner .pct   { color: #6ee7b7; font-weight: 600; margin-left: auto; }
  .chat-view { display: flex; flex-direction: column; height: 100%; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 14px 10%; display: flex; flex-direction: column; gap: 10px; }
  .chat-msg { max-width: 100%; padding: 9px 13px; border-radius: 10px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .chat-msg.chat-user { align-self: flex-end; background: #3b5bdb; color: #fff; }
  .chat-msg.chat-assistant { align-self: flex-start; background: #14162a; border: 1px solid rgba(255,255,255,0.08); max-width: 100%; }
  .chat-msg.chat-tool { align-self: flex-start; background: none; color: #7c84ab; font-size: 11px; font-family: ui-monospace, monospace; padding: 2px 13px; }
  .chat-msg.chat-system { align-self: center; color: #f87171; font-size: 11.5px; }
  /* Make chat/output content always selectable, even inside the frameless host. */
  .chat-messages, .chat-msg, .chat-msg * { user-select: text; -webkit-user-select: text; }
  .chat-welcome { margin: auto 0; text-align: center; padding: 24px 8px; color: #8b93b8; }
  .chat-welcome .mark { font-size: 38px; filter: drop-shadow(0 0 16px rgba(110,168,255,0.55)); }
  .chat-welcome h2 { margin: 10px 0 6px; font-size: 17px; font-weight: 600; letter-spacing: .04em;
    background: linear-gradient(92deg, #cfe0ff, #6ea8ff 55%, #b98cff);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .chat-welcome p { margin: 0 auto 16px; font-size: 12.5px; line-height: 1.65; max-width: 42ch; color: #7c84ab; }
  .chat-welcome .hints { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .chat-welcome .hints span { font-size: 11.5px; color: #9aa1c7; background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.07); border-radius: 999px; padding: 5px 13px; }
  .chat-input-row { flex: none; display: flex; gap: 8px; padding: 12px 10%; border-top: 1px solid rgba(255,255,255,0.08); }
  .chat-input-row input { flex: 1; width: auto; background: #12142a; border: 1px solid rgba(255,255,255,0.12); color: #e6e9f5;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; outline: none; }
  .chat-input-row button { background: #3b5bdb; border: none; color: #fff; border-radius: 8px; padding: 0 18px; font-size: 13px; cursor: pointer; }

  .code-block { margin: 8px 0; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); background: #21222c; }
  .code-block-bar { display: flex; align-items: center; gap: 8px; padding: 5px 10px; background: #191a24; font-size: 10.5px; color: #8b93b8; }
  .code-block-bar .lang { font-family: ui-monospace, monospace; text-transform: uppercase; letter-spacing: .04em; }
  .code-block-bar .spacer { flex: 1; }
  .code-block-bar button { background: none; border: 1px solid rgba(255,255,255,0.15); color: #9aa1c7; border-radius: 5px;
    font-size: 10.5px; padding: 2px 8px; cursor: pointer; }
  .code-block-bar button:hover { color: #eef1ff; border-color: rgba(255,255,255,0.35); }
  .code-block .CodeMirror { height: auto; max-height: 340px; font-size: 12.5px; }
  /* Run output sits directly under the block that produced it — the result
     and the code stay in one place. */
  .run-output { margin: -4px 0 10px; border: 1px solid rgba(255,255,255,0.1); border-top: none;
    border-radius: 0 0 8px 8px; background: #14162a; overflow: hidden; }
  .run-output .run-head { padding: 5px 10px; font-size: 11px; cursor: pointer; user-select: none;
    background: rgba(255,255,255,0.03); color: #9aa1c7; }
  .run-output.ok .run-head { color: #6ee7b7; }
  .run-output.bad .run-head { color: #f87171; }
  .run-output .run-body { margin: 0; padding: 8px 10px; font-family: ui-monospace, monospace; font-size: 11.5px;
    color: #cfd3ec; white-space: pre-wrap; word-break: break-word; max-height: 260px; overflow: auto;
    user-select: text; -webkit-user-select: text; }
  .run-output .run-cmd { padding: 4px 10px 7px; font-family: ui-monospace, monospace; font-size: 10px;
    color: #5b6289; border-top: 1px solid rgba(255,255,255,0.06); user-select: text; -webkit-user-select: text; }
  .code-block .CodeMirror, .code-block .CodeMirror * { user-select: text; -webkit-user-select: text; }

  .code-collapsed { margin: 8px 0; padding: 7px 12px; border-radius: 8px; background: #14162a; border: 1px solid rgba(255,255,255,0.08);
    font-size: 11.5px; color: #7c84ab; cursor: pointer; font-family: ui-monospace, monospace; }
  .code-collapsed:hover { color: #cfd3ec; border-color: rgba(255,255,255,0.2); }

  /* ---- editor --------------------------------------------------------- */
  .editor-view { display: flex; flex-direction: row; height: 100%; }
  .file-tree { width: 220px; flex: none; overflow-y: auto; border-right: 1px solid rgba(255,255,255,0.08); padding: 8px; font-size: 12px; }
  .file-row { padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
  /* File-tree icons used to be 📁 / 📄 emoji. WebView2's fallback font set
     doesn't carry the color-emoji glyphs and rendered them as missing-glyph
     boxes — the leading column of every row was a small rectangle. Inline
     SVG draws a folder/page at the same size as the text. */
  .file-row .ft-icon { flex: none; width: 14px; height: 14px; color: #8b93b8; display: inline-flex; align-items: center; justify-content: center; }
  .file-row.dir .ft-icon { color: #6ea8ff; }
  .file-row:hover { background: rgba(255,255,255,0.06); }
  .file-row.selected { background: rgba(59,91,219,0.3); }
  .editor-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .editor-tabs { flex: none; display: flex; overflow-x: auto; background: #0d0f20; border-bottom: 1px solid rgba(255,255,255,0.07); }
  .editor-tab { display: flex; align-items: center; gap: 6px; padding: 6px 10px; font-size: 11.5px; color: #9aa1c7; cursor: pointer;
    border-right: 1px solid rgba(255,255,255,0.06); white-space: nowrap; }
  .editor-tab.active { color: #eef1ff; background: #14162a; }
  .editor-tab .x { opacity: .6; }
  .editor-tab .x:hover { opacity: 1; }
  .editor-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid rgba(255,255,255,0.08); }
  .editor-path { font-size: 11.5px; color: #9aa1c7; font-family: ui-monospace, monospace; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .editor-btn { background: #3b5bdb; border: none; color: #fff; border-radius: 6px; padding: 5px 14px; font-size: 12px; cursor: pointer; }
  .editor-status { font-size: 10.5px; color: #7c84ab; }
  .editor-cm-host { flex: 1; min-height: 0; }
  .editor-cm-host .CodeMirror { height: 100%; font-size: 13px; }
  /* padding + wrapping: this line used to run straight off the right edge
     of the window in a narrow editor pane */
  .editor-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: #5b6289;
    font-size: 12.5px; padding: 0 18px; text-align: center; }

  /* ---- file explorer context menu ------------------------------------ */
  #ctxMenu { position: fixed; z-index: 900; min-width: 194px; padding: 5px;
    background: #14162a; border: 1px solid rgba(255,255,255,0.13); border-radius: 8px;
    box-shadow: 0 14px 38px rgba(0,0,0,0.55); font-size: 12.5px; display: none; }
  #ctxMenu.open { display: block; }
  .ctx-item { padding: 6px 10px; border-radius: 5px; color: #cfd3ec; cursor: pointer;
    display: flex; align-items: center; gap: 9px; white-space: nowrap; }
  .ctx-item:hover { background: #3b5bdb; color: #fff; }
  .ctx-item.danger:hover { background: #c0392b; }
  .ctx-item.disabled { color: #4d5378; pointer-events: none; }
  .ctx-item .k { margin-left: auto; font-size: 10.5px; opacity: .55; }
  .ctx-sep { height: 1px; background: rgba(255,255,255,0.09); margin: 4px 3px; }

  /* A real dialog: window.prompt is unreliable inside WebView2, and a
     rename that silently does nothing is worse than no rename. */
  #askRoot { position: fixed; inset: 0; z-index: 950; display: none;
    align-items: center; justify-content: center; background: rgba(0,0,0,0.45); }
  #askRoot.open { display: flex; }
  .ask-box { width: 420px; max-width: 92vw; background: #14162a; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.12); padding: 16px 18px; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
  .ask-box h4 { margin: 0 0 10px; font-size: 13px; color: #eef1ff; text-transform: none;
    letter-spacing: 0; }
  .ask-box p { margin: 0 0 12px; font-size: 12.5px; color: #9aa1c7; line-height: 1.5; }
  .ask-box input { width: 100%; background: #0d0f20; border: 1px solid rgba(255,255,255,0.14);
    color: #e6e9f5; border-radius: 6px; padding: 7px 9px; font-size: 12.5px; outline: none; }
  .ask-row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .ask-row button { border: none; border-radius: 6px; padding: 7px 15px; font-size: 12.5px; cursor: pointer; }
  .ask-ok { background: #3b5bdb; color: #fff; }
  .ask-ok.danger { background: #c0392b; }
  .ask-cancel { background: #1b1e38; color: #e6e9f5; border: 1px solid rgba(255,255,255,0.15); }

  /* ---- docking: columns + the nine drop targets ---------------------- */
  .dock-column { display: flex; flex-direction: column; min-width: 0; min-height: 0; overflow: hidden; }
  .dock-column .panel + .panel { border-top: 1px solid rgba(255,255,255,0.07); }
  .panel-btn.panel-close:hover { background: #c0392b; color: #fff; }

  #dockTargets { position: absolute; inset: 0; z-index: 400; pointer-events: none;
    opacity: 0; transition: opacity .12s ease; }
  #dockTargets.visible { opacity: 1; }
  .dock-zone { position: absolute; width: 33.333%; height: 33.333%;
    display: flex; align-items: center; justify-content: center; }
  .dock-pip { width: 46px; height: 34px; border-radius: 6px;
    background: rgba(16,20,42,0.85); border: 1px solid rgba(140,170,255,0.45);
    box-shadow: 0 4px 14px rgba(0,0,0,0.45); transition: transform .1s ease, background .1s ease; }
  .dock-zone.hot .dock-pip { background: #3b5bdb; border-color: #9ab6ff; transform: scale(1.28); }
  /* Dock preview: a thin outline that hugs the exact slot the panel will
     land in. The old version was a full-height 33% rectangle that filled
     the screen and obscured the zones beneath it. */
  .dock-preview { position: absolute; display: none; background: rgba(59,91,219,0.14);
    border: 2px solid #6ea8ff; border-radius: 8px; pointer-events: none; box-shadow: 0 0 24px rgba(110,168,255,0.25); }

  /* ---- modals --------------------------------------------------------- */
  #modalRoot { position: fixed; inset: 0; z-index: 500; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,0.5); }
  #modalRoot.open { display: flex; }
  /* Settings opens *modeless*: no dimmed backdrop swallowing clicks, so the
     editor, chat and menus stay usable while it's open — you can copy a key
     or an endpoint out of a file and paste it in without the panel closing
     and losing what you already typed. The root keeps covering the window
     for layout only; pointer events go straight through it to the app. */
  #modalRoot.modeless { background: none; pointer-events: none; }
  #modalRoot.modeless .modal-box { pointer-events: auto; position: absolute; margin: 0; }
  #modalRoot.modeless .modal-box h3 { cursor: move; }
  .modal-box h3 .drag-hint { float: right; font-size: 10.5px; font-weight: 400; color: #5b6289;
    letter-spacing: .02em; padding-top: 3px; }
  .modal-box { width: 420px; max-width: 90vw; max-height: 80vh; overflow-y: auto; background: #14162a; border: 1px solid rgba(255,255,255,0.12);
    border-radius: 10px; padding: 18px 20px; box-shadow: 0 24px 64px rgba(0,0,0,0.6); }
  .modal-box h3 { margin: 0 0 10px; font-size: 14px; color: #eef1ff; }
  .modal-box .body { font-size: 12.5px; line-height: 1.6; color: #cfd3ec; }
  .modal-box .close-row { margin-top: 16px; text-align: right; }
  .modal-box button { background: #3b5bdb; border: none; color: #fff; border-radius: 6px; padding: 6px 16px; font-size: 12px; cursor: pointer; }
  .modal-box code { background: #0d0f20; padding: 1px 5px; border-radius: 4px; }
  .modal-box dt { color: #9aa1c7; margin-top: 8px; }
  .modal-box dd { margin: 2px 0 0; }
  .modal-box.wide { width: 560px; }
  .modal-box h4 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .04em; color: #6c7399; margin: 18px 0 8px; }
  .provider-row { display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px; background: #0d0f20;
    border: 1px solid rgba(255,255,255,0.06); margin-bottom: 6px; font-size: 12px; }
  .provider-row .name { font-weight: 600; color: #eef1ff; flex: none; }
  /* The masked key is as long as the key itself — ~70 chars for an NVIDIA
     one — and with nothing bounding it, it pushed Edit and Delete clean off
     the row. It's the one element here allowed to shrink; the controls are
     never allowed to. */
  .provider-row .key { color: #7c84ab; font-family: ui-monospace, monospace; font-size: 11px;
    flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .provider-row .model { color: #6ea8ff; font-size: 11px; flex: none; }
  .provider-row .model.unset { color: #f0b45f; }
  .provider-row .spacer { flex: 0 1 auto; }
  .provider-row button, .provider-row .active-badge { flex: none; }
  .provider-row .active-badge { font-size: 10px; background: rgba(110,230,180,0.15); border: 1px solid rgba(110,230,180,0.4);
    color: #6ee7b7; border-radius: 10px; padding: 1px 8px; }
  .provider-row button { background: #1b1e38; border: 1px solid rgba(255,255,255,0.15); color: #cfd3ec; border-radius: 5px;
    padding: 3px 9px; font-size: 11px; cursor: pointer; }
  .provider-row button:hover { border-color: rgba(255,255,255,0.35); }
  .settings-form label { display: block; font-size: 11px; color: #8b93b8; margin: 8px 0 3px; }
  .settings-form input[type=text], .settings-form input[type=password] { width: 100%; background: #0d0f20;
    border: 1px solid rgba(255,255,255,0.12); color: #e6e9f5; border-radius: 6px; padding: 6px 8px; font-size: 12.5px; outline: none; }
  .settings-checkbox { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #cfd3ec; margin-top: 6px; }
  .settings-checkbox input { accent-color: #6ea8ff; }
  /* Layout Options modal — same shape as settings, but tighter and grey
     buttons (no live save). Plain checkbox rows so the toggles read as
     "this changes behaviour", not as a form to submit. */
  .layout-opt-row { display: flex; align-items: flex-start; gap: 9px; padding: 9px 10px;
    margin-top: 10px; background: #0d0f20; border: 1px solid rgba(255,255,255,0.07);
    border-radius: 7px; font-size: 12.5px; color: #cfd3ec; }
  .layout-opt-row input { margin-top: 2px; accent-color: #6ea8ff; }
  .layout-opt-row .lbl { font-weight: 600; color: #eef1ff; display: block; margin-bottom: 2px; }
  .layout-opt-row .desc { color: #8b93b8; font-size: 11.5px; line-height: 1.45; }
  .layout-opt-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .layout-opt-actions button { background: #1b1e38; border: 1px solid rgba(255,255,255,0.15);
    color: #eef1ff; border-radius: 6px; padding: 6px 14px; font-size: 12px; cursor: pointer; }
  .layout-opt-actions button:hover { border-color: rgba(255,255,255,0.3); }
  .layout-opt-actions button.danger { background: #7f1d1d; border-color: #7f1d1d; }
  .layout-opt-actions button.danger:hover { background: #991b1b; }
  .settings-err { color: #f87171; font-size: 11px; margin-top: 6px; }

  /* ---- new project form ---------------------------------------------- */
  .np-combo { position: relative; }
  .np-list { max-height: 168px; overflow-y: auto; margin-top: 5px; border: 1px solid rgba(255,255,255,0.1);
    border-radius: 7px; background: #0d0f20; }
  .np-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; font-size: 12.5px;
    color: #cfd3ec; cursor: pointer; }
  .np-item:hover { background: rgba(255,255,255,0.05); }
  .np-item.selected { background: #3b5bdb; color: #fff; }
  .np-item.unavailable .np-label { color: #6c7399; }
  .np-item .np-warn { margin-left: auto; font-size: 10px; color: #f0b45f; }
  .np-meta { font-size: 11.5px; color: #9aa1c7; margin-top: 7px; min-height: 1.4em; }
  .np-console { margin-top: 5px; height: 190px; overflow-y: auto; background: #05060f;
    border: 1px solid rgba(255,255,255,0.1); border-radius: 7px; padding: 8px 10px;
    font-family: ui-monospace, Consolas, monospace; font-size: 11.5px; line-height: 1.55; }
  .np-line { white-space: pre-wrap; word-break: break-word; color: #c4c9e6; }
  .np-line.cmd { color: #6ea8ff; }
  .np-line.ok { color: #6ee7b7; }
  .np-line.err { color: #f87171; }
  .np-line.dim { color: #5b6289; }
</style>
</head>
<body>
<div id="app">
  <div id="titlebar" class="pywebview-drag-region">
    <div class="brand"><span class="icon">🧠</span><span>DariusAI</span><span class="version" id="versionBadge"></span></div>
    <div class="spacer"></div>
    <button id="btnReload" title="This window is running an older build of the app" style="display:none">⟳ New build — Reload</button>
    <!-- Titlebar window buttons. They used to be Unicode glyphs (─, ▢, ✕)
         that render fine in Segoe UI on a normal Edge tab but show as
         missing-glyph boxes inside WebView2's fallback font set, so the
         min/max/close icons looked broken. Inline SVG draws the same
         affordances without depending on font coverage. -->
    <button class="win-btn" id="btnMinimize" title="Minimize"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><line x1="0" y1="8" x2="10" y2="8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
    <button class="win-btn" id="btnMaximize" title="Maximize">
      <svg class="maximize" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="0.7" y="0.7" width="8.6" height="8.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      <svg class="restore" width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><rect x="2.7" y="2.7" width="6.6" height="6.6" fill="none" stroke="currentColor" stroke-width="1.2"/><polyline points="0.7,6 0.7,0.7 6,0.7" fill="none" stroke="currentColor" stroke-width="1.2"/></svg>
    </button>
    <button class="win-btn close" id="btnClose" title="Close"><svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><line x1="1" y1="1" x2="9" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><line x1="9" y1="1" x2="1" y2="9" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg></button>
  </div>
  <div id="menubar">
    <div class="menu" data-menu="file">File
      <div class="menu-dropdown">
        <div class="menu-item" data-action="new-project">New Project…</div>
        <div class="menu-item" data-action="open-folder">Open Project Folder…</div>
        <div class="menu-sep"></div>
        <div class="menu-item" data-action="exit">Exit</div>
      </div>
    </div>
    <div class="menu" data-menu="edit">Edit
      <div class="menu-dropdown">
        <div class="menu-item" data-action="undo">Undo</div>
        <div class="menu-item" data-action="redo">Redo</div>
        <div class="menu-sep"></div>
        <div class="menu-item" data-action="copy">Copy</div>
        <div class="menu-item" data-action="cut">Cut</div>
        <div class="menu-item" data-action="paste">Paste</div>
        <div class="menu-item" data-action="select-all">Select All</div>
        <div class="menu-sep"></div>
        <div class="menu-item" data-action="find">Find…</div>
      </div>
    </div>
    <div class="menu" data-menu="settings">Settings
      <div class="menu-dropdown">
        <div class="menu-item" data-action="show-settings">Preferences…</div>
        <div class="menu-sep"></div>
        <div class="menu-item" data-action="show-layout-options">Layout Options…</div>
      </div>
    </div>
    <div class="menu" data-menu="help">Help
      <div class="menu-dropdown">
        <div class="menu-item" data-action="show-help">Keyboard &amp; Usage…</div>
      </div>
    </div>
    <div class="menu" data-menu="about">About
      <div class="menu-dropdown">
        <div class="menu-item" data-action="show-about">About DariusAI</div>
      </div>
    </div>
  </div>
  <div id="workspace">
    <div id="dockRow"></div>
    <div id="floatingLayer"></div>
  </div>
</div>

<div id="tooltip"></div>
<div id="nodeInspector">
  <button class="close" id="inspectorClose">✕</button>
  <button class="edit" id="inspectorEdit" style="display:none">✎ Edit</button>
  <div id="inspectorContent"></div>
</div>

<script>
(function () {
  "use strict";

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  // Version comes from the server (/api/version -> dariusai.__version__), so
  // the title bar badge and the About box can never claim a version the
  // running package isn't. Filled in asynchronously; both readers tolerate
  // the empty default in the moment before the fetch lands.
  var APP_VERSION = { version: "", display: "" };
  var loadedBuild = null;

  function readVersion() {
    return fetch("/api/version", { cache: "no-store" }).then(function (r) { return r.json(); });
  }

  readVersion().then(function (v) {
    APP_VERSION = v;
    loadedBuild = v.page_build;
    var badge = document.getElementById("versionBadge");
    badge.textContent = v.display;
    badge.title = "DariusAI " + v.version;
    badge.classList.toggle("prerelease", /alpha|beta|rc/.test(v.display));
  }).catch(function () { /* offline/static hosting — the badge just stays empty */ });

  // A window left open across an update keeps running the page it was
  // loaded with — old JS, old CSS, none of the fixes — and looks broken in
  // a way nothing in the UI explains. Poll the build the server would serve
  // now, and if it has moved on, say so instead of leaving it to be
  // guessed at.
  setInterval(function () {
    if (document.hidden || loadedBuild === null) return;
    readVersion().then(function (v) {
      if (v.page_build && v.page_build !== loadedBuild) {
        document.getElementById("btnReload").style.display = "";
      }
    }).catch(function () { /* server restarting — try again next tick */ });
  }, 5000);

  var EXT_MODE = {
    py: "python", js: "javascript", mjs: "javascript", ts: "javascript", jsx: "javascript", tsx: "javascript",
    c: "text/x-csrc", h: "text/x-csrc", cpp: "text/x-c++src", hpp: "text/x-c++src", cc: "text/x-c++src",
    cs: "text/x-csharp", java: "text/x-java",
    html: "htmlmixed", htm: "htmlmixed", xml: "xml",
    css: "css", md: "markdown", markdown: "markdown",
    sh: "shell", bash: "shell", ps1: "shell",
    rs: "rust", go: "go",
    json: "javascript", yml: "javascript", yaml: "javascript",
  };
  function modeForFilename(name) {
    var ext = (name.split(".").pop() || "").toLowerCase();
    return EXT_MODE[ext] || null;
  }
  var LANG_MODE = {
    python: "python", py: "python", javascript: "javascript", js: "javascript", ts: "javascript", typescript: "javascript",
    c: "text/x-csrc", cpp: "text/x-c++src", "c++": "text/x-c++src", csharp: "text/x-csharp", "c#": "text/x-csharp",
    java: "text/x-java", html: "htmlmixed", xml: "xml", css: "css", markdown: "markdown", md: "markdown",
    sh: "shell", bash: "shell", shell: "shell", rust: "rust", rs: "rust", go: "go", golang: "go", json: "javascript",
  };
  function modeForLang(lang) { return LANG_MODE[(lang || "").toLowerCase()] || null; }

  // =====================================================================
  // Window Manager — dockable/floating panels with persisted layout
  // =====================================================================
  var WM = (function () {
    var STORAGE_KEY = "dariusai.layout.v2";
    // Three columns, each holding a stack of panels. A slot is "<column>:<row>"
    // where column is left|centre|right and row is top|middle|bottom — the
    // nine drop targets. DOCK_ORDER survives only as the default arrangement
    // and as the reset target; live placement comes from each panel's slot.
    var DOCK_ORDER = ["neural", "chat", "editor"];
    var COLUMNS = ["left", "centre", "right"];
    var ROWS = ["top", "middle", "bottom"];
    var DEFAULT_SLOTS = { neural: "left:middle", chat: "centre:middle", editor: "right:middle" };

    function slotOf(panel) {
      return panel.slot || DEFAULT_SLOTS[panel.id] || "centre:middle";
    }

    function closePanel(panel) {
      // A popout is disposable; a core panel is not — closing one docks it
      // back rather than destroying a view the user can't recreate.
      if (panel.closable) {
        if (panel.el.parentNode) panel.el.parentNode.removeChild(panel.el);
        delete panels[panel.id];
      } else if (panel.mode === "floating") {
        setMode(panel, "docked");
      } else {
        panel.el.classList.add("collapsed-away");
        panel.hidden = true;
        rebuildDockRow();
      }
      saveState();
      window.dispatchEvent(new Event("resize"));
    }
    var panels = {};
    var zCounter = 100;

    function loadState() {
      try {
        var raw = localStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : {};
      } catch (e) { return {}; }
    }
    function saveState() {
      var state = {};
      DOCK_ORDER.forEach(function (id) {
        var p = panels[id];
        if (!p) return;
        state[id] = { mode: p.mode, x: p.x, y: p.y, w: p.w, h: p.h,
                      dockWidth: p.dockWidth, slot: p.slot, hidden: !!p.hidden };
      });
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
    }

    function bringToFront(panel) { zCounter++; panel.el.style.zIndex = zCounter; }

    function applyFloatingRect(panel) {
      panel.el.style.left = panel.x + "px";
      panel.el.style.top = panel.y + "px";
      panel.el.style.width = panel.w + "px";
      panel.el.style.height = panel.h + "px";
    }

    function rebuildDockRow() {
      var row = document.getElementById("dockRow");
      row.innerHTML = "";

      // Bucket every docked panel by column, ordered top -> middle -> bottom
      // within each. An empty column takes no space, so docking three panels
      // into one column gives a single stacked column, exactly as VS does.
      var byColumn = { left: [], centre: [], right: [] };
      Object.keys(panels).forEach(function (id) {
        var p = panels[id];
        if (!p || p.mode !== "docked" || p.hidden) return;
        var parts = slotOf(p).split(":");
        var col = byColumn[parts[0]] ? parts[0] : "centre";
        byColumn[col].push({ panel: p, row: ROWS.indexOf(parts[1]) < 0 ? 1 : ROWS.indexOf(parts[1]) });
      });

      var lastColumnPanel = null;
      COLUMNS.forEach(function (col) {
        var members = byColumn[col];
        if (!members.length) return;
        members.sort(function (a, b) { return a.row - b.row; });

        if (lastColumnPanel) {
          var sp = document.createElement("div");
          sp.className = "splitter";
          sp.dataset.left = lastColumnPanel.id;
          attachSplitter(sp, lastColumnPanel);
          row.appendChild(sp);
        }

        var wrap = document.createElement("div");
        wrap.className = "dock-column";
        wrap.style.flex = members[0].panel.dockWidth
          ? ("0 0 " + members[0].panel.dockWidth + "px") : "1 1 0";
        members.forEach(function (m) {
          m.panel.el.style.flex = "1 1 0";
          wrap.appendChild(m.panel.el);
        });
        row.appendChild(wrap);
        lastColumnPanel = members[0].panel;
      });
    }

    function attachSplitter(sp, leftPanel) {
      // Resize the column WRAP, not the first panel inside it. The wrap lives
      // in #dockRow (flex-direction: row), so flex-basis on it is the column's
      // width and dragging the splitter actually moves the next column over.
      // Writing flex onto `leftPanel.el` looked correct in isolation but the
      // panel sits inside a column-direction wrap, so flex-basis was being
      // applied to the panel's height — the splitter dragged sideways and the
      // panel stretched down instead, clipped by overflow: hidden. Felt like
      // the resize was running on the wrong axis.
      var dragging = false, startX = 0, startW = 0;
      function leftWrap() { return leftPanel.el.parentElement; }
      sp.addEventListener("mousedown", function (ev) {
        var wrap = leftWrap();
        dragging = true;
        startX = ev.clientX;
        startW = wrap ? wrap.getBoundingClientRect().width : leftPanel.el.getBoundingClientRect().width;
        sp.classList.add("active");
        ev.preventDefault();
      });
      window.addEventListener("mousemove", function (ev) {
        if (!dragging) return;
        var w = Math.max(220, Math.min(window.innerWidth - 300, startW + (ev.clientX - startX)));
        leftPanel.dockWidth = w;
        var wrap = leftWrap();
        if (wrap && wrap.classList.contains("dock-column")) {
          wrap.style.flex = "0 0 " + w + "px";
        }
        window.dispatchEvent(new Event("resize"));
      });
      window.addEventListener("mouseup", function () {
        if (dragging) { dragging = false; sp.classList.remove("active"); saveState(); }
      });
    }

    // ---- dock targets ---------------------------------------------------
    // Nine zones over the workspace: three columns x three rows. They appear
    // only while a floating panel is being dragged, the nearest one lights
    // up, and a preview shows where the panel would land.
    var dockOverlay = null, activeZone = null;

    function showDockTargets() {
      if (dockOverlay) return;
      dockOverlay = document.createElement("div");
      dockOverlay.id = "dockTargets";
      COLUMNS.forEach(function (col, ci) {
        ROWS.forEach(function (rowName, ri) {
          var zone = document.createElement("div");
          zone.className = "dock-zone";
          zone.dataset.slot = col + ":" + rowName;
          zone.style.left = (ci * 33.333) + "%";
          zone.style.top = (ri * 33.333) + "%";
          zone.innerHTML = "<span class='dock-pip'></span>";
          dockOverlay.appendChild(zone);
        });
      });
      var preview = document.createElement("div");
      preview.className = "dock-preview";
      preview.id = "dockPreview";
      dockOverlay.appendChild(preview);
      document.getElementById("workspace").appendChild(dockOverlay);
      requestAnimationFrame(function () { dockOverlay.classList.add("visible"); });
    }

    function updateDockTarget(clientX, clientY) {
      if (!dockOverlay) return;
      var ws = document.getElementById("workspace").getBoundingClientRect();
      var inside = clientX >= ws.left && clientX <= ws.right && clientY >= ws.top && clientY <= ws.bottom;
      activeZone = null;
      var preview = document.getElementById("dockPreview");

      Array.prototype.forEach.call(dockOverlay.querySelectorAll(".dock-zone"), function (zone) {
        var r = zone.getBoundingClientRect();
        var hit = inside && clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
        zone.classList.toggle("hot", hit);
        if (hit) activeZone = zone.dataset.slot;
      });

      if (activeZone && preview) {
        var zone = dockOverlay.querySelector('[data-slot="' + activeZone + '"]');
        if (zone) {
          var zr = zone.getBoundingClientRect();
          preview.style.display = "block";
          preview.style.left = (zr.left - ws.left) + "px";
          preview.style.top = (zr.top - ws.top) + "px";
          preview.style.width = zr.width + "px";
          preview.style.height = zr.height + "px";
        }
      } else if (preview) {
        preview.style.display = "none";
      }
    }

    function hideDockTargets() {
      if (!dockOverlay) return;
      dockOverlay.parentNode.removeChild(dockOverlay);
      dockOverlay = null;
    }

    function setMode(panel, mode) {
      if (panel.mode === mode) return;
      if (mode === "floating") {
        var rect = panel.el.getBoundingClientRect();
        panel.x = panel.x != null ? panel.x : rect.left + 20;
        panel.y = panel.y != null ? panel.y : rect.top + 20;
        panel.w = panel.w || Math.max(420, rect.width * 0.8);
        panel.h = panel.h || Math.max(320, rect.height * 0.8);
        panel.mode = "floating";
        panel.el.classList.add("floating");
        applyFloatingRect(panel);
        document.getElementById("floatingLayer").appendChild(panel.el);
        bringToFront(panel);
        panel.toggleBtn.textContent = "⧉";
        panel.toggleBtn.title = "Dock";
      } else {
        panel.mode = "docked";
        panel.el.classList.remove("floating");
        panel.el.style.left = panel.el.style.top = panel.el.style.width = panel.el.style.height = panel.el.style.zIndex = "";
        rebuildDockRow();
        panel.toggleBtn.textContent = "⤢";
        panel.toggleBtn.title = "Float";
      }
      saveState();
      window.dispatchEvent(new Event("resize"));
    }

    function createPanel(id, title, contentEl) {
      var el = document.createElement("div");
      el.className = "panel";
      el.dataset.id = id;

      var bar = document.createElement("div");
      bar.className = "panel-titlebar";
      var titleSpan = document.createElement("span");
      titleSpan.className = "panel-title";
      titleSpan.textContent = title;
      var btns = document.createElement("span");
      btns.className = "panel-btns";
      var toggleBtn = document.createElement("button");
      toggleBtn.className = "panel-btn";
      toggleBtn.textContent = "⤢";
      toggleBtn.title = "Float";
      // Every panel gets a close button. Popped-out code blocks had none at
      // all, and their dock button made them vanish — alive in `panels`,
      // absent from the DOM, unrecoverable.
      var closeBtn = document.createElement("button");
      closeBtn.className = "panel-btn panel-close";
      closeBtn.textContent = "✕";
      closeBtn.title = "Close";
      btns.appendChild(toggleBtn);
      btns.appendChild(closeBtn);
      bar.appendChild(titleSpan);
      bar.appendChild(btns);

      var body = document.createElement("div");
      body.className = "panel-body";
      body.appendChild(contentEl);

      var resizeHandle = document.createElement("div");
      resizeHandle.className = "panel-resize";

      el.appendChild(bar);
      el.appendChild(body);
      el.appendChild(resizeHandle);

      // `slot` is where this panel docks: which column, and where in it.
      // Previously docking position came from a fixed DOCK_ORDER array, so a
      // panel always snapped back to the slot it was born in and a popout —
      // absent from that array — snapped back to nowhere at all.
      var panel = { id: id, el: el, toggleBtn: toggleBtn, closeBtn: closeBtn, mode: "docked",
                    x: null, y: null, w: null, h: null, dockWidth: null,
                    slot: null, closable: false };
      panels[id] = panel;

      closeBtn.addEventListener("click", function (ev) {
        ev.stopPropagation();
        closePanel(panel);
      });

      var dragging = false, dragFrom = [0, 0], startXY = [0, 0], dragOffset = [0, 0];
      bar.addEventListener("mousedown", function (ev) {
        if (ev.target === toggleBtn || ev.target === closeBtn) return;
        // Both docked and floating panels can be picked up by their title
        // bar. A docked panel is floated first so it follows the cursor;
        // a floating panel just tracks the cursor from its current spot.
        if (panel.mode !== "floating") {
          var rect = panel.el.getBoundingClientRect();
          dragOffset = [ev.clientX - rect.left, ev.clientY - rect.top];
          // Anchor the future floating rect so the panel doesn't jump on
          // pickup: it lifts where you grabbed it.
          panel.x = ev.clientX - dragOffset[0];
          panel.y = ev.clientY - dragOffset[1];
          setMode(panel, "floating");
          // setMode applied the rect; dragOffset/end-start give the same
          // picture as if we had been floating from the start.
        }
        dragging = true;
        dragFrom = [ev.clientX, ev.clientY];
        startXY = [panel.x, panel.y];
        bringToFront(panel);
        showDockTargets();          // VS-style: targets appear as you pick it up
        ev.preventDefault();
      });
      var resizing = false, resizeFrom = [0, 0], resizeStartWH = [0, 0];
      resizeHandle.addEventListener("mousedown", function (ev) {
        // Docked-mode handle = pop-out button: float the panel immediately.
        // Floating-mode handle = corner resize: track the drag.
        if (panel.mode !== "floating") {
          ev.stopPropagation();
          ev.preventDefault();
          setMode(panel, "floating");
          return;
        }
        resizing = true; resizeFrom = [ev.clientX, ev.clientY]; resizeStartWH = [panel.w, panel.h];
        bringToFront(panel);
        ev.preventDefault(); ev.stopPropagation();
      });
      window.addEventListener("mousemove", function (ev) {
        if (dragging) {
          panel.x = startXY[0] + (ev.clientX - dragFrom[0]);
          panel.y = startXY[1] + (ev.clientY - dragFrom[1]);
          applyFloatingRect(panel);
          updateDockTarget(ev.clientX, ev.clientY);   // light the nearest zone
        } else if (resizing) {
          panel.w = Math.max(320, resizeStartWH[0] + (ev.clientX - resizeFrom[0]));
          panel.h = Math.max(220, resizeStartWH[1] + (ev.clientY - resizeFrom[1]));
          applyFloatingRect(panel);
          window.dispatchEvent(new Event("resize"));
        }
      });
      window.addEventListener("mouseup", function () {
        if (dragging) {
          // Dropped on a zone: dock it there. This is the whole point —
          // where it lands is where you dropped it, not where it was born.
          if (activeZone) {
            panel.slot = activeZone;
            setMode(panel, "docked");
          }
          hideDockTargets();
          activeZone = null;
        }
        if (dragging || resizing) { saveState(); window.dispatchEvent(new Event("resize")); }
        dragging = false; resizing = false;
      });
      el.addEventListener("mousedown", function () { if (panel.mode === "floating") bringToFront(panel); });
      toggleBtn.addEventListener("click", function () { setMode(panel, panel.mode === "docked" ? "floating" : "docked"); });

      return panel;
    }

    function createFloatingOnly(id, title, contentEl, rect) {
      var panel = createPanel(id, title, contentEl);
      panel.closable = true;   // a popped-out code block can be thrown away
      panel.x = rect.x; panel.y = rect.y; panel.w = rect.w; panel.h = rect.h;
      panel.mode = "docked"; // force setMode to actually transition
      setMode(panel, "floating");
      return panel;
    }

    function applyLayout(state) {
      DOCK_ORDER.forEach(function (id) {
        var p = panels[id];
        var saved = state[id];
        if (!p || !saved) return;
        p.dockWidth = saved.dockWidth || null;
        // Layouts saved before slots existed simply have none — they fall
        // back to the default arrangement rather than breaking on load.
        p.slot = saved.slot || null;
        p.hidden = !!saved.hidden;
        if (saved.mode === "floating") {
          p.x = saved.x; p.y = saved.y; p.w = saved.w; p.h = saved.h;
          p.mode = "docked";
          setMode(p, "floating");
        }
      });
      rebuildDockRow();
    }

    function resetLayout() {
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      // Close stray popouts, then put the three core panels back where they
      // belong. This is the escape hatch if a layout ends up unusable.
      Object.keys(panels).forEach(function (id) {
        var p = panels[id];
        if (p && p.closable) closePanel(p);
      });
      DOCK_ORDER.forEach(function (id) {
        var p = panels[id];
        if (!p) return;
        if (p.mode === "floating") setMode(p, "docked");
        p.dockWidth = null;
        p.slot = DEFAULT_SLOTS[id] || null;
        p.hidden = false;
        p.el.classList.remove("collapsed-away");
      });
      rebuildDockRow();
      window.dispatchEvent(new Event("resize"));
    }

    function init() {
      rebuildDockRow();
      applyLayout(loadState());
    }

    return { createPanel: createPanel, createFloatingOnly: createFloatingOnly, init: init, resetLayout: resetLayout, saveState: saveState, panels: panels };
  })();

  // =====================================================================
  // Neural View — 3D orbit-camera galaxy of the brain graph. Central Brain
  // node renders as a glowing pulsing core; edges "electrify" (jagged,
  // flickering, bright) while a pulse is actively traveling them; any node
  // touched by real activity keeps a sustained glow, not just a one-shot
  // flash, so "in use" reads visually, not just for an instant.
  // =====================================================================
  var COORDINATOR_ID = "brain-coordinator";

  function buildNeuralView(container) {
    var canvas = document.createElement("canvas");
    container.appendChild(canvas);
    var ctx = canvas.getContext("2d");
    var W = 0, H = 0, DPR = Math.max(1, window.devicePixelRatio || 1);

    // Neural-view preferences: which 3D-scene toggles are on. Persisted in
    // localStorage so the choices survive a reload. Defaults to "all on" so
    // a fresh install looks identical to the pre-toggles build.
    var NEURAL_PREFS_KEY = "dariusai.neural.v1";
    function loadNeuralPrefs() {
      try {
        var raw = localStorage.getItem(NEURAL_PREFS_KEY);
        if (!raw) return { showLabels: true, showAnimations: true };
        var p = JSON.parse(raw);
        return { showLabels: p.showLabels !== false, showAnimations: p.showAnimations !== false };
      } catch (e) { return { showLabels: true, showAnimations: true }; }
    }
    function saveNeuralPrefs() {
      try { localStorage.setItem(NEURAL_PREFS_KEY, JSON.stringify(neuralPrefs)); } catch (e) {}
    }
    var neuralPrefs = loadNeuralPrefs();

    var hud = document.createElement("div");
    hud.className = "hud";
    hud.innerHTML =
      "<div class='hud-bar'><span class='live-dot' id='nvLiveDot' title='live'></span>" +
      "<input type='text' id='nvSearch' placeholder='search nodes / tags…'></div>" +
      "<div class='hud-chips' id='nvLegend'></div>";
    container.appendChild(hud);

    // Stats and the activity feed sit in the corner as bare text rather than
    // in cards — in a panel this narrow, four stacked cards down the left
    // covered the graph they were describing.
    var hudFoot = document.createElement("div");
    hudFoot.className = "hud-foot";
    hudFoot.innerHTML = "<div id='nvActivityLog'></div><div id='nvStats'></div>";
    container.appendChild(hudFoot);

    // Real-time frames-per-second readout at the bottom-right. Colour codes
    // itself by the same thresholds the user asked for: green at ~60, amber
    // in the normal band, red below 29. The element starts as `nv-fps low`
    // so the very first paint (no measurement yet) doesn't lie about being
    // healthy.
    var fpsEl = document.createElement("div");
    fpsEl.className = "nv-fps low";
    fpsEl.id = "nvFps";
    fpsEl.textContent = "— fps";
    container.appendChild(fpsEl);

    function resize() {
      var r = container.getBoundingClientRect();
      W = Math.max(1, r.width); H = Math.max(1, r.height);
      canvas.width = W * DPR; canvas.height = H * DPR;
      canvas.style.width = W + "px"; canvas.style.height = H + "px";
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    if (window.ResizeObserver) { new ResizeObserver(resize).observe(container); }
    window.addEventListener("resize", resize);
    resize();

    // ---- 3D orbit camera ---------------------------------------------
    var FOCAL = 640, NEAR = 30;
    var cam = { yaw: 0.5, pitch: 0.3, dist: 900, tx: 0, ty: 0, tz: 0 };

    function rotate(x, y, z) {
      var cosY = Math.cos(cam.yaw), sinY = Math.sin(cam.yaw);
      var x1 = x * cosY - z * sinY, z1 = x * sinY + z * cosY, y1 = y;
      var cosP = Math.cos(cam.pitch), sinP = Math.sin(cam.pitch);
      var y2 = y1 * cosP - z1 * sinP, z2 = y1 * sinP + z1 * cosP;
      return [x1, y2, z2];
    }
    function invRotate(x, y, z) {
      var cosP = Math.cos(-cam.pitch), sinP = Math.sin(-cam.pitch);
      var y1 = y * cosP - z * sinP, z1 = y * sinP + z * cosP, x1 = x;
      var cosY = Math.cos(-cam.yaw), sinY = Math.sin(-cam.yaw);
      var x2 = x1 * cosY - z1 * sinY, z2 = x1 * sinY + z1 * cosY;
      return [x2, y1, z2];
    }
    // The HUD occupies a fixed strip down the left, so the graph's optical
    // centre is the middle of what's left over, not the middle of the
    // canvas — otherwise the brain sits behind the search box. Picking uses
    // this same projection, so the two can't disagree.
    // Nudged down a little to clear the HUD strip along the top, so the
    // graph's optical centre is the middle of the space actually free.
    var HUD_STRIP_H = 64;

    function project(x, y, z) {
      var r = rotate(x - cam.tx, y - cam.ty, z - cam.tz);
      var depth = r[2] + cam.dist;
      if (depth < NEAR) return null;
      var f = FOCAL / depth;
      return { sx: W / 2 + r[0] * f, sy: (H + HUD_STRIP_H) / 2 + r[1] * f, scale: f, depth: depth };
    }

    // ---- the central brain: real 3D geometry ----------------------------
    // Built as a mesh rather than drawn as a sprite, because the camera
    // orbits: a billboard always faces you and would slide about looking
    // flat the moment you dragged. These vertices go through the same
    // rotate()/project() the graph already uses, so turning the view shows
    // a genuinely different profile — the back of the head from behind —
    // and pan/zoom keep working with no extra code.
    //
    // Generated procedurally: a displaced ellipsoid with a longitudinal
    // fissure and gyri ridges, plus a cerebellum lobe. No model file to
    // source, license, load or keep in sync, and no 3D library — the
    // renderer this project already has is enough.
    var BRAIN_RADIUS = 78;   // world units — the spec says the brain is always the largest thing

    function buildBrainMesh(lonSteps, latSteps) {
        var verts = [], faces = [];
        for (var i = 0; i <= latSteps; i++) {
          var v = i / latSteps, phi = v * Math.PI;              // 0..PI, pole to pole
          for (var j = 0; j <= lonSteps; j++) {
            var u = j / lonSteps, theta = u * Math.PI * 2;
            var sp = Math.sin(phi), cp = Math.cos(phi);
            var st = Math.sin(theta), ct = Math.cos(theta);

            // gyri: layered sines give convoluted ridges without noise tables
            var gyri = 0.055 * Math.sin(9 * theta + 2.5 * phi)
                     + 0.040 * Math.sin(13 * phi + 1.7)
                     + 0.028 * Math.sin(17 * theta - 3.1 * phi)
                     + 0.020 * Math.sin(23 * phi + 5 * theta);
            var rad = 1 + gyri;

            var x = sp * ct, y = cp, z = sp * st;

            // Longitudinal fissure: a deep groove down the midline, cut from
            // the top and fading before the underside. This is the single
            // strongest "that's a brain" cue from any viewing angle above.
            var fissure = Math.exp(-Math.pow(x * 6.5, 2)) * Math.max(0, y) * 0.30;
            rad -= fissure;

            // Temporal lobes: swell the lower flanks outward and forward, so
            // the silhouette gains the lobe that hangs beside the ear.
            var temporal = Math.exp(-Math.pow((y + 0.35) * 2.6, 2))
                         * Math.exp(-Math.pow(z * 1.1, 2)) * Math.abs(x);
            rad += 0.17 * temporal;

            // Frontal pole rounds off; occipital (back) tapers and lifts —
            // a brain is an egg lying on its side, not a ball.
            rad *= 1 - 0.10 * Math.max(0, -z) * Math.max(0, y);
            rad *= 1 + 0.06 * Math.max(0, z);

            // Underside flattens where it would sit on the brain stem.
            if (y < -0.55) rad *= 1 - 0.22 * (Math.abs(y) - 0.55);

            // Proportions: long front-to-back, narrower across, flatter still
            // in height — measured off the real thing rather than guessed.
            verts.push([x * rad * 0.80, y * rad * 0.74, z * rad * 1.06]);
          }
        }
        var stride = lonSteps + 1;
        for (var a = 0; a < latSteps; a++) {
          for (var b = 0; b < lonSteps; b++) {
            var i0 = a * stride + b;

          }
        }

        // cerebellum: a smaller squashed lobe tucked under the back
        var base = verts.length;
        var cl = 10, cn = 16;
        for (var ci = 0; ci <= cl; ci++) {
          var cv = ci / cl, cphi = cv * Math.PI;
          for (var cj = 0; cj <= cn; cj++) {
            var cu = cj / cn, cth = cu * Math.PI * 2;
            var csp = Math.sin(cphi), ccp = Math.cos(cphi);
            var ridge = 0.055 * Math.sin(22 * cphi) + 0.02 * Math.sin(9 * cth);
            var cr = 0.40 + ridge;
            // wider than tall, tucked under and behind the occipital pole
            verts.push([
              csp * Math.cos(cth) * cr * 0.92,
              ccp * cr * 0.48 - 0.46,
              csp * Math.sin(cth) * cr * 0.78 + 0.62,
            ]);
          }
        }
        var cstride = cn + 1;
        for (var ca = 0; ca < cl; ca++) {
          for (var cb = 0; cb < cn; cb++) {
            var k0 = base + ca * cstride + cb;
            faces.push([k0, k0 + 1, k0 + cstride + 1, k0 + cstride]);
          }
        }
        return { verts: verts, faces: faces };
      }

    var BRAIN = buildBrainMesh(44, 30);  // ~1300 quads; 60fps measured

    function drawBrain(centre, now, energy) {
      // Project every vertex through the shared camera, then paint faces
      // back-to-front. Painter's algorithm is enough here: the mesh is
      // convex-ish and closed, so there is nothing to interpenetrate.
      // Two passes per vertex: the rotated position (camera space, which is
      // where lighting has to happen) and the projected point. Shading off
      // screen area — my first attempt — has no idea which way a face
      // points, so the whole thing rendered as a flat disc.
      var pts = new Array(BRAIN.verts.length);
      var cam3 = new Array(BRAIN.verts.length);
      for (var i = 0; i < BRAIN.verts.length; i++) {
        var v = BRAIN.verts[i];
        var wx = centre.x + v[0] * BRAIN_RADIUS,
            wy = centre.y + v[1] * BRAIN_RADIUS,
            wz = centre.z + v[2] * BRAIN_RADIUS;
        cam3[i] = rotate(wx - cam.tx, wy - cam.ty, wz - cam.tz);
        pts[i] = project(wx, wy, wz);
      }

      var LX = -0.45, LY = -0.78, LZ = -0.44;           // key light, upper-left, toward viewer
      var drawable = [];
      for (var f = 0; f < BRAIN.faces.length; f++) {
        var face = BRAIN.faces[f];
        var a = pts[face[0]], b = pts[face[1]], c = pts[face[2]], d = pts[face[3]];
        if (!a || !b || !c || !d) continue;
        if ((b.sx - a.sx) * (c.sy - a.sy) - (b.sy - a.sy) * (c.sx - a.sx) <= 0) continue;  // back face

        var A = cam3[face[0]], B = cam3[face[1]], C = cam3[face[2]];
        var ux = B[0] - A[0], uy = B[1] - A[1], uz = B[2] - A[2];
        var vx = C[0] - A[0], vy = C[1] - A[1], vz = C[2] - A[2];
        var nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        var len = Math.hypot(nx, ny, nz) || 1;

        var lambert = Math.max(0, nx * LX + ny * LY + nz * LZ);
        var rim = Math.pow(1 - Math.abs(nz), 2.2);       // glow at the silhouette
        drawable.push({
          a: a, b: b, c: c, d: d,
          depth: (a.depth + b.depth + c.depth + d.depth) / 4,
          lambert: lambert, rim: rim,
        });
      }
      drawable.sort(function (p, q) { return q.depth - p.depth; });

      for (var k = 0; k < drawable.length; k++) {
        var t = drawable[k];
        // Pink-grey: cool grey in shadow warming to rose in the light, with
        // a violet rim so it separates from the dark background.
        var shade = 0.20 + 0.80 * t.lambert;
        var rr = Math.round(60 + 175 * shade + 42 * t.rim);
        var gg = Math.round(48 + 118 * shade + 24 * t.rim);
        var bb = Math.round(60 + 126 * shade + 66 * t.rim);
        // energy tints the whole organ toward electric blue as it works
        if (energy > 0) {
          rr = Math.round(rr * (1 - 0.18 * energy));
          gg = Math.round(gg * (1 - 0.05 * energy) + 14 * energy);
          bb = Math.round(bb * (1 - 0.02 * energy) + 46 * energy);
        }
        ctx.fillStyle = "rgb(" + rr + "," + gg + "," + bb + ")";
        ctx.beginPath();
        ctx.moveTo(t.a.sx, t.a.sy); ctx.lineTo(t.b.sx, t.b.sy);
        ctx.lineTo(t.c.sx, t.c.sy); ctx.lineTo(t.d.sx, t.d.sy);

        // turned the whole organ to mud at small sizes.
        if (t.lambert < 0.30) {

          ctx.lineWidth = 0.6;
          ctx.stroke();
        }
      }

      // Electricity across the surface, following the mesh as it turns.
      // `energy` is 0 when idle and 1 while the agent is working, so this
      // reports real activity instead of decorating.
      if (energy > 0.01) {
        var arcs = Math.round(2 + energy * 6);
        ctx.lineCap = "round";
        for (var s = 0; s < arcs; s++) {
          var seed = Math.floor(now / 90) * 31 + s * 977;
          var i1 = (seed * 1103515245 + 12345) >>> 0;
          var i2 = (i1 * 1103515245 + 12345) >>> 0;
          var p1 = pts[i1 % pts.length], p2 = pts[i2 % pts.length];
          if (!p1 || !p2) continue;
          if (Math.hypot(p2.sx - p1.sx, p2.sy - p1.sy) > 130) continue;  // keep arcs local
