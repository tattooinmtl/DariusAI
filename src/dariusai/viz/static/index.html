    }

    // ---- starfield ------------------------------------------------------
    var stars = [];
    for (var si = 0; si < 900; si++) {
      var sa = Math.random() * Math.PI * 2, sb = Math.acos(Math.random() * 2 - 1);
      var sr = 2400 + Math.random() * 2000;
      stars.push({ x: sr * Math.sin(sb) * Math.cos(sa), y: sr * Math.sin(sb) * Math.sin(sa), z: sr * Math.cos(sb),
        r: Math.random() * 1.2 + 0.3, a: Math.random() * 0.6 + 0.2 });
    }

    var COLORS = {
      brain: "#eaf2ff", skill: "#6ee7b7", tool: "#4fd1ff", language: "#38bdf8",
      framework: "#38bdf8", pattern: "#fbbf24", project: "#fb7185", preference: "#f0abfc",
      conversation: "#f97316",
    };
    function hashHue(s) {
      var h = 0;
      for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0;
      return h % 360;
    }
    function nodeColor(n) {
      if (n.id === COORDINATOR_ID) return COLORS.brain;
      return COLORS[n.category] || ("hsl(" + hashHue(n.category || "other") + ",70%,60%)");
    }
    function nodeRadius(n) {
      if (n.id === COORDINATOR_ID) return 22;
      return Math.min(15, 4.5 + Math.sqrt(n.usage_count || 0) * 1.8 + Math.sqrt(n.source_count || 0));
    }

    var nodes = [], edges = [], byId = new Map();
    var filters = {};
    var searchTerm = "";
    function categoryOf(n) { return n.id === COORDINATOR_ID ? "brain" : (n.category || "skill"); }
    function visible(n) { return filters[categoryOf(n)] !== false; }
    function matches(n) {
      if (!searchTerm) return true;
      var hay = (n.label + " " + (n.tags || []).join(" ")).toLowerCase();
      return hay.indexOf(searchTerm) >= 0;
    }

    // ---- physics (3D) ---------------------------------------------------
    var alpha = 1, ALPHA_DECAY = 0.985, ALPHA_MIN = 0.006;

    function initPositions() {
      var n = nodes.length, R = Math.max(240, Math.sqrt(n) * 65);
      for (var i = 0; i < n; i++) {
        var a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1), r = Math.random() * R;
        nodes[i].x = r * Math.sin(b) * Math.cos(a);
        nodes[i].y = r * Math.sin(b) * Math.sin(a);
        nodes[i].z = r * Math.cos(b);
        nodes[i].vx = 0; nodes[i].vy = 0; nodes[i].vz = 0; nodes[i].fx = null; nodes[i].fy = null; nodes[i].fz = null;
      }
      var hub = byId.get(COORDINATOR_ID);
      if (hub) { hub.x = 0; hub.y = 0; hub.z = 0; hub.fx = 0; hub.fy = 0; hub.fz = 0; }
    }

    function tick() {
      if (alpha < ALPHA_MIN) return;
      var REPULSE = 1500;
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (n.fx != null) continue;
        var fx = 0, fy = 0, fz = 0;
        for (var j = 0; j < nodes.length; j++) {
          if (i === j) continue;
          var o = nodes[j];
          var dx = n.x - o.x, dy = n.y - o.y, dz = n.z - o.z;
          var d2 = dx * dx + dy * dy + dz * dz + 0.01;
          if (d2 > 200000) continue;
          var d = Math.sqrt(d2);
          var f = REPULSE / d2;
          fx += (dx / d) * f; fy += (dy / d) * f; fz += (dz / d) * f;
        }
        fx += -n.x * 0.0018; fy += -n.y * 0.0018; fz += -n.z * 0.0018;
        n.vx = (n.vx + fx * alpha) * 0.86;
        n.vy = (n.vy + fy * alpha) * 0.86;
        n.vz = (n.vz + fz * alpha) * 0.86;
      }
      for (var k = 0; k < edges.length; k++) {
        var e = edges[k];
        var a = byId.get(e.source), b = byId.get(e.target);
        if (!a || !b) continue;
        var target = e.kind === "index" ? 170 : 95;
        var strength = e.kind === "index" ? 0.035 : 0.05;
        var dx2 = b.x - a.x, dy2 = b.y - a.y, dz2 = b.z - a.z;
        var d3 = Math.sqrt(dx2 * dx2 + dy2 * dy2 + dz2 * dz2) || 1;
        var diff = (d3 - target) * strength * alpha;
        var ux = dx2 / d3, uy = dy2 / d3, uz = dz2 / d3;
        if (a.fx == null) { a.vx += ux * diff; a.vy += uy * diff; a.vz += uz * diff; }
        if (b.fx == null) { b.vx -= ux * diff; b.vy -= uy * diff; b.vz -= uz * diff; }
      }
      for (var m = 0; m < nodes.length; m++) {
        var nd = nodes[m];
        if (nd.fx != null) { nd.x = nd.fx; nd.y = nd.fy; nd.z = nd.fz; continue; }
        nd.x += nd.vx; nd.y += nd.vy; nd.z += nd.vz;
      }

    }

    // ---- live activity: electric pulses + sustained "in use" glow -------
    var pulses = [], flashes = new Map(), inUseUntil = new Map();
    var thinking = false;
    function pulse(fromId, toId, color, dur) {
      // With animations off, pulses aren't drawn anyway, but we'd still queue
      // them every time the agent thinks — drop the call at the source so the
      // array can't grow unboundedly during long sessions with animations off.
      if (!neuralPrefs.showAnimations) return;
      pulses.push({ fromId: fromId, toId: toId, start: performance.now(), dur: dur || 700, color: color || "#eaf2ff",
        jitter: [] });
    }
    function flashNode(id, color, dur, sustain) {
      flashes.set(id, { start: performance.now(), dur: dur || 900, color: color || "#eaf2ff" });
      // `sustain: false` is a node that was merely *considered* — it blinks
      // and is gone. Only a node actually used earns the lasting glow (and
      // with it, an electrified edge), so the two read differently.
      if (sustain !== false) inUseUntil.set(id, performance.now() + 6000);
    }

    var lastProjected = new Map();

    function draw() {
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = "#05060f";
      ctx.fillRect(0, 0, W, H);

      for (var s = 0; s < stars.length; s++) {
        var st = stars[s];
        var sp = project(st.x, st.y, st.z);
        if (!sp || sp.sx < -20 || sp.sx > W + 20 || sp.sy < -20 || sp.sy > H + 20) continue;
        ctx.globalAlpha = st.a * Math.min(1, sp.scale * 3);

        ctx.beginPath(); ctx.arc(sp.sx, sp.sy, st.r, 0, Math.PI * 2); ctx.fill();

      var hasSearch = !!searchTerm;
      var proj = [];
      lastProjected = new Map();
      for (var pI = 0; pI < nodes.length; pI++) {
        var nd0 = nodes[pI];
        if (!visible(nd0)) continue;
        var p0 = project(nd0.x, nd0.y, nd0.z);
        if (!p0) continue;
        lastProjected.set(nd0.id, p0);
        proj.push({ n: nd0, p: p0 });
      }
      proj.sort(function (a, b) { return b.p.depth - a.p.depth; });

      var now = performance.now();
      // How much of the brain is live right now — drives the aura and the
      // number of surface arcs, so the effect reports real work.
      var activeCount = 0;
      inUseUntil.forEach(function (until) { if (until > now) activeCount++; });
      var labelQueue = [];

      // edges: calm line normally, jagged "electric" flicker while a pulse
      // rides them (the coordinator's edges also flicker gently while the
      // agent is actively thinking, per "activate in real time when we ask
      // the AI to do something").
      for (var i = 0; i < edges.length; i++) {
        var e = edges[i];
        var a = byId.get(e.source), b = byId.get(e.target);
        if (!a || !b || !visible(a) || !visible(b)) continue;
        if (hasSearch && !(matches(a) && matches(b))) continue;
        var pa = lastProjected.get(a.id), pb = lastProjected.get(b.id);
        if (!pa || !pb) continue;
        // An edge electrifies when a node it touches is actually in use —
        // not merely because the agent is thinking. The graph is a star, so
        // "thinking electrifies every coordinator edge" meant every edge in
        // the whole brain lit at once and the display said nothing about
        // what was being consulted.
        var electrified = (inUseUntil.get(a.id) > now) || (inUseUntil.get(b.id) > now);
        ctx.globalAlpha = Math.min(1, (pa.scale + pb.scale) * 0.9);
        if (electrified) {

        } else {

        }
      }
      ctx.globalAlpha = 1;

      for (var n2 = 0; n2 < proj.length; n2++) {
        var nd = proj[n2].n, p = proj[n2].p;
        var dim = hasSearch && !matches(nd);
        var isBrain = nd.id === COORDINATOR_ID;
        var breathing = isBrain ? (1 + Math.sin(now / 900) * 0.12) : 1;
        var r = nodeRadius(nd) * breathing * Math.min(2.2, Math.max(0.35, p.scale * 1.15));
        var color = nodeColor(nd);
        var inUse = inUseUntil.has(nd.id) && inUseUntil.get(nd.id) > now;
        var baseAlpha = dim ? 0.12 : 1;

        // sustained "in use" halo — separate from the sharp activity flash.
        // When animations are off, draw a flat ring at the same radius instead
        // of the pulsing one, so "this node was used" still reads.
        if (inUse && !isBrain) {
          var useT = (inUseUntil.get(nd.id) - now) / 6000;
          if (neuralPrefs.showAnimations) {
            ctx.globalAlpha = 0.25 + 0.15 * Math.sin(now / 260) * useT;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 6 + Math.sin(now / 260) * 2, 0, Math.PI * 2); ctx.stroke();
          } else {
            ctx.globalAlpha = 0.35;
            ctx.strokeStyle = color;
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 6, 0, Math.PI * 2); ctx.stroke();
          }
        }

        ctx.globalAlpha = baseAlpha;

        // The coordinator is a real brain, not a dot: a mesh drawn through
        // the same camera, so orbiting shows a different profile. Skill
        // nodes keep the atom treatment below — that contrast is the point,
        // atoms of knowledge orbiting the brain.
        if (isBrain) {
          var inUseNow = inUseUntil.get(nd.id) > now;
          var energy = thinking ? 1 : (inUseNow ? 0.55 : 0);
          if (!energy && activeCount > 0) energy = 0.35;  // something, somewhere, is working
          var aura = ctx.createRadialGradient(p.sx, p.sy, r * 0.5, p.sx, p.sy, r * 4.2);
          aura.addColorStop(0, "rgba(244,190,205," + (0.20 + 0.22 * energy) + ")");
          aura.addColorStop(0.5, "rgba(180,140,255,0.08)");
          aura.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = aura;
          ctx.beginPath(); ctx.arc(p.sx, p.sy, r * 4.2, 0, Math.PI * 2); ctx.fill();

          drawBrain(nd, now, energy);

          if (nd === hoverNode || nd === selectedNode) {
            ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.2;
            ctx.beginPath(); ctx.arc(p.sx, p.sy, r * 2.1, 0, Math.PI * 2); ctx.stroke();
          }
          ctx.globalAlpha = 0.9;
          ctx.fillStyle = "#f2d7de";
          ctx.font = "600 12px -apple-system, Segoe UI, system-ui, sans-serif";
          ctx.textAlign = "center";
          ctx.fillText(nd.label, p.sx, p.sy - r * 2.3);
          ctx.globalAlpha = 1;
          continue;   // the dot/atom treatment below is for skill nodes
        }

        // Halo: stepped alpha rather than a solid-colour centre. The old
        // gradient started fully opaque over a huge radius, which blew the
        // central brain out into a white smear that washed out everything
        // near it.
        var glowR = isBrain ? r * 2.8 : r * 2.6;
        var grad = ctx.createRadialGradient(p.sx, p.sy, r * 0.4, p.sx, p.sy, glowR);
        grad.addColorStop(0, withAlpha(color, isBrain ? 0.55 : 0.45));
        grad.addColorStop(0.45, withAlpha(color, 0.14));
        grad.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = grad;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, glowR, 0, Math.PI * 2); ctx.fill();

        // Atom: an electron on a tilted orbit around the core. The orbit
        // ellipse is squashed by a slow sine so it reads as a ring seen in
        // 3D rather than a flat circle drawn on the screen.
        // Gated by showAnimations: with animations off, only the static ring
        // is drawn (no moving electron — the "ball of energy" the user wants
        // to be able to switch off).
        if (!dim && neuralPrefs.showAnimations) {
          var orbitR = r * 1.9;
          var tilt = now / 2600 + hashHue(nd.id) / 57;
          var squash = 0.28 + 0.24 * (1 + Math.sin(now / 1700 + nd.x * 0.01)) / 2;
          ctx.save();
          ctx.translate(p.sx, p.sy);
          ctx.rotate(tilt);
          ctx.globalAlpha = baseAlpha * 0.32;
          ctx.strokeStyle = color; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(0, 0, orbitR, orbitR * squash, 0, 0, Math.PI * 2); ctx.stroke();
          var ePhase = now / 900 * (isBrain ? 1.6 : 1) + hashHue(nd.id);
          var ex = Math.cos(ePhase) * orbitR, ey = Math.sin(ePhase) * orbitR * squash;
          ctx.globalAlpha = baseAlpha * 0.95;
          ctx.fillStyle = "#eaf4ff";
          ctx.shadowBlur = 6; ctx.shadowColor = color;
          ctx.beginPath(); ctx.arc(ex, ey, Math.max(1.2, r * 0.16), 0, Math.PI * 2); ctx.fill();
          ctx.shadowBlur = 0;
          ctx.restore();
          ctx.globalAlpha = baseAlpha;
        } else if (!dim && !neuralPrefs.showAnimations) {
          // Static ring, no electron — same orbit radius as the animated
          // version, just frozen. Anchored at a deterministic phase so the
          // view doesn't look like it just stopped mid-animation.
          var sOrbitR = r * 1.9;
          var sSquash = 0.4;
          ctx.save();
          ctx.translate(p.sx, p.sy);
          ctx.rotate(hashHue(nd.id) / 57);
          ctx.globalAlpha = baseAlpha * 0.32;
          ctx.strokeStyle = color; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.ellipse(0, 0, sOrbitR, sOrbitR * sSquash, 0, 0, Math.PI * 2); ctx.stroke();
          ctx.restore();
          ctx.globalAlpha = baseAlpha;
        }

        // core: coloured body with a hot centre, so it looks lit from within
        ctx.fillStyle = color;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2); ctx.fill();
        var core = ctx.createRadialGradient(p.sx - r * 0.25, p.sy - r * 0.3, 0, p.sx, p.sy, r);
        core.addColorStop(0, "rgba(255,255,255,0.85)");
        core.addColorStop(0.6, "rgba(255,255,255,0.10)");
        core.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = core;
        ctx.beginPath(); ctx.arc(p.sx, p.sy, r, 0, Math.PI * 2); ctx.fill();

        if (isBrain) {
          // inner "neuron" specks orbiting the core — reads as a living brain,
          // not just a plain sphere; also flickers faster while thinking.
          // With animations off the specks still render but freeze at a
          // deterministic phase per slot, so the brain still looks textured.
          var speckCount = 10;
          var speed = thinking ? 2.2 : 0.6;
          for (var sk = 0; sk < speckCount; sk++) {
            var phase = neuralPrefs.showAnimations
              ? now / 1000 * speed + sk * (Math.PI * 2 / speckCount)
              : sk * (Math.PI * 2 / speckCount);
            var sx3 = Math.cos(phase) * r * 0.55, sy3 = Math.sin(phase * 1.3) * r * 0.4, sz3 = Math.sin(phase) * r * 0.55;
            var w3 = rotate(sx3, sy3, sz3);
            var sxp = p.sx + w3[0] * p.scale * 0.5, syp = p.sy + w3[1] * p.scale * 0.5;
            ctx.globalAlpha = neuralPrefs.showAnimations ? 0.5 + 0.5 * Math.sin(phase * 2) : 0.7;
            ctx.fillStyle = "#bfe0ff";
            ctx.beginPath(); ctx.arc(sxp, syp, 1.6, 0, Math.PI * 2); ctx.fill();
          }
          ctx.globalAlpha = 1;
        }

        if (nd === hoverNode || nd === selectedNode) {
          ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 1.5;
          ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 3, 0, Math.PI * 2); ctx.stroke();
        }
        var flash = flashes.get(nd.id);
        if (flash) {
          var ft = (now - flash.start) / flash.dur;
          if (ft >= 1) flashes.delete(nd.id);
          else {
            ctx.globalAlpha = 1 - ft; ctx.strokeStyle = flash.color; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.arc(p.sx, p.sy, r + 4 + ft * 18, 0, Math.PI * 2); ctx.stroke();
          }
        }
        // Label on how big the node actually is on screen, not on a fixed
        // camera distance — the auto-framed camera sits further back for a
        // big graph, which used to silently hide every label. Queued rather
        // than drawn here so overlapping labels can be dropped: back-to-front
        // node order would otherwise let a distant node's label land on top
        // of a near one's, which is how "Rust ownership model" ended up
        // printed through "TypeScript generics".
        if (isBrain || p.scale > 0.5 || nd === hoverNode || nd === selectedNode) {
          // Labels are gated by the Layout Options "Show node labels" toggle.
          // Hover/selected labels still come through even when labels are off
          // — otherwise the user can't tell what they're about to click on.
          if (neuralPrefs.showLabels || nd === hoverNode || nd === selectedNode) {
            labelQueue.push({
              text: nd.label, x: p.sx, y: p.sy - r - 7,
              size: 11 * Math.min(1.3, p.scale * 1.1),
              alpha: dim ? 0.15 : 0.85,
              priority: (nd === hoverNode || nd === selectedNode || isBrain) ? 99 : p.scale,
            });
          }
        }
        ctx.globalAlpha = 1;
      }

      // Labels last, nearest first, dropping any that would overlap one
      // already placed — a readable subset beats a complete but unreadable
      // pile.
      if (neuralPrefs.showLabels) {
        labelQueue.sort(function (a, b) { return b.priority - a.priority; });
        ctx.textAlign = "center";
        var placed = [];
        for (var li = 0; li < labelQueue.length; li++) {
          var lab = labelQueue[li];
          ctx.font = lab.size + "px -apple-system, Segoe UI, system-ui, sans-serif";
          var halfW = ctx.measureText(lab.text).width / 2 + 3;
          var halfH = lab.size * 0.75;
          // keep the whole label inside the panel — centred text on a node near
          // the edge used to run off and get cut in half
          lab.x = Math.min(W - halfW - 4, Math.max(halfW + 4, lab.x));
          var box = { l: lab.x - halfW, r: lab.x + halfW, t: lab.y - halfH, b: lab.y + halfH * 0.4 };
          var collides = false;
          for (var pj = 0; pj < placed.length; pj++) {
            var q = placed[pj];
            if (box.l < q.r && box.r > q.l && box.t < q.b && box.b > q.t) { collides = true; break; }
          }
          if (collides) continue;
          placed.push(box);
          ctx.globalAlpha = lab.alpha;
          ctx.fillStyle = "rgba(5,6,15,0.55)";
          ctx.fillText(lab.text, lab.x + 1, lab.y + 1); // faint backing so text survives over a bright edge
          ctx.fillStyle = "#dfe6ff";
          ctx.fillText(lab.text, lab.x, lab.y);
        }
        ctx.globalAlpha = 1;
      }

      // electric pulses: jagged flickering bolt traveling from source to target
      // Skipped wholesale when animations are off — pulses are time-based, so
      // there's no static version of them; queuing them anyway would just
      // produce invisible work every frame. The pulse() caller doesn't fire
      // them either when the toggle is off (see the gate in flashNode below).
      if (neuralPrefs.showAnimations) {
        for (var pi = pulses.length - 1; pi >= 0; pi--) {
          var pu = pulses[pi];
          var t = (now - pu.start) / pu.dur;
          if (t >= 1) { pulses.splice(pi, 1); continue; }
          var from = byId.get(pu.fromId), to = byId.get(pu.toId);
          if (!from || !to) { pulses.splice(pi, 1); continue; }
          var pf = project(from.x, from.y, from.z), pt = project(to.x, to.y, to.z);
          if (!pf || !pt) continue;
          var fade = Math.sin(Math.PI * Math.min(1, t * 1.1));
          ctx.globalAlpha = fade;
          drawElectricSegment(pf, pt, pu.color, 2, 5);
          // bright traveling head
          var hx = pf.sx + (pt.sx - pf.sx) * t, hy = pf.sy + (pt.sy - pf.sy) * t;
          var rad = 7 * Math.max(0.4, (pf.scale + pt.scale) / 2);
          var pg = ctx.createRadialGradient(hx, hy, 0, hx, hy, rad);
          pg.addColorStop(0, pu.color); pg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = pg;
          ctx.beginPath(); ctx.arc(hx, hy, rad, 0, Math.PI * 2); ctx.fill();
          ctx.globalAlpha = 1;
        }
      } else {
        // Don't leak pending pulses across an off→on toggle: drop them so
        // the moment animations come back, no leftover lightning fires.
        pulses.length = 0;
      }
    }

    // A lightning-style jagged path between two projected points, jittered
    // fresh every call so it flickers frame to frame instead of looking static.
    // A connection is never a dead grey hairline: every link carries a
    // current. The wire itself is a faint gradient between the two nodes'
    // own colours, and a bright charge runs along it continuously — the
    // graph reads as powered even when the agent is idle, which is the
    // whole point of "electricity flowing between the nodes". Speed and
    // phase are derived from the edge index so the charges don't all march
    // in lockstep, which would look mechanical rather than alive.
    function drawLiveWire(pa, pb, a, b, index, now) {
      var ca = nodeColor(a), cb = nodeColor(b);
      var wire = ctx.createLinearGradient(pa.sx, pa.sy, pb.sx, pb.sy);
      wire.addColorStop(0, withAlpha(ca, 0.30));
      wire.addColorStop(0.5, "rgba(150,190,255,0.16)");
      wire.addColorStop(1, withAlpha(cb, 0.30));
      ctx.strokeStyle = wire;
      ctx.lineWidth = (a.id === COORDINATOR_ID || b.id === COORDINATOR_ID ? 1.5 : 1.1)
        * Math.min(1.6, pa.scale + pb.scale);
      ctx.beginPath(); ctx.moveTo(pa.sx, pa.sy); ctx.lineTo(pb.sx, pb.sy); ctx.stroke();

      // The moving charge along the wire is part of the animations toggle —
      // skip the sliding dash entirely when animations are off so the wires
      // sit still. The faint gradient wire above still renders either way.
      if (!neuralPrefs.showAnimations) return;

      // the charge: a short bright dash sliding along the wire
      var speed = 0.16 + (index % 7) * 0.035;
      var head = ((now / 1000) * speed + (index % 13) / 13) % 1;
      var tail = Math.max(0, head - 0.14);
      var hx = pa.sx + (pb.sx - pa.sx) * head, hy = pa.sy + (pb.sy - pa.sy) * head;
      var tx = pa.sx + (pb.sx - pa.sx) * tail, ty = pa.sy + (pb.sy - pa.sy) * tail;
      var spark = ctx.createLinearGradient(tx, ty, hx, hy);
      spark.addColorStop(0, "rgba(125,211,252,0)");
      spark.addColorStop(1, withAlpha(cb, 0.85));
      ctx.strokeStyle = spark;
      ctx.lineWidth = 2 * Math.min(1.5, (pa.scale + pb.scale) * 0.7);
      ctx.shadowBlur = 8; ctx.shadowColor = cb;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(hx, hy); ctx.stroke();
      ctx.shadowBlur = 0;
    }

    function withAlpha(color, alpha) {
      if (color.charAt(0) === "#") {
        var hex = color.slice(1);
        if (hex.length === 3) hex = hex[0] + hex[0] + hex[1] + hex[1] + hex[2] + hex[2];
        var num = parseInt(hex, 16);
        return "rgba(" + ((num >> 16) & 255) + "," + ((num >> 8) & 255) + "," + (num & 255) + "," + alpha + ")";
      }
      if (color.indexOf("hsl(") === 0) return color.replace("hsl(", "hsla(").replace(")", "," + alpha + ")");
      return color;
    }

    function drawElectricSegment(pa, pb, color, width, segments) {
      var dx = pb.sx - pa.sx, dy = pb.sy - pa.sy;
      var len = Math.hypot(dx, dy) || 1;
      var nx = -dy / len, ny = dx / len;
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      ctx.moveTo(pa.sx, pa.sy);
      for (var i = 1; i < segments; i++) {
        var t = i / segments;
        var jitter = (Math.random() - 0.5) * Math.min(14, len * 0.18);
        ctx.lineTo(pa.sx + dx * t + nx * jitter, pa.sy + dy * t + ny * jitter);
      }
      ctx.lineTo(pb.sx, pb.sy);
      ctx.stroke();
    }

    // The force layout drops nodes wherever they land, which left the whole
    // graph bunched in one corner of the panel with most of the view empty.
    // Until the user takes the camera themselves, keep easing it to frame
    // whatever is currently visible — centred, and far enough back that the
    // outermost node sits comfortably inside the panel.
    var autoFrame = true;
    function frameGraph() {
      var cx = 0, cy = 0, cz = 0, count = 0;
      for (var i = 0; i < nodes.length; i++) {
        var n = nodes[i];
        if (!visible(n)) continue;
        cx += n.x; cy += n.y; cz += n.z; count++;
      }
      if (!count) return;
      cx /= count; cy /= count; cz /= count;

      // 90th percentile, not the maximum: a single node flung out by the
      // force layout would otherwise set the framing radius on its own and
      // push the camera so far back that the whole graph became a speck in
      // the middle of an empty panel.
      var radii = [];
      for (var j = 0; j < nodes.length; j++) {
        var m = nodes[j];
        if (!visible(m)) continue;
        radii.push(Math.hypot(m.x - cx, m.y - cy, m.z - cz));
      }
      radii.sort(function (p, q) { return p - q; });
      var spread = Math.max(1, radii[Math.floor(radii.length * 0.9)] || radii[radii.length - 1] || 1);

      // fit that sphere into the smaller screen axis, with margin
      var want = Math.min(2400, Math.max(300, (spread * FOCAL) / (Math.min(W, H) * 0.38)));
      var ease = 0.06;
      cam.tx += (cx - cam.tx) * ease;
      cam.ty += (cy - cam.ty) * ease;
      cam.tz += (cz - cam.tz) * ease;
      cam.dist += (want - cam.dist) * ease;
    }

    var rafId = null;
    // Real-time FPS counter. Count frames in a sliding 1-second window and
    // re-paint the readout ~4×/sec so the digits don't flicker. Colour bands:
    //   ≥58 fps → "high"   (green, ~60 fps lock)
    //   29–57   → "normal" (amber, the default in-between band)
    //   <29     → "low"    (red, renderer is dropping badly)
    var fpsFrames = 0;
    var fpsLastSample = performance.now();
    var fpsLastPainted = 0;
    function recordFrame(now) {
      fpsFrames++;
      if (now - fpsLastSample >= 1000) {
        var fps = (fpsFrames * 1000) / (now - fpsLastSample);
        fpsFrames = 0;
        fpsLastSample = now;
        // Throttle DOM writes to ~4 Hz — the readout can't keep up with the
        // requestAnimationFrame cadence anyway, and rewriting the text node
        // every frame triggers layout work we don't need.
        if (now - fpsLastPainted >= 240) {
          fpsLastPainted = now;
          fpsEl.textContent = Math.round(fps) + " fps";
          fpsEl.classList.remove("normal", "high", "low");
          fpsEl.classList.add(fps >= 58 ? "high" : (fps < 29 ? "low" : "normal"));
        }
      }
    }
    function loop() {
      var t = performance.now();
      tick(); if (autoFrame) frameGraph(); draw();
      recordFrame(t);
      rafId = requestAnimationFrame(loop);
    }

    // ---- interaction: drag rotates, shift/right-drag pans, wheel zooms --
    var hoverNode = null, selectedNode = null, dragNode = null, dragNodeDepth = 0;
    var rotating = false, panning = false;
    var lastMouse = [0, 0];

    function pickNode(sx, sy) {
      var best = null, bestD = Infinity;
      lastProjected.forEach(function (p, id) {
        var n = byId.get(id);
        if (!n || !visible(n)) return;
        var dx = sx - p.sx, dy = sy - p.sy, d2 = dx * dx + dy * dy;
        var r = nodeRadius(n) * Math.max(0.5, p.scale) + 6;
        if (d2 < r * r && d2 < bestD) { bestD = d2; best = n; }
      });
      return best;
    }

    canvas.addEventListener("mousedown", function (ev) {
      autoFrame = false; // the camera is the user's from here on
      lastMouse = [ev.clientX, ev.clientY];
      var n = pickNode(ev.clientX - canvas.getBoundingClientRect().left, ev.clientY - canvas.getBoundingClientRect().top);
      if (n && ev.button === 0 && n.id !== COORDINATOR_ID) {
        dragNode = n;
        var p = lastProjected.get(n.id);
        dragNodeDepth = p ? p.depth : cam.dist;
        n.fx = n.x; n.fy = n.y; n.fz = n.z;
        alpha = Math.max(alpha, 0.3);
      } else if (ev.button === 2 || ev.shiftKey) {
        panning = true; canvas.classList.add("dragging");
      } else {
        rotating = true; canvas.classList.add("dragging");
      }
    });
    window.addEventListener("mousemove", function (ev) {
      var rect = canvas.getBoundingClientRect();
      var lx = ev.clientX - rect.left, ly = ev.clientY - rect.top;
      var dx = ev.clientX - lastMouse[0], dy = ev.clientY - lastMouse[1];
      lastMouse = [ev.clientX, ev.clientY];
      if (dragNode) {
        var scale = dragNodeDepth / FOCAL;
        var d = invRotate(dx * scale, dy * scale, 0);
        dragNode.fx += d[0]; dragNode.fy += d[1]; dragNode.fz += d[2];
      } else if (rotating) {
        cam.yaw += dx * 0.0055;
        cam.pitch = Math.max(-1.45, Math.min(1.45, cam.pitch + dy * 0.0055));
      } else if (panning) {
        var panScale = cam.dist / FOCAL;
        var pd = invRotate(dx * panScale, dy * panScale, 0);
        cam.tx -= pd[0]; cam.ty -= pd[1]; cam.tz -= pd[2];
      } else if (lx >= 0 && lx <= W && ly >= 0 && ly <= H) {
        var n = pickNode(lx, ly);
        hoverNode = n;
        var tip = document.getElementById("tooltip");
        if (n) {
          tip.style.display = "block";
          tip.style.left = (ev.clientX + 14) + "px"; tip.style.top = (ev.clientY + 10) + "px";
          var kindLabel = n.id === COORDINATOR_ID ? "central brain" : categoryOf(n);
          tip.innerHTML = "<b>" + escapeHtml(n.label) + "</b><br><span style='color:#8b93b8'>" + escapeHtml(kindLabel) + "</span>";
        } else tip.style.display = "none";
      }
    });
    window.addEventListener("mouseup", function () {
      if (dragNode) { dragNode.fx = null; dragNode.fy = null; dragNode.fz = null; dragNode = null; }
      rotating = false; panning = false;
      canvas.classList.remove("dragging");
    });
    canvas.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
    canvas.addEventListener("dblclick", function (ev) {
      var rect = canvas.getBoundingClientRect();
      var n = pickNode(ev.clientX - rect.left, ev.clientY - rect.top);
      if (n) { n.fx = null; n.fy = null; n.fz = null; }
    });
    canvas.addEventListener("click", function (ev) {
      if (Math.hypot(ev.clientX - lastMouse[0], ev.clientY - lastMouse[1]) > 3) return;
      var rect = canvas.getBoundingClientRect();
      var n = pickNode(ev.clientX - rect.left, ev.clientY - rect.top);
      if (n) openInspector(n); else closeInspector();
    });
    canvas.addEventListener("wheel", function (ev) {
      ev.preventDefault();
      autoFrame = false;
      var factor = Math.exp(ev.deltaY * 0.0012);
      cam.dist = Math.min(6000, Math.max(80, cam.dist * factor));
    }, { passive: false });

    // ---- legend / filters -----------------------------------------------
    var LEGEND_ITEMS = [
      { key: "skill", label: "Skills", color: COLORS.skill },
      { key: "conversation", label: "Conversations", color: COLORS.conversation },
      { key: "tool", label: "Tools", color: COLORS.tool },
      { key: "language", label: "Languages", color: COLORS.language },
      { key: "pattern", label: "Patterns", color: COLORS.pattern },
      { key: "project", label: "Projects", color: COLORS.project },
      { key: "preference", label: "Preferences", color: COLORS.preference },
    ];
    // Categories are open-ended by design ("users can define new
    // categories"), and the addon library brings its own — agent-orchestration,
    // research-and-web and so on. A hardcoded legend would leave those
    // filterless and unlabelled, so whatever the graph actually contains is
    // appended to the known set, taking its colour from the same hash the
    // renderer uses.
    function legendItems(graph) {
      var items = LEGEND_ITEMS.slice();
      var known = {};
      items.forEach(function (it) { known[it.key] = true; });
      (graph && graph.nodes ? graph.nodes : []).forEach(function (n) {
        var cat = n.category;
        if (!cat || known[cat] || cat === "brain") return;
        known[cat] = true;
        items.push({
          key: cat,
          label: cat.replace(/[-_]/g, " ").replace(/\w/g, function (c) { return c.toUpperCase(); }),
          color: COLORS[cat] || ("hsl(" + hashHue(cat) + ",70%,60%)"),
        });
      });
      return items;
    }

    function buildLegend(graph) {
      var el = document.getElementById("nvLegend");
      el.innerHTML = legendItems(graph).map(function (it) {
        return "<button class='chip on' data-key='" + it.key + "'>" +
          "<span class='dot' style='background:" + it.color + "'></span>" + it.label + "</button>";
      }).join("");
      el.querySelectorAll(".chip").forEach(function (chip) {
        chip.addEventListener("click", function () {
          var on = !chip.classList.contains("on");
          chip.classList.toggle("on", on);
          filters[chip.dataset.key] = on;
        });
      });
    }
    function renderStats(graph) {
      var el = document.getElementById("nvStats");
      el.innerHTML = graph.counts.nodes + " nodes · " + graph.counts.edges + " edges<br>" +
        "<span style='color:#5b6289'>drag to rotate · shift/right-drag to pan · scroll to zoom</span>";
    }

    function refreshGraph() {
      return fetch("/api/graph").then(function (r) { return r.json(); }).then(function (graph) {
        graph.nodes.forEach(function (n) {
          var existing = byId.get(n.id);
          if (existing) {
            existing.label = n.label; existing.category = n.category; existing.tags = n.tags;
            existing.usage_count = n.usage_count; existing.source_count = n.source_count;
          } else {
            var a = Math.random() * Math.PI * 2, b = Math.acos(Math.random() * 2 - 1), r = 40 + Math.random() * 60;
            n.x = r * Math.sin(b) * Math.cos(a); n.y = r * Math.sin(b) * Math.sin(a); n.z = r * Math.cos(b);
            n.vx = 0; n.vy = 0; n.vz = 0; n.fx = null; n.fy = null; n.fz = null;
            nodes.push(n); byId.set(n.id, n);
          }
        });
        edges = graph.edges;
        buildLegend(graph);      // new categories become filterable chips
        renderStats(graph);
        alpha = Math.max(alpha, 0.3);
        return graph;
      });
    }

    // ---- node inspector (read + edit) ------------------------------------
    var EDITABLE_KINDS = null; // every non-coordinator node here is a real skill file
    var CATEGORIES = ["skill", "conversation", "tool", "language", "framework", "pattern", "project", "preference"];

    function panelKindLabel(n) { return n.id === COORDINATOR_ID ? "central brain" : categoryOf(n); }

    function renderInspectorRead(n, full) {
      var content = document.getElementById("inspectorContent");
      var html = "<h2>" + escapeHtml(n.label) + "</h2><div class='meta'>" + escapeHtml(panelKindLabel(n)) +
        (n.usage_count != null ? " · used " + n.usage_count + "x" : "") + "</div>";
      if (full) {
        ["problem", "solution", "code_examples", "best_practices", "edge_cases"].forEach(function (key) {
          var label = key.replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
          if (full[key]) html += "<div class='section-label'>" + label + "</div><div class='body'>" + escapeHtml(full[key]) + "</div>";
        });
        if (full.sources && full.sources.length) {
          html += "<div class='section-label'>Sources</div>";
          full.sources.forEach(function (s) {
            html += "<div class='source'>— <a href='" + escapeHtml(s.url) + "' target='_blank' rel='noopener'>" + escapeHtml(s.url) + "</a><br>\"" + escapeHtml(s.quote) + "\"</div>";
          });
        }
        if (full.tags && full.tags.length) {
          html += "<div class='tags'>" + full.tags.map(function (t) { return "<span class='tag'>" + escapeHtml(t) + "</span>"; }).join("") + "</div>";
        }
      }
      content.innerHTML = html;
      document.getElementById("inspectorEdit").style.display = (n.id !== COORDINATOR_ID) ? "block" : "none";
    }

    function openInspector(n) {
      selectedNode = n;
      if (n.id === COORDINATOR_ID) {
        renderInspectorRead(n, null);
        document.getElementById("nodeInspector").classList.add("open");
        return;
      }
      var content = document.getElementById("inspectorContent");
      content.innerHTML = "<h2>" + escapeHtml(n.label) + "</h2><div class='meta'>loading…</div>";
      document.getElementById("nodeInspector").classList.add("open");
      fetch("/api/node/" + encodeURIComponent(n.id)).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(function (full) {
        n.__full = full;
        renderInspectorRead(n, full);
      }).catch(function (e) {
        content.innerHTML += "<div class='err'>" + escapeHtml(e.message) + "</div>";
      });
    }
    function closeInspector() {
      selectedNode = null;
      document.getElementById("nodeInspector").classList.remove("open");
    }
    document.getElementById("inspectorClose").addEventListener("click", closeInspector);

    function renderInspectorEdit(n, full) {
      var content = document.getElementById("inspectorContent");
      var html = "<h2>Edit " + escapeHtml(full.category) + "</h2>";
      html += "<label>Title</label><input type='text' class='field' id='fTitle' value=\"" + escapeHtml(full.title) + "\">";
      html += "<label>Category</label><select id='fCategory'>" + CATEGORIES.map(function (c) {
        return "<option value='" + c + "'" + (c === full.category ? " selected" : "") + ">" + c + "</option>";
      }).join("") + "</select>";
      ["problem", "solution", "code_examples", "best_practices", "edge_cases"].forEach(function (key) {
        var label = key.replace(/_/g, " ").replace(/\b\w/g, function (c) { return c.toUpperCase(); });
        html += "<label>" + label + "</label><textarea id='f_" + key + "'>" + escapeHtml(full[key] || "") + "</textarea>";
      });
      html += "<label>Tags (comma separated)</label><input type='text' class='field' id='fTags' value=\"" + escapeHtml((full.tags || []).join(", ")) + "\">";
      html += "<label>Sources (one per line: url | quote)</label><textarea id='fSources'>" +
        escapeHtml((full.sources || []).map(function (s) { return s.url + " | " + s.quote; }).join("\n")) + "</textarea>";
      html += "<div class='actions'><button class='btn primary' id='fSave'>Save</button><button class='btn' id='fCancel'>Cancel</button>" +
        "<button class='btn danger' id='fDelete'>Delete</button></div>";
      html += "<div class='err' id='fErr'></div>";
      content.innerHTML = html;

      document.getElementById("fCancel").addEventListener("click", function () { renderInspectorRead(n, full); });
      document.getElementById("fDelete").addEventListener("click", function () {
        if (!confirm("Delete \"" + full.title + "\"? This removes the skill.md file.")) return;
        fetch("/api/node/" + encodeURIComponent(n.id), { method: "DELETE" }).then(function () { closeInspector(); });
      });
      document.getElementById("fSave").addEventListener("click", function () {
        var sources = document.getElementById("fSources").value.split("\n").map(function (line) {
          var idx = line.indexOf("|");
          if (idx < 0) return null;
          var url = line.slice(0, idx).trim(), quote = line.slice(idx + 1).trim();
          return url ? { url: url, quote: quote } : null;
        }).filter(Boolean);
        var payload = {
          title: document.getElementById("fTitle").value,
          category: document.getElementById("fCategory").value,
          tags: document.getElementById("fTags").value.split(",").map(function (s) { return s.trim(); }).filter(Boolean),
          sources: sources,
        };
        ["problem", "solution", "code_examples", "best_practices", "edge_cases"].forEach(function (key) {
          payload[key] = document.getElementById("f_" + key).value;
        });
        var saveBtn = document.getElementById("fSave");
        saveBtn.disabled = true; saveBtn.textContent = "Saving…";
        fetch("/api/node/" + encodeURIComponent(n.id), {
          method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
        }).then(function (r) {
          if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
          return r.json();
        }).then(function () { return refreshGraph(); }).then(function () {
          openInspector(byId.get(n.id) || n);
        }).catch(function (e) {
          saveBtn.disabled = false; saveBtn.textContent = "Save";
          document.getElementById("fErr").textContent = e.message;
        });
      });
    }
    document.getElementById("inspectorEdit").addEventListener("click", function () {
      if (!selectedNode || selectedNode.id === COORDINATOR_ID || !selectedNode.__full) return;
      renderInspectorEdit(selectedNode, selectedNode.__full);
    });

    // ---- live activity stream --------------------------------------------
    var activityEntries = [];
    function logActivity(text) {
      activityEntries.unshift(text);
      activityEntries = activityEntries.slice(0, 10);
      document.getElementById("nvActivityLog").innerHTML = activityEntries.map(function (t) {
        return "<div class='row'>" + escapeHtml(t) + "</div>";
      }).join("");
    }

    function handleActivity(data) {
      var route = data.route || COORDINATOR_ID;
      if (data.kind === "agent_turn") {
        // Thinking is the coordinator's own state — it pulses, the rest of
        // the brain stays quiet until something is actually consulted.
        thinking = data.phase === "start";
        if (thinking) { logActivity("thinking…"); flashNode(COORDINATOR_ID, "#eaf2ff", 900, false); }
      } else if (data.kind === "brain_search") {
        // Candidates: a brief, dim shimmer. Considered is not the same as
        // used, and the display should be able to tell you which is which.
        logActivity("searching brain: " + (data.query || ""));
        (data.ids || []).forEach(function (id, i) {
          setTimeout(function () { flashNode(id, "#7c84ab", 420, false); }, i * 45);
        });
      } else if (data.kind === "conversation_logged") {
        // Walk the charge along the path the server sent — brain to the
        // conversations branch, then branch to the atom that was just
        // grown. Hops are staggered so you see it travel outward rather
        // than the whole limb lighting simultaneously.
        logActivity("recorded: " + (data.label || data.id));
        refreshGraph().then(function () {
          var path = data.path || [COORDINATOR_ID, data.branch, data.id];
          for (var h = 0; h + 1 < path.length; h++) {
            (function (from, to, hop) {
              setTimeout(function () {
                pulse(from, to, COLORS.conversation, 620);
                flashNode(to, COLORS.conversation, hop === path.length - 2 ? 1100 : 500,
                          hop === path.length - 2);
              }, hop * 380);
            })(path[h], path[h + 1], h);
          }
        });
      } else if (data.kind === "skill_used") {
        // The one skill actually read — a real bolt from the brain to it,
        // and a sustained glow so you can see what's informing the answer.
        logActivity("using skill: " + (data.label || data.id));
        pulse(COORDINATOR_ID, data.id, "#6ee7b7", 650);
        flashNode(data.id, "#6ee7b7", 950);
      } else if (data.kind === "skill_learned") {
        logActivity("learned: " + (data.label || data.id));
        refreshGraph().then(function () { pulse(COORDINATOR_ID, data.id, "#6ee7b7", 700); flashNode(data.id, "#6ee7b7", 1000); });
      } else if (data.kind === "node_edited") {
        if (!data.replay) logActivity("edited: " + (data.label || data.id));
        refreshGraph().then(function () { pulse(COORDINATOR_ID, data.id, "#4fd1ff", 600); flashNode(data.id, "#4fd1ff", 800); });
      } else if (data.kind === "node_deleted") {
        logActivity("deleted: " + data.id);
        refreshGraph();
      } else if (data.kind === "file_saved") {
        logActivity("saved: " + data.path);
      } else if (data.kind === "tool_call" || data.kind === "node_used") {
        if (!data.replay) logActivity((data.tool || "used") + ": " + (data.label || data.id || ""));
        var target = byId.has(route) ? route : null;
        if (target && target !== COORDINATOR_ID) {
          pulse(COORDINATOR_ID, target, "#6ea8ff", 500);
          flashNode(target, "#6ea8ff", 700);  // sustain: the path stays live while the tool is in use
        } else {
          // Generic tool activity is real, but unless a specific node is
          // named it should not mark the whole coordinator star as "in use".
          flashNode(COORDINATOR_ID, "#6ea8ff", 500, false);
        }
      }
    }

    function connectEvents() {
      try {
        var proto = location.protocol === "https:" ? "wss:" : "ws:";
        var ws = new WebSocket(proto + "//" + location.host + "/ws/events");
        ws.onmessage = function (ev) { try { handleActivity(JSON.parse(ev.data)); } catch (e) {} };
        ws.onopen = function () { document.getElementById("nvLiveDot").style.background = "#6ee7b7"; };
        ws.onerror = function () { document.getElementById("nvLiveDot").style.background = "#f87171"; };
        ws.onclose = function () { document.getElementById("nvLiveDot").style.background = "#f87171"; setTimeout(connectEvents, 2000); };
      } catch (e) {}
    }

    document.getElementById("nvSearch") /* placeholder to keep hud id lookups local */;
    hud.querySelector("#nvSearch").addEventListener("input", function (ev) { searchTerm = ev.target.value.trim().toLowerCase(); });

    refreshGraph().then(function () {
      initPositions();
      buildLegend();
      loop();
      connectEvents();
      setInterval(refreshGraph, 10000);
    }).catch(function (err) {
      document.getElementById("nvStats").textContent = "failed to load graph: " + err.message + " — retrying…";
      setTimeout(function () {
        refreshGraph().then(function () { initPositions(); buildLegend(); loop(); connectEvents(); setInterval(refreshGraph, 10000); })
          .catch(function (err2) { document.getElementById("nvStats").textContent = "failed to load graph: " + err2.message; });
      }, 1500);
    });

    return {
      resize: resize,
      getShowLabels: function () { return neuralPrefs.showLabels; },
      setShowLabels: function (v) { neuralPrefs.showLabels = !!v; saveNeuralPrefs(); },
      getShowAnimations: function () { return neuralPrefs.showAnimations; },
      setShowAnimations: function (v) { neuralPrefs.showAnimations = !!v; saveNeuralPrefs(); if (!neuralPrefs.showAnimations) pulses.length = 0; },
    };
  }

  // =====================================================================
  // Chat — code blocks in assistant replies render as real (read-only)
  // CodeMirror views with a pop-out button that opens them as their own
  // floating panel (kept open independently). Code blocks belonging to
  // messages older than the last few turns auto-collapse to a one-line
  // summary, unless the user explicitly expanded them.
  // =====================================================================
  var COMPACT_KEEP_RECENT = 4; // most recent N messages keep their code blocks expanded
  var popoutCounter = 0;

  function buildChatView(container) {
    var wrap = document.createElement("div");
    wrap.className = "chat-view";
    // The phases panel — shown above the conversation, hidden when empty.
    // The agent's `set_todos` tool drives the contents via WebSocket events.
    var todosEl = document.createElement("div");
    todosEl.className = "chat-todos";
    todosEl.id = "chatTodos";
    todosEl.innerHTML =
      "<div class='chat-todos-title'>" +
        "<span>phases</span>" +
        "<span class='chat-todos-progress' id='chatTodosProgress'></span>" +
      "</div>" +
      // chatTodosList and chatTodosProgress are inner ids the test pins by string.
      "<ul class='chat-todos-list' id='chatTodosList'></ul>";
    var messagesEl = document.createElement("div");
    messagesEl.className = "chat-messages";
    var inputRow = document.createElement("div");
    inputRow.className = "chat-input-row";
    inputRow.style.position = "relative";
    inputRow.innerHTML = "<input type='text' id='chatInput' placeholder='Message DariusAI…'><button id='chatSend'>Send</button>";
    // An empty chat used to be a black void with a text box at the bottom,
    // which reads as broken rather than idle. Removed on the first message.
    var welcome = document.createElement("div");
    welcome.className = "chat-welcome";
    welcome.innerHTML =
      "<div class='mark'>🧠</div>" +
      "<h2>DariusAI</h2>" +
      "<p>Ask for a change and it plans, writes, tests and verifies it — then files what it learned " +
      "into the brain on the left, where you'll watch the node light up.</p>" +
      "<div class='hints'>" +
      "<span>“add a health endpoint and a test for it?”</span>" +
      "<span>“why is the settings panel closing?”</span>" +
      "<span>“what do you already know about SQLite?”</span>" +
      "</div>";
    messagesEl.appendChild(welcome);

    wrap.appendChild(todosEl);
    wrap.appendChild(messagesEl);
    // Token stats footer — at the very bottom, above the input row.
    // The chat session publishes a `token_stats` event after every LLM
    // call; renderStats() updates the readout on each one.
    var statsEl = document.createElement("div");
    statsEl.className = "chat-stats";
    statsEl.id = "chatStats";
    statsEl.innerHTML =
      "<span class='chat-stats-tps' id='chatStatsTps'>TPS: —</span>" +
      "<span class='chat-stats-cnt' id='chatStatsCnt'>ctx: —</span>" +
      "<span class='chat-stats-spacer'></span>" +
      "<span class='chat-stats-pct' id='chatStatsPct'>—</span>" +
      "<button class='chat-compact-btn' id='chatCompactBtn' title='Compact the conversation history to free up context space'>⚡ Compact</button>";
    wrap.appendChild(statsEl);
    wrap.appendChild(inputRow);
    // Slash-command picker — rendered absolutely under the input row
    // when the user types `/`. Hidden by default.
    var cmdDropdown = document.createElement("div");
    cmdDropdown.className = "chat-cmd-dropdown";
    cmdDropdown.id = "chatCmdDropdown";
    cmdDropdown.hidden = true;
    cmdDropdown.style.display = "none";
    cmdDropdown.innerHTML =
      "<div class='chat-cmd-tabs' id='chatCmdTabs'></div>" +
      "<div class='chat-cmd-list' id='chatCmdList'></div>" +
      "<div class='chat-cmd-hint' id='chatCmdHint'>↑↓ navigate · Enter run · Esc dismiss</div>";
    inputRow.appendChild(cmdDropdown);
    container.appendChild(wrap);

    var messageCount = 0;

    // Signals that a run of lines is code rather than prose. Deliberately
    // conservative: a false positive turns an explanation into an unreadable
    // code block, which is worse than a missed one.
    // Strong signals settle it alone — no sentence of English begins with a
    // shebang or `CREATE TABLE`. Weak ones are suggestive but appear in
    // prose too (a trailing brace, an indented quotation), so they need
    // corroboration. Two tiers, rather than one threshold that is either
    // too eager on prose or too shy on a two-line shell snippet.
    var STRONG_CODE_SIGNALS = [
      /^#!/m,                                           // shebang
      /^\s*(def|class|async\s+def)\s+\w+/m,             // python
      /^\s*(function|const|let|var)\s+\w+\s*[=(]/m,     // js/ts
      /^\s*(import|from|require|#include|using|package)\s+\S/m,
      /^\s*(public|private|protected|static)\s+\w+\s+\w+/m,
      /^\s*(SELECT|INSERT|UPDATE|DELETE|CREATE\s+TABLE|ALTER\s+TABLE)\b/im,
      /^\s*<\/?[a-z][\w-]*[\s>\/]/m,                    // html/xml tag
      /^\s*(npm|npx|pnpm|yarn|pip|pip3|git|dotnet|cargo|go|docker|kubectl)\s+\w+/m,
      /^\s*(\$|PS>|>)\s*\w+/m,                          // shell prompt
      /^\s*(Get|Set|New|Remove|Write)-[A-Z]\w+/m,       // powershell verb-noun
    ];
    var WEAK_CODE_SIGNALS = [
      /[{};]\s*$/m,                                     // braces / statement ends
      /^\s{2,}\S/m,                                     // indented block
      /\b(return|if|else|for|while|try|catch)\b\s*[({:]/,
      /[=!<>]==?|=>|->|::/,                             // operators
    ];

    function looksLikeCode(block) {
      var lines = block.split("\n").filter(function (l) { return l.trim(); });
      if (lines.length < 2) return false;
      // Prose gives itself away: sentences ending in a full stop, without
      // the punctuation code leans on.
      var prosey = lines.filter(function (l) {
        return /[.!?]\s*$/.test(l.trim()) && !/[;{}()\]]$/.test(l.trim());
      }).length;
      if (prosey > lines.length * 0.6) return false;

      if (STRONG_CODE_SIGNALS.some(function (re) { return re.test(block); })) return true;
      return WEAK_CODE_SIGNALS.filter(function (re) { return re.test(block); }).length >= 2;
    }

    function guessLanguage(block) {
      if (/^#!.*\b(bash|sh)\b/m.test(block) || /^\s*(npm|git|pip|docker|cd)\s/m.test(block)) return "bash";
      if (/^\s*(def|class)\s|\bprint\(|^\s*import\s+\w+$/m.test(block)) return "python";
      if (/\b(const|let|function|=>|console\.log)\b/.test(block)) return "javascript";
      if (/^\s*<\/?[a-z]/m.test(block)) return "html";
      if (/^\s*(SELECT|CREATE TABLE|INSERT)\b/im.test(block)) return "sql";
      if (/^\s*(public|private)\s+(class|static)/m.test(block)) return "java";
      if (/^\s*(Write-|Get-|\$\w+\s*=)/m.test(block)) return "powershell";
      return "";
    }

    /**
     * Split an assistant message into text and code segments.
     *
     * Fenced blocks are authoritative. Anything left over is then scanned
     * for *unfenced* code, because a model that forgets its backticks used
     * to leave you with code as flat prose — no Run, no Copy, no Editor,
     * nothing to act on. That was the whole complaint.
     */
    function parseSegments(text) {
      var fenced = [], re = /```(\w*)\n?([\s\S]*?)```/g, last = 0, m;
      while ((m = re.exec(text))) {
        if (m.index > last) fenced.push({ type: "text", text: text.slice(last, m.index) });
        fenced.push({ type: "code", lang: m[1] || "", code: m[2].replace(/\n$/, "") });
        last = re.lastIndex;
      }
      if (last < text.length) fenced.push({ type: "text", text: text.slice(last) });
      if (!fenced.length) fenced = [{ type: "text", text: text }];

      var segs = [];
      fenced.forEach(function (seg) {
        if (seg.type === "code") { segs.push(seg); return; }
        // Paragraphs are the unit: a blank line separates prose from a
        // pasted snippet far more reliably than any per-line heuristic.
        seg.text.split(/\n{2,}/).forEach(function (block) {
          if (!block.trim()) return;
          if (looksLikeCode(block)) {
            segs.push({ type: "code", lang: guessLanguage(block), code: block.replace(/^\n+|\n+$/g, "") });
          } else if (segs.length && segs[segs.length - 1].type === "text") {
            segs[segs.length - 1].text += "\n\n" + block;
          } else {
            segs.push({ type: "text", text: block });
          }
        });
      });
      return segs.length ? segs : [{ type: "text", text: text }];
    }

    // Which languages this machine can run, fetched once. Until it arrives
    // no Run buttons appear, which is the correct failure direction.
    var RUNTIMES = {};
    fetch("/api/runtimes").then(function (r) { return r.json(); }).then(function (data) {
      RUNTIMES = data.runtimes || {};
    }).catch(function () { /* no runtimes known -> no Run buttons */ });

    function runtimeFor(lang) {
      var key = (lang || "").toLowerCase();
      var direct = RUNTIMES[key];
      if (direct) return direct.available ? direct : null;
      for (var name in RUNTIMES) {
        var rt = RUNTIMES[name];
        if (rt.aliases && rt.aliases.indexOf(key) >= 0) return rt.available ? rt : null;
      }
      return null;
    }

    function makeRunButton(lang, code, blockEl) {
      var rt = runtimeFor(lang);
      if (!rt) return null;

      var btn = document.createElement("button");
      btn.textContent = "▶ Run";
      btn.title = "Run with " + rt.label + (rt.version ? " (" + rt.version + ")" : "");
      btn.addEventListener("click", function () {
        btn.disabled = true; btn.textContent = "running…";
        fetch("/api/run", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ language: lang, code: code }),
        }).then(function (r) { return r.json(); }).then(function (res) {
          showRunOutput(blockEl, res);
        }).catch(function (e) {
          showRunOutput(blockEl, { ok: false, error: e.message, output: "", command: "", exit: -1 });
        }).finally(function () { btn.disabled = false; btn.textContent = "▶ Run"; });
      });
      return btn;
    }

    function showRunOutput(blockEl, res) {
      var existing = blockEl.parentNode.querySelector(".run-output");
      if (existing) existing.parentNode.removeChild(existing);

      var box = document.createElement("div");
      box.className = "run-output" + (res.ok ? " ok" : " bad");
      var head = document.createElement("div");
      head.className = "run-head";
      var status = res.error ? res.error
        : (res.timed_out ? "timed out — process tree killed"
          : (res.ok ? "exit 0" : "exit " + res.exit));
      head.textContent = (res.ok ? "▾ output · " : "▾ failed · ") + status;
      // The exact command is shown because this executed model-written code.
      head.title = res.command || "";
      var pre = document.createElement("pre");
      pre.className = "run-body";
      pre.textContent = (res.output || "").trim() || "(no output)";
      head.addEventListener("click", function () {
        var hidden = pre.style.display === "none";
        pre.style.display = hidden ? "" : "none";
        head.textContent = (hidden ? "▾ " : "▸ ") + head.textContent.slice(2);
      });
      box.appendChild(head); box.appendChild(pre);
      if (res.command) {
        var cmd = document.createElement("div");
        cmd.className = "run-cmd";
        cmd.textContent = res.command;
        box.appendChild(cmd);
      }
      blockEl.parentNode.appendChild(box);
    }

    function makeCodeBlock(lang, code, messageIndex) {
      var codeWrap = document.createElement("div");
      codeWrap.className = "chat-code-wrap";
      codeWrap.dataset.messageIndex = String(messageIndex);
      codeWrap.dataset.pinned = "false";

      var full = document.createElement("div");
      full.className = "code-block";
      var bar = document.createElement("div");
      bar.className = "code-block-bar";
      var langSpan = document.createElement("span");
      langSpan.className = "lang"; langSpan.textContent = lang || "text";
      var spacer = document.createElement("span"); spacer.className = "spacer";
      var popBtn = document.createElement("button"); popBtn.textContent = "⤢ Pop out";
      var copyBtn = document.createElement("button"); copyBtn.textContent = "Copy";

      // → Editor: writes the block to the project's scratch directory and
      // opens it as a real file, so it can be saved, edited and run rather
      // than living only inside a chat bubble.
      var editorBtn = document.createElement("button");
      editorBtn.textContent = "→ Editor";
      editorBtn.title = "Open this block as a file in the editor";
      editorBtn.addEventListener("click", function () {
        editorBtn.disabled = true;
        fetch("/api/snippet", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ language: lang || "text", code: code }),
        }).then(function (r) { return r.json(); }).then(function (data) {
          if (window.__editor && window.__editor.openFile) window.__editor.openFile(data.path);
          editorBtn.textContent = "→ Editor ✓";
          setTimeout(function () { editorBtn.textContent = "→ Editor"; }, 1600);
        }).catch(function (e) {
          editorBtn.textContent = "failed: " + e.message;
        }).finally(function () { editorBtn.disabled = false; });
      });

      bar.appendChild(langSpan); bar.appendChild(spacer);
      // ▶ Run is added only for a language this machine can actually run —
      // see RUNTIMES below. A button that appears and then fails is worse
      // than no button.
      var runBtn = makeRunButton(lang, code, full);
      if (runBtn) bar.appendChild(runBtn);
      bar.appendChild(editorBtn); bar.appendChild(copyBtn); bar.appendChild(popBtn);
      var cmHost = document.createElement("div");
      full.appendChild(bar); full.appendChild(cmHost);

      var collapsed = document.createElement("div");
      collapsed.className = "code-collapsed";
      var lineCount = code.split("\n").length;
      collapsed.textContent = "▸ " + (lang || "code") + " block (" + lineCount + " line" + (lineCount === 1 ? "" : "s") + ") — click to expand";
      collapsed.style.display = "none";

      codeWrap.appendChild(full);
      codeWrap.appendChild(collapsed);

      var cm = window.CodeMirror(cmHost, {
        value: code, mode: modeForLang(lang) || "text/plain", theme: "dracula",
        readOnly: true, lineNumbers: true, viewportMargin: Infinity,
      });

      copyBtn.addEventListener("click", function () {
        navigator.clipboard.writeText(code).then(function () {
          copyBtn.textContent = "Copied!"; setTimeout(function () { copyBtn.textContent = "Copy"; }, 1200);
        }).catch(function () {});
      });
      popBtn.addEventListener("click", function () {
        popoutCounter++;
        var id = "popout-" + popoutCounter;
        var host = document.createElement("div");
        host.style.height = "100%";
        var popCm = window.CodeMirror(host, {
          value: code, mode: modeForLang(lang) || "text/plain", theme: "dracula",
          lineNumbers: true, matchBrackets: true,
        });
        WM.createFloatingOnly(id, (lang || "code") + " snippet", host, { x: 160 + popoutCounter * 20, y: 100 + popoutCounter * 20, w: 560, h: 380 });
        setTimeout(function () { popCm.refresh(); }, 30);
      });
      collapsed.addEventListener("click", function () {
        codeWrap.dataset.pinned = "true";
        collapsed.style.display = "none"; full.style.display = "";
        setTimeout(function () { cm.refresh(); }, 10);
      });

      return codeWrap;
    }

    function compactOldCodeBlocks() {
      var wraps = messagesEl.querySelectorAll(".chat-code-wrap");
      wraps.forEach(function (w) {
        var idx = parseInt(w.dataset.messageIndex, 10);
        var isOld = idx <= messageCount - COMPACT_KEEP_RECENT;
        if (isOld && w.dataset.pinned !== "true") {
          w.querySelector(".code-block").style.display = "none";
          w.querySelector(".code-collapsed").style.display = "block";
        }
      });
    }

    function dismissWelcome() {
      if (welcome && welcome.parentNode) welcome.parentNode.removeChild(welcome);
    }

    function appendMessage(role, text) {
      dismissWelcome();
      messageCount++;
      var el = document.createElement("div");
      el.className = "chat-msg chat-" + role;
      if (role === "assistant") {
        parseSegments(text).forEach(function (seg) {
          if (seg.type === "text") {
            if (seg.text.trim()) {
              var t = document.createElement("div");
              t.textContent = seg.text;
              el.appendChild(t);
            }
          } else {
            el.appendChild(makeCodeBlock(seg.lang, seg.code, messageCount));
          }
        });
      } else {
        el.textContent = text;
      }
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      compactOldCodeBlocks();
    }

    function appendPlain(role, text) {
      dismissWelcome();
      var el = document.createElement("div");
      el.className = "chat-msg chat-" + role;
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    var ws = null;
    // Thinking box: a small collapsible panel that streams the agent's
    // intermediate work (tool calls, intermediate narration) while a turn
    // is running. Collapsed by default — the user clicks to expand it,
    // same shape as Claude Code / Cursor's reasoning panels. When the
    // final assistant text arrives the box closes and the reply renders
    // as a normal chat message below it.
    var thinkingBox = null;
    function openThinkingBox() {
      if (thinkingBox && thinkingBox.parentNode) closeThinkingBox();
      thinkingBox = document.createElement("div");
      thinkingBox.className = "chat-thinking";
      thinkingBox.innerHTML =
        "<div class='chat-thinking-head'>" +
        "<span class='chat-thinking-icon'>🤭</span>" +
        "<span class='chat-thinking-label'>thinking…</span>" +
        "<span class='chat-thinking-count'>0</span>" +
        "<span class='chat-thinking-toggle'>►</span>" +
        "</div>" +
        "<div class='chat-thinking-body'></div>";
      var head = thinkingBox.querySelector(".chat-thinking-head");
      head.addEventListener("click", function () {
        thinkingBox.classList.toggle("open");
      });
      messagesEl.appendChild(thinkingBox);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return thinkingBox;
    }
    function appendThinkingStep(kind, text) {
      if (!thinkingBox) openThinkingBox();
      var body = thinkingBox.querySelector(".chat-thinking-body");
      var row = document.createElement("div");
      row.className = "chat-thinking-step chat-step-" + kind;
      row.textContent = text;
      body.appendChild(row);
      var count = thinkingBox.querySelector(".chat-thinking-count");
      count.textContent = String(body.children.length);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }
    function closeThinkingBox() {
      if (!thinkingBox) return;
      var label = thinkingBox.querySelector(".chat-thinking-label");
      if (label) label.textContent = "thought";
      var icon = thinkingBox.querySelector(".chat-thinking-icon");
      if (icon) icon.textContent = "✓";
      thinkingBox.classList.add("done");
      thinkingBox = null;
    }
    function connect() {
      var proto = location.protocol === "https:" ? "wss:" : "ws:";
      ws = new WebSocket(proto + "//" + location.host + "/ws/chat");
      ws.onmessage = function (ev) {
        var data;
        try { data = JSON.parse(ev.data); } catch (e) { return; }
        if (data.type === "error") {
          closeThinkingBox();
          appendPlain("system", data.message);
        } else if (data.type === "assistant_text") {
          if (data.is_final) {
            closeThinkingBox();
            appendMessage("assistant", data.text);
          } else {
            appendThinkingStep("text", data.text);
          }
        } else if (data.type === "tool_call_start") {
          appendThinkingStep("tool", "→ " + data.name + "(" + JSON.stringify(data.input) + ")");
        } else if (data.type === "tool_call_result") {
          appendThinkingStep("result", "↴ " + String(data.result).slice(0, 300));
        } else if (data.type === "todos") {
          renderTodos(data.items || []);
        } else if (data.type === "token_stats") {
          renderStats(data);
        } else if (data.type === "context_compacted") {
          renderCompactBanner(data);
        } else if (data.type === "command_result") {
          cmdOnResult(data);
        } else if (data.type === "command_picker") {
          cmdOpenPicker(data);
        }
      };
      ws.onclose = function () {
        closeThinkingBox();
        appendPlain("system", "connection closed — reconnecting…");
        setTimeout(connect, 2000);
      };
    }
    connect();

    function send() {
      var input = document.getElementById("chatInput");
      var text = input.value.trim();
      if (!text || !ws || ws.readyState !== WebSocket.OPEN) return;
      appendMessage("user", text);
      openThinkingBox();   // open immediately so the user sees agent activity
      // Reset the phases panel for the new query — the agent will
      // re-populate it as it figures out the work.
      renderTodos([]);
      // Reset the stats footer so a new query doesn't show the previous
      // turn's cumulative tokens. The agent's first tool call will
      // start repopulating it via the next token_stats event.
      document.getElementById("chatStatsTps").textContent = "TPS: —";
      document.getElementById("chatStatsCnt").textContent = "ctx: —";
      document.getElementById("chatStatsPct").textContent = "—";
      input.value = "";
      cmdHide();
      cmdPicker.dismissed = false;
      ws.send(text);
    }

    // ---- Slash-command picker ---------------------------------------------
    // The picker is a small dropdown that appears when the chat input
    // starts with `/`. Up/Down navigate items in the current category;
    // Left/Right switch category tabs in multi-step pickers (e.g.
    // /add provider). Enter submits the highlighted item; Esc dismisses.
    // The picker drives the same `ws` socket as the chat — it sends
    // typed `{type:"command", name, args, request_id}` messages.
    var cmdPicker = {
      active: false,
      items: [],            // flat list of commands (or category items)
      allCatalog: [],       // master list of commands for filtering
      categories: null,     // null for the simple list, [..] for a picker
      activeCategory: null,
      highlighted: 0,
      requestId: null,
      cmdName: null,        // command name this picker is for
      selected: {},         // {category_id: picked_value} for multi-step
      beforeSlash: "",      // input value before the user typed /
    };

    function cmdHide() {
      cmdPicker.active = false;
      cmdDropdown.hidden = true;
      cmdDropdown.style.display = "none";
    }

    function cmdRender() {
      if (!cmdPicker.active) {
        cmdDropdown.hidden = true;
        cmdDropdown.style.display = "none";
        return;
      }
      cmdDropdown.hidden = false;
      var tabsEl = document.getElementById("chatCmdTabs");
      var listEl = document.getElementById("chatCmdList");
      var hintEl = document.getElementById("chatCmdHint");

      // Wire mouse event listeners once on containers
      if (listEl && !listEl._cmdListenersWired) {
        listEl._cmdListenersWired = true;
        listEl.addEventListener("mousemove", function (ev) {
          var item = ev.target.closest(".chat-cmd-item");
          if (!item) return;
          var idx = parseInt(item.getAttribute("data-idx"), 10);
          if (!isNaN(idx) && idx !== cmdPicker.highlighted) {
            cmdPicker.highlighted = idx;
            listEl.querySelectorAll(".chat-cmd-item").forEach(function (el, i) {
              el.classList.toggle("highlighted", i === idx);
            });
          }
        });
        listEl.addEventListener("click", function (ev) {
          var item = ev.target.closest(".chat-cmd-item");
          if (!item) return;
          var idx = parseInt(item.getAttribute("data-idx"), 10);
          if (!isNaN(idx)) {
            cmdPicker.highlighted = idx;
            cmdRunItem();
          }
        });
      }
      if (tabsEl && !tabsEl._cmdListenersWired) {
        tabsEl._cmdListenersWired = true;
        tabsEl.addEventListener("click", function (ev) {
          var tab = ev.target.closest(".chat-cmd-tab");
          if (!tab) return;
          var catId = tab.getAttribute("data-cat");
          if (catId && cmdPicker.categories) {
            cmdPicker.activeCategory = catId;
            var catObj = cmdPicker.categories.find(function (c) { return c.id === catId; }) || {};
            cmdPicker.items = catObj.items || [];
            cmdPicker.allCatalog = cmdPicker.items;
            cmdPicker.highlighted = 0;
            cmdRender();
          }
        });
      }

      // Tabs (only when in a multi-step picker)
      if (cmdPicker.categories && cmdPicker.categories.length > 0) {
        tabsEl.innerHTML = cmdPicker.categories.map(function (c) {
          var active = c.id === cmdPicker.activeCategory;
          return "<span class='chat-cmd-tab" + (active ? " active" : "") +
                 "' data-cat='" + c.id + "'>" + c.label + "</span>";
        }).join("");
        hintEl.textContent = "← → tabs · ↑↓ navigate · Enter select · Esc dismiss";
      } else {
        tabsEl.innerHTML = "";
        hintEl.textContent = "↑↓ navigate · Enter run · Esc dismiss";
      }
      // Items
      var items = cmdPicker.items;
      if (!items || items.length === 0) {
        cmdDropdown.hidden = true;
        cmdDropdown.style.display = "none";
        return;
      }
      cmdDropdown.hidden = false;
      cmdDropdown.style.display = "flex";
      if (cmdPicker.highlighted < 0) cmdPicker.highlighted = 0;
      if (cmdPicker.highlighted >= items.length) cmdPicker.highlighted = items.length - 1;
      listEl.innerHTML = items.map(function (it, i) {
        var hi = i === cmdPicker.highlighted;
        var label = it.label || it.id || it.name || "";
        var tag = it.group ? "<span class='group-tag'>" + it.group + "</span>" : "";
        return "<div class='chat-cmd-item" + (hi ? " highlighted" : "") +
               "' data-idx='" + i + "'>" + label + tag + "</div>";
      }).join("");

      var hiEl = listEl.querySelector(".chat-cmd-item.highlighted");
      if (hiEl) {
        hiEl.scrollIntoView({ block: "nearest" });
      }
    }

    function cmdOpenPicker(pickerState) {
      cmdPicker.active = true;
      cmdPicker.categories = pickerState.categories || [];
      cmdPicker.activeCategory = pickerState.active || (cmdPicker.categories[0] && cmdPicker.categories[0].id) || null;
      cmdPicker.highlighted = 0;
      cmdPicker.requestId = pickerState.request_id || pickerState.requestId || null;
      cmdPicker.cmdName = pickerState.name || null;
      cmdPicker.selected = pickerState.selected || {};
      var catItems = (cmdPicker.categories.find(function (c) {
        return c.id === cmdPicker.activeCategory;
      }) || {}).items || [];
      cmdPicker.allCatalog = catItems;
      cmdPicker.items = catItems;
      cmdRender();
