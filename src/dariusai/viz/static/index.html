    function cmdDismiss() {
      cmdPicker.active = false;
      cmdPicker.dismissed = true;
      cmdDropdown.hidden = true;
      cmdDropdown.style.display = "none";
      var input = document.getElementById("chatInput");
      if (input && input.value.charAt(0) === "/") {
        input.value = "";
      }
    }

    function cmdRunItem() {
      var items = cmdPicker.items;
      if (!items.length) return;
      var chosen = items[cmdPicker.highlighted];
      if (!chosen) return;
      cmdHide();
      cmdPicker.dismissed = true;
      var input = document.getElementById("chatInput");
      var label = (chosen.label || chosen.id || chosen.name || "").toString().trim();
      if (cmdPicker.categories && cmdPicker.categories.length) {
        var args = Object.values(cmdPicker.selected || {});
        args.push(chosen.id);
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        ws.send(JSON.stringify({
          type: "command",
          name: cmdPicker.cmdName || label,
          args: args,
          request_id: cmdPicker.requestId || ("cmd-" + Date.now()),
        }));
      } else {
        if (input) {
          input.value = "/" + label + " ";
          input.focus();
        }
      }
    }

    function cmdFilter(input) {
      var q = (input || "").toLowerCase().replace(/^\//, "");
      var source = cmdPicker.allCatalog && cmdPicker.allCatalog.length > 0 ? cmdPicker.allCatalog : cmdPicker.items;
      if (!q) return source;
      var prefix = [], contains = [];
      for (var i = 0; i < source.length; i++) {
        var lbl = (source[i].label || source[i].id || "").toLowerCase();
        if (lbl.indexOf(q) === 0) prefix.push(source[i]);
        else if (lbl.indexOf(q) >= 0) contains.push(source[i]);
      }
      return prefix.concat(contains);
    }

    function cmdInputChanged() {
      var input = document.getElementById("chatInput");
      var v = input.value;
      if (v === "") {
        cmdPicker.dismissed = false;
        cmdPicker.skillsLoaded = false;
        cmdHide();
        return;
      }
      if (v.charAt(0) === "/") {
        if (!cmdPicker.dismissed) {
          var lower = v.toLowerCase();
          if ((lower.startsWith("/skill ") || lower.startsWith("/skills ")) && !cmdPicker.skillsLoaded) {
            cmdPicker.skillsLoaded = true;
            if (ws && ws.readyState === WebSocket.OPEN) {
              ws.send(JSON.stringify({ type: "command", name: "skills", args: [], request_id: "cmd-skills-picker" }));
            }
          } else if (!cmdPicker.active || !cmdPicker.allCatalog || cmdPicker.allCatalog.length === 0) {
            cmdOpenList();
          }
          cmdPicker.active = true;
          cmdPicker.items = cmdFilter(v);
          cmdPicker.highlighted = 0;
          cmdRender();
        }
      } else {
        cmdPicker.dismissed = false;
        cmdPicker.skillsLoaded = false;
        cmdHide();
      }
    }

    function cmdKey(ev) {
      if (ev.key === "ArrowDown") {
        cmdPicker.highlighted = Math.min(cmdPicker.highlighted + 1, cmdPicker.items.length - 1);
        cmdRender();
        ev.preventDefault();
      } else if (ev.key === "ArrowUp") {
        cmdPicker.highlighted = Math.max(cmdPicker.highlighted - 1, 0);
        cmdRender();
        ev.preventDefault();
      } else if (ev.key === "ArrowRight" && cmdPicker.categories && cmdPicker.categories.length > 1) {
        var idx = cmdPicker.categories.findIndex(function (c) { return c.id === cmdPicker.activeCategory; });
        idx = (idx + 1) % cmdPicker.categories.length;
        cmdPicker.activeCategory = cmdPicker.categories[idx].id;
        var catItems = cmdPicker.categories[idx].items || [];
        cmdPicker.allCatalog = catItems;
        cmdPicker.items = catItems;
        cmdPicker.highlighted = 0;
        cmdRender();
        ev.preventDefault();
      } else if (ev.key === "ArrowLeft" && cmdPicker.categories && cmdPicker.categories.length > 1) {
        var idxL = cmdPicker.categories.findIndex(function (c) { return c.id === cmdPicker.activeCategory; });
        idxL = (idxL - 1 + cmdPicker.categories.length) % cmdPicker.categories.length;
        cmdPicker.activeCategory = cmdPicker.categories[idxL].id;
        var catItemsL = cmdPicker.categories[idxL].items || [];
        cmdPicker.allCatalog = catItemsL;
        cmdPicker.items = catItemsL;
        cmdPicker.highlighted = 0;
        cmdRender();
        ev.preventDefault();
      } else if (ev.key === "Enter") {
        cmdRunItem();
        ev.preventDefault();
      } else if (ev.key === "Escape" || ev.key === "Esc") {
        cmdDismiss();
        ev.preventDefault();
      }
    }

    // Global Esc key & Click-outside listeners
    document.addEventListener("keydown", function (ev) {
      if (ev.key === "Escape" || ev.key === "Esc") {
        cmdDismiss();
      }
    });

    document.addEventListener("mousedown", function (ev) {
      if (cmdPicker.active) {
        var dropdown = document.getElementById("chatCmdDropdown");
        var input = document.getElementById("chatInput");
        if (dropdown && !dropdown.contains(ev.target) && ev.target !== input) {
          cmdDismiss();
        }
      }
    });

    function cmdMaybeOpen(ev) {
      // Called on the input's keydown. Opens the picker when the user
      // types `/` at the start of (or after whitespace in) the input.
      var input = document.getElementById("chatInput");
      var v = input.value;
      var caret = input.selectionStart || 0;
      if (ev.key === "/" && caret === 0 && v === "") {
        cmdPicker.beforeSlash = "";
        cmdOpenList();
      }
    }

    function cmdOnResult(data) {
      var status = data.status || "ok";
      var msg = data.message || "";
      var text = (status === "ok" ? "🟢 " : "🔴 ") + msg;
      // If the result has a list UI, render it as a small panel.
      if (data.ui && data.ui.kind === "list" && Array.isArray(data.ui.items)) {
        var items = data.ui.items;
        items.sort(function (a, b) {
          var la = (a.label || a.id || "").toLowerCase();
          var lb = (b.label || b.id || "").toLowerCase();
          return la.localeCompare(lb);
        });
        if (cmdPicker.skillsLoaded || data.request_id === "cmd-skills-picker") {
          cmdPicker.allCatalog = items;
          var input = document.getElementById("chatInput");
          var v = input ? input.value : "";
          cmdPicker.items = cmdFilter(v);
          cmdPicker.active = true;
          cmdRender();
        }
        var lines = items.slice(0, 50).map(function (it) {
          var lbl = it.label || it.id || it.name || "";
          var grp = it.group ? "  [" + it.group + "]" : "";
          return "  " + lbl + grp;
        }).join("\n");
        if (items.length > 50) lines += "\n  … (" + (items.length - 50) + " more)";
        text += "\n" + lines;
      }
      appendPlain("system", text);
      // Handle side-effects.
      if (data.side_effect) {
        cmdApplySideEffect(data.side_effect);
      }
    }

    function cmdApplySideEffect(eff) {
      if (!eff) return;
      if (eff.clear_chat) {
        // Wipe the messages DOM. Keep the brain.
        var msgs = document.getElementById("chatMessages");
        if (msgs) {
          var welcome = msgs.querySelector(".chat-welcome");
          // Remove all children except the welcome block.
          while (msgs.firstChild) msgs.removeChild(msgs.firstChild);
          if (welcome) msgs.appendChild(welcome);
        }
      }
      if (eff.reset_session) {
        // Server already swapped the session; just clear the chat DOM.
        cmdApplySideEffect({ clear_chat: true });
      }
      if (eff.compact) {
        // Already-rounded compensation: the server fires the compact
        // work on demand from the WS handler. Nothing to do here.
      }
      if (eff.reload_llm) {
        // The server has already updated app.state.llm. The next
        // session.send will pick it up. Nothing to do here.
      }
      if (eff.exit) {
        // Server-side asked to close the chat. Show a banner; the WS
        // is closed by the server after this message.
        appendPlain("system", "Session closed.");
      }
    }

    // Render the token stats footer from the chat session's
    // `token_stats` event. Format:
    //   TPS: 12.4 · 4,567 / 200,000 tok (97.7% left)
    // The percentage is color-coded: green >50%, amber 50-15%, red <15%.
    // When the current call's input is larger than the model window
    // (shouldn't happen — the API rejects oversized prompts — but
    // the gauge could still go negative if the model's reported
    // window is wrong), don't show a negative percentage; show
    // "X% over" instead and keep the danger class.
    function renderStats(data) {
      var tpsEl = document.getElementById("chatStatsTps");
      var cntEl = document.getElementById("chatStatsCnt");
      var pctEl = document.getElementById("chatStatsPct");
      if (!tpsEl || !cntEl || !pctEl) return;
      var tps = Math.round((data.tps || 0) * 10) / 10;
      // Use the LATEST call's input + output, not the cumulative sum
      // across the whole session — the cumulative ran past the window
      // on long conversations and made the percentage negative.
      var used = data.current_total != null ? data.current_total : (data.cumulative_total || 0);
      var window = data.context_window || 0;
      var tpsText = "TPS: " + (tps > 0 ? tps.toFixed(1) : "—");
      var cntText = window
        ? "ctx: " + used.toLocaleString() + " / " + window.toLocaleString() + " tok"
        : "ctx: " + used.toLocaleString() + " tok";
      tpsEl.textContent = tpsText;
      cntEl.textContent = cntText;
      pctEl.classList.remove("warn", "danger");
      if (window > 0) {
        var pctLeft = (1 - used / window) * 100;
        if (pctLeft < 0) {
          // The model must be reporting a smaller window than the
          // prompt actually used. Show the overflow as a positive
          // percentage and keep the danger class.
          var over = Math.round((-pctLeft) * 10) / 10;
          pctEl.textContent = over + "% over";
          pctEl.classList.add("danger");
        } else {
          var roundedLeft = Math.round(pctLeft * 10) / 10;
          pctEl.textContent = roundedLeft + "% left";
          if (pctLeft < 15) pctEl.classList.add("danger");
          else if (pctLeft < 50) pctEl.classList.add("warn");
        }
      } else {
        pctEl.textContent = "—";
      }
    }

    // Render the "⚡ Context Compacted: 154,200 → 14,100 tok (-90.8%)"
    // banner above the chat messages after a `context_compacted` event.
    // The banner auto-dismisses after 6 seconds — long enough to read,
    // short enough that an auto-compaction loop doesn't pile them up.
    function renderCompactBanner(data) {
      if (!data || data.status !== "ok") return;
      var oldTok = data.old_tokens || 0;
      var newTok = data.new_tokens || 0;
      var saved = data.saved_tokens || 0;
      var pct = oldTok > 0 ? Math.round((saved / oldTok) * 1000) / 10 : 0;
      var banner = document.createElement("div");
      banner.className = "chat-compact-banner";
      banner.innerHTML =
        "<span>⚡ Context Compacted</span>" +
        "<span class='arrow'>" + oldTok.toLocaleString() + " → " + newTok.toLocaleString() + " tok</span>" +
        "<span class='pct'>−" + pct + "%</span>";
      // Insert above the chat messages, just below the todos panel.
      var messages = document.getElementById("chatMessages");
      var anchor = document.getElementById("chatTodos");
      if (messages && anchor && anchor.parentNode) {
        anchor.parentNode.insertBefore(banner, anchor.nextSibling);
      } else if (messages) {
        messages.insertBefore(banner, messages.firstChild);
      } else {
        document.body.appendChild(banner);
      }
      setTimeout(function () { banner.remove(); }, 6000);
    }

    // Wire the [⚡ Compact] button. Sends `{"type":"compact"}` over the
    // chat socket; the server replies with a `context_compacted` event
    // that renderCompactBanner() turns into the toast.
    var compactBtn = document.getElementById("chatCompactBtn");
    if (compactBtn) {
      compactBtn.addEventListener("click", function () {
        if (!ws || ws.readyState !== WebSocket.OPEN) return;
        compactBtn.disabled = true;
        ws.send(JSON.stringify({ type: "compact" }));
        setTimeout(function () { compactBtn.disabled = false; }, 1500);
      });
    }

    // Render the phases panel from the agent's `set_todos` tool output.
    // Visual states match the convention used elsewhere (green check for
    // done, blue dot for in_progress, empty circle for pending).
    function renderTodos(items) {
      var list = document.getElementById("chatTodosList");
      var prog = document.getElementById("chatTodosProgress");
      var panel = document.getElementById("chatTodos");
      if (!list || !panel) return;
      list.innerHTML = "";
      var done = 0;
      items.forEach(function (it) {
        var li = document.createElement("li");
        li.className = "chat-todo " + (it.status || "pending");
        var icon = document.createElement("span");
        icon.className = "chat-todo-icon";
        icon.textContent =
          it.status === "done" ? "✓" :
          it.status === "in_progress" ? "●" : "○";
        var title = document.createElement("span");
        title.className = "chat-todo-title";
        title.textContent = it.title || "";
        li.appendChild(icon);
        li.appendChild(title);
        list.appendChild(li);
        if (it.status === "done") done++;
      });
      if (items.length) {
        panel.classList.add("has-items");
        prog.textContent = done + " / " + items.length;
      } else {
        panel.classList.remove("has-items");
        prog.textContent = "";
      }
    }

    wrap.querySelector("#chatSend").addEventListener("click", send);
    var chatInputEl = wrap.querySelector("#chatInput");
    chatInputEl.addEventListener("keydown", function (ev) {
      // Picker intercepts the four arrow keys + Enter + Esc while it's
      // open. Everything else falls through to normal typing.
      if (cmdPicker.active) {
        cmdKey(ev);
        return;
      }
      cmdMaybeOpen(ev);
      if (ev.key === "Enter") send();
    });
    chatInputEl.addEventListener("input", cmdInputChanged);
    // After the picker drops a command_result, the client may need to
    // refresh the chat (clear / reset / new) or open a modal. The
    // command handler runs through the regular ws.onmessage router
    // via the new "command_result" type — see below.

    return { input: wrap.querySelector("#chatInput") };
  }

  // =====================================================================
  // Editor — real CodeMirror editing: line numbers, syntax highlighting
  // by extension, bracket matching, Ctrl-F find, multi-file tabs (one
  // CodeMirror instance, a Doc per open file so undo history survives
  // switching tabs), save wired to /api/file.
  // =====================================================================
  var activeCM = null; // last-focused CodeMirror instance anywhere in the app — Edit menu targets this

  function buildEditorView(container) {
    var wrap = document.createElement("div");
    wrap.className = "editor-view";
    var tree = document.createElement("div");
    tree.className = "file-tree";
    var main = document.createElement("div");
    main.className = "editor-main";
    var tabs = document.createElement("div");
    tabs.className = "editor-tabs";
    var bar = document.createElement("div");
    bar.className = "editor-bar";
    bar.innerHTML = "<div class='editor-path' id='edPath'>no file open</div><span class='editor-status' id='edStatus'></span><button class='editor-btn' id='edSave'>Save</button>";
    var cmHostWrap = document.createElement("div");
    cmHostWrap.className = "editor-cm-host";
    var empty = document.createElement("div");
    empty.className = "editor-empty";
    empty.textContent = "Select a file from the tree on the left.";
    cmHostWrap.appendChild(empty);
    main.appendChild(tabs); main.appendChild(bar); main.appendChild(cmHostWrap);
    wrap.appendChild(tree); wrap.appendChild(main);
    container.appendChild(wrap);

    var cm = null;
    var openFiles = {}; // path -> { doc, dirty }
    var currentPath = null;
    var tabOrder = [];

    function ensureCM() {
      if (cm) return cm;
      empty.remove();
      cm = window.CodeMirror(cmHostWrap, {
        value: "", theme: "dracula", lineNumbers: true, matchBrackets: true,
        extraKeys: { "Ctrl-F": "findPersistent", "Cmd-F": "findPersistent" },
      });
      cm.on("focus", function () { activeCM = cm; });
      cm.on("change", function () {
        if (currentPath && openFiles[currentPath]) {
          openFiles[currentPath].dirty = true;
          renderTabs();
        }
      });
      return cm;
    }

    function renderTabs() {
      tabs.innerHTML = "";
      tabOrder.forEach(function (path) {
        var t = document.createElement("div");
        t.className = "editor-tab" + (path === currentPath ? " active" : "");
        var name = path.split("/").pop();
        t.innerHTML = "<span>" + escapeHtml(name) + (openFiles[path].dirty ? " ●" : "") + "</span><span class='x'>✕</span>";
        t.addEventListener("click", function (ev) {
          if (ev.target.classList.contains("x")) { closeTab(path); return; }
          switchTo(path);
        });
        tabs.appendChild(t);
      });
    }

    function switchTo(path) {
      currentPath = path;
      ensureCM().swapDoc(openFiles[path].doc);
      document.getElementById("edPath").textContent = path;
      document.getElementById("edStatus").textContent = "";
      renderTabs();
      tree.querySelectorAll(".file-row").forEach(function (r) { r.classList.toggle("selected", r.dataset.path === path); });
      setTimeout(function () { cm.refresh(); cm.focus(); }, 10);
    }

    function closeTab(path) {
      delete openFiles[path];
      tabOrder = tabOrder.filter(function (p) { return p !== path; });
      if (currentPath === path) {
        currentPath = null;
        if (tabOrder.length) switchTo(tabOrder[tabOrder.length - 1]);
        else { document.getElementById("edPath").textContent = "no file open"; if (cm) cm.swapDoc(new CodeMirror.Doc("", "text/plain")); }
      }
      renderTabs();
    }

    function openFile(path, forcedMode) {
      // `forcedMode` backs "Open as…" — reopening a file under a different
      // syntax mode. Without it that menu item would silently do nothing.
      if (openFiles[path] && !forcedMode) { switchTo(path); return; }
      fetch("/api/file?path=" + encodeURIComponent(path)).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(function (data) {
        var mode = (forcedMode ? (EXT_MODE[forcedMode.replace(/^\./, "")] || LANG_MODE[forcedMode] || forcedMode) : null)
                   || modeForFilename(path) || "text/plain";
        openFiles[path] = { doc: new CodeMirror.Doc(data.content, mode), dirty: false };
        tabOrder.push(path);
        switchTo(path);
      }).catch(function (e) {
        document.getElementById("edStatus").textContent = "error: " + e.message;
      });
    }

    // ---- ask(): a real input dialog ------------------------------------
    // window.prompt is unreliable inside WebView2 — a rename that silently
    // does nothing is worse than no rename at all. Returns a Promise of the
    // typed value, or null if cancelled.
    function ask(opts) {
      return new Promise(function (resolve) {
        var root = document.getElementById("askRoot");
        var box = document.getElementById("askBox");
        box.innerHTML =
          "<h4>" + escapeHtml(opts.title) + "</h4>" +
          (opts.message ? "<p>" + escapeHtml(opts.message) + "</p>" : "") +
          (opts.input === false ? "" : "<input type='text' id='askInput'>") +
          "<div class='ask-row'>" +
          "<button class='ask-cancel' id='askCancel'>Cancel</button>" +
          "<button class='ask-ok" + (opts.danger ? " danger" : "") + "' id='askOk'>" +
          escapeHtml(opts.okLabel || "OK") + "</button></div>";
        root.classList.add("open");

        var input = document.getElementById("askInput");
        if (input) {
          input.value = opts.value || "";
          input.focus();
          // Select the stem, not the extension — renaming report.md to
          // summary.md shouldn't mean retyping ".md".
          var dot = input.value.lastIndexOf(".");
          if (dot > 0) input.setSelectionRange(0, dot); else input.select();
        }

        function done(value) {
          root.classList.remove("open");
          document.removeEventListener("keydown", onKey, true);
          resolve(value);
        }
        function onKey(ev) {
          if (ev.key === "Escape") { ev.stopPropagation(); done(null); }
          else if (ev.key === "Enter" && input) { ev.stopPropagation(); done(input.value.trim() || null); }
        }
        document.addEventListener("keydown", onKey, true);
        document.getElementById("askCancel").addEventListener("click", function () { done(null); });
        document.getElementById("askOk").addEventListener("click", function () {
          done(input ? (input.value.trim() || null) : true);
        });
      });
    }

    // ---- filesystem calls ------------------------------------------------
    function fsCall(url, method, body) {
      return fetch(url, {
        method: method,
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      }).then(function (r) {
        return r.json().then(function (data) { return { ok: r.ok, status: r.status, data: data }; });
      });
    }

    function fsError(result) {
      return (result.data && result.data.detail) || ("HTTP " + result.status);
    }

    /**
     * Delete, letting the *server* decide what is protected.
     *
     * The client deliberately does not know which folders are top-level or
     * how many items a tree holds. It attempts the delete; a 409 comes back
     * carrying the reason, which becomes the confirmation text; if the user
     * agrees it retries with the flags. Reimplementing the rules here would
     * mean two sources of truth that drift apart.
     */
    function deletePath(path, name) {
      return fsCall("/api/fs", "DELETE", { path: path }).then(function (res) {
        if (res.ok) return true;
        if (res.status !== 409) { alert("Could not delete: " + fsError(res)); return false; }
        return ask({
          title: "Delete " + name + "?",
          message: fsError(res) + "\n\nThis cannot be undone.",
          input: false, danger: true, okLabel: "Delete",
        }).then(function (confirmed) {
          if (!confirmed) return false;
          return fsCall("/api/fs", "DELETE",
                        { path: path, recursive: true, allow_top_level: true })
            .then(function (retry) {
              if (!retry.ok) { alert("Could not delete: " + fsError(retry)); return false; }
              return true;
            });
        });
      });
    }

    var currentDir = "";
    function loadFileTree(path) {
      currentDir = path || "";
      fetch("/api/files?path=" + encodeURIComponent(path || "")).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(renderFileTree).catch(function (e) {
        tree.innerHTML = "<div style='color:#f87171;padding:6px'>" + escapeHtml(e.message) + "</div>";
      });
    }
    // ---- right-click menu ------------------------------------------------
    var ctxMenu = document.getElementById("ctxMenu");

    function closeCtx() { ctxMenu.classList.remove("open"); }
    document.addEventListener("click", closeCtx);
    document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeCtx(); });
    window.addEventListener("blur", closeCtx);

    function showCtx(x, y, items) {
      ctxMenu.innerHTML = "";
      items.forEach(function (item) {
        if (item === "-") {
          var sep = document.createElement("div");
          sep.className = "ctx-sep";
          ctxMenu.appendChild(sep);
          return;
        }
        var el = document.createElement("div");
        el.className = "ctx-item" + (item.danger ? " danger" : "") + (item.disabled ? " disabled" : "");
        el.innerHTML = escapeHtml(item.label) + (item.key ? "<span class='k'>" + escapeHtml(item.key) + "</span>" : "");
        el.addEventListener("click", function (ev) {
          ev.stopPropagation();
          closeCtx();
          if (!item.disabled && item.run) item.run();
        });
        ctxMenu.appendChild(el);
      });
      ctxMenu.classList.add("open");
      // Flip near the edges so the menu is never cut off by the window.
      var r = ctxMenu.getBoundingClientRect();
      ctxMenu.style.left = Math.min(x, window.innerWidth - r.width - 8) + "px";
      ctxMenu.style.top = Math.min(y, window.innerHeight - r.height - 8) + "px";
    }

    function parentOf(path) { return (path || "").split("/").slice(0, -1).join("/"); }
    function baseName(path) { return (path || "").split("/").pop(); }

    function refreshTree() { loadFileTree(currentDir); }

    function newFileHere(dir) {
      ask({ title: "New file", message: "In: " + (dir || "project root"), value: "untitled.txt" })
        .then(function (name) {
          if (!name) return;
          fsCall("/api/fs/new-file", "POST", { path: dir, name: name }).then(function (res) {
            if (!res.ok) return alert("Could not create: " + fsError(res));
            refreshTree();
            openFile(res.data.path);
          });
        });
    }

    function newFolderHere(dir) {
      ask({ title: "New folder", message: "In: " + (dir || "project root"), value: "new-folder" })
        .then(function (name) {
          if (!name) return;
          fsCall("/api/fs/mkdir", "POST", { path: dir, name: name }).then(function (res) {
            if (!res.ok) return alert("Could not create: " + fsError(res));
            refreshTree();
          });
        });
    }

    function fileMenuItems(entry) {
      var dir = entry && entry.is_dir ? entry.path : currentDir;
      var items = [];

      if (entry) {
        items.push({ label: entry.is_dir ? "Open folder" : "Open",
                     run: function () { entry.is_dir ? loadFileTree(entry.path) : openFile(entry.path); } });
        if (!entry.is_dir) {
          items.push({ label: "Open as…", run: function () {
            ask({ title: "Open as", message: "Syntax mode for " + baseName(entry.path),
                  value: (entry.path.split(".").pop() || "text") }).then(function (mode) {
              if (mode) openFile(entry.path, mode);
            });
          }});
        }
        items.push("-");
      }

      items.push({ label: "New File", run: function () { newFileHere(dir); } });
      items.push({ label: "New Folder", run: function () { newFolderHere(dir); } });
      items.push({ label: "New Project…", run: function () { openModal("newproject"); } });

      if (entry) {
        items.push("-");
        items.push({ label: "Rename…", run: function () {
          ask({ title: "Rename", value: baseName(entry.path) }).then(function (name) {
            if (!name || name === baseName(entry.path)) return;
            var dest = parentOf(entry.path);
            fsCall("/api/fs/rename", "POST",
                   { path: entry.path, dest: (dest ? dest + "/" : "") + name }).then(function (res) {
              if (!res.ok) return alert("Could not rename: " + fsError(res));
              refreshTree();
            });
          });
        }});
        items.push({ label: "Move to…", run: function () {
          ask({ title: "Move", message: "Destination path, relative to the project root",
                value: entry.path }).then(function (dest) {
            if (!dest || dest === entry.path) return;
            fsCall("/api/fs/rename", "POST", { path: entry.path, dest: dest }).then(function (res) {
              if (!res.ok) return alert("Could not move: " + fsError(res));
              refreshTree();
            });
          });
        }});
        items.push({ label: "Copy", run: function () {
          var dot = entry.is_dir ? -1 : entry.path.lastIndexOf(".");
          var dest = dot > 0 ? entry.path.slice(0, dot) + "-copy" + entry.path.slice(dot)
                             : entry.path + "-copy";
          fsCall("/api/fs/copy", "POST", { path: entry.path, dest: dest }).then(function (res) {
            if (!res.ok) return alert("Could not copy: " + fsError(res));
            refreshTree();
          });
        }});
        items.push({ label: "Copy as…", run: function () {
          ask({ title: "Copy as", message: "New path, relative to the project root",
                value: entry.path }).then(function (dest) {
            if (!dest || dest === entry.path) return;
            fsCall("/api/fs/copy", "POST", { path: entry.path, dest: dest }).then(function (res) {
              if (!res.ok) return alert("Could not copy: " + fsError(res));
              refreshTree();
            });
          });
        }});

        if (!entry.is_dir) {
          items.push("-");
          items.push({ label: "Save", disabled: !openFiles[entry.path], key: "Ctrl+S",
                       run: function () { document.getElementById("edSave").click(); } });
          items.push({ label: "Save As…", run: function () {
            ask({ title: "Save as", message: "New path, relative to the project root",
                  value: entry.path }).then(function (dest) {
              if (!dest) return;
              var content = openFiles[entry.path] ? openFiles[entry.path].doc.getValue() : null;
              var done = content === null
                ? fsCall("/api/fs/copy", "POST", { path: entry.path, dest: dest })
                : fsCall("/api/file", "PUT", { path: dest, content: content });
              done.then(function (res) {
                if (!res.ok) return alert("Could not save: " + fsError(res));
                refreshTree();
                openFile(dest);
              });
            });
          }});
        }

        items.push("-");
        items.push({ label: entry.is_dir ? "Delete folder" : "Delete", danger: true, key: "Del",
                     run: function () {
          deletePath(entry.path, baseName(entry.path)).then(function (removed) {
            if (!removed) return;
            if (openFiles[entry.path]) closeTab(entry.path);
            refreshTree();
          });
        }});
      }
      return items;
    }

    function renderFileTree(data) {
      tree.innerHTML = "";
      if (data.path) {
        var parent = data.path.split("/").slice(0, -1).join("/");
        var up = document.createElement("div");
        up.className = "file-row";
        // Same icon-column shape as the entries so the row aligns with them.
        var upIcon = document.createElement("span");
        upIcon.className = "ft-icon";
        upIcon.innerHTML = '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M9 3 L5 7 L9 11" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        var upName = document.createElement("span");
        upName.className = "ft-name";
        upName.textContent = ".. (" + (parent || "root") + ")";
        up.appendChild(upIcon);
        up.appendChild(upName);
        up.addEventListener("click", function () { loadFileTree(parent); });
        tree.appendChild(up);
      }
      data.entries.forEach(function (e) {
        var row = document.createElement("div");
        row.className = "file-row" + (e.is_dir ? " dir" : "");
        row.dataset.path = e.path;
        // Folder / file glyph. Inline SVG keeps the leading column a real
        // icon on systems without color-emoji fonts (WebView2 falls back to
        // a font that doesn't carry 📁 / 📄, leaving a small box).
        var icon = document.createElement("span");
        icon.className = "ft-icon";
        icon.innerHTML = e.is_dir
          ? '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1.5 3.5 h4 l1.4 1.6 h5.6 V11 a.7 .7 0 0 1 -.7 .7 H1.5 a.7 .7 0 0 1 -.7 -.7 V4.2 a.7 .7 0 0 1 .7 -.7 z" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>'
          : '<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M3 1.5 h5.5 l2.5 2.5 V12.5 a.7 .7 0 0 1 -.7 .7 H3 a.7 .7 0 0 1 -.7 -.7 V2.2 a.7 .7 0 0 1 .7 -.7 z M8.5 1.5 V4 H11" fill="none" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/></svg>';
        var name = document.createElement("span");
        name.className = "ft-name";
        name.textContent = e.name;
        row.appendChild(icon);
        row.appendChild(name);
        row.addEventListener("click", function () { if (e.is_dir) loadFileTree(e.path); else openFile(e.path); });
        row.addEventListener("contextmenu", function (ev) {
          ev.preventDefault(); ev.stopPropagation();
          tree.querySelectorAll(".file-row").forEach(function (r) { r.classList.remove("selected"); });
          row.classList.add("selected");
          showCtx(ev.clientX, ev.clientY, fileMenuItems(e));
        });
        tree.appendChild(row);
      });
    }

    bar.querySelector("#edSave").addEventListener("click", function () {
      if (!currentPath || !openFiles[currentPath]) return;
      var content = openFiles[currentPath].doc.getValue();
      var status = document.getElementById("edStatus");
      status.textContent = "saving…";
      fetch("/api/file", {
        method: "PUT", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: currentPath, content: content }),
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(function (data) {
        openFiles[currentPath].dirty = false;
        renderTabs();
        status.textContent = "saved (" + data.bytes + " bytes)";
      }).catch(function (e) {
        status.textContent = "error: " + e.message;
      });
    });

    tree.addEventListener("contextmenu", function (ev) {
      if (ev.target.closest(".file-row")) return;   // rows handle their own
      ev.preventDefault();
      showCtx(ev.clientX, ev.clientY, fileMenuItems(null));
    });

    loadFileTree("");

    return {
      refresh: function () { if (cm) cm.refresh(); },
      reloadTree: function () { loadFileTree(""); },
      // Exposed so a chat code block can hand a file straight to the editor.
      openFile: function (path) { loadFileTree(""); openFile(path); },
    };
  }

  var MODELESS = { settings: true, newproject: true }; // stays open while you work in the rest of the app

  function openModal(name) {
    var root = document.getElementById("modalRoot");
    var box = document.getElementById("modalBox");
    box.classList.remove("wide");
    root.classList.toggle("modeless", !!MODELESS[name]);
    if (name === "settings") {
      renderSettingsModal(box);
    } else if (name === "newproject") {
      renderNewProjectModal(box);
    } else if (name === "layout-options") {
      renderLayoutOptionsModal(box);
    } else {
      box.removeAttribute("style");
      box.innerHTML = MODALS[name]();
      box.querySelectorAll("[data-close]").forEach(function (b) { b.addEventListener("click", closeModal); });
    }
    root.classList.add("open");
    if (MODELESS[name]) placeModelessBox(box); // after .open, so the box has a measurable size
  }
  function closeModal() { document.getElementById("modalRoot").classList.remove("open"); }
  document.getElementById("modalRoot").addEventListener("click", function (ev) {
    // Click-outside-to-dismiss only applies to the true modals — for the
    // modeless panel a stray click in the app must never throw away a
    // half-filled provider form. Close it with ✕/Close or Escape.
    if (ev.target.id === "modalRoot" && !ev.currentTarget.classList.contains("modeless")) closeModal();
  });
  document.addEventListener("keydown", function (ev) {
    if (ev.key !== "Escape") return;
    var root = document.getElementById("modalRoot");
    if (root.classList.contains("open")) { closeModal(); ev.stopPropagation(); }
  });
  window.__openSettingsPanel = function () { openModal("settings"); };

  // ---- modeless panel placement + dragging -----------------------------
  function placeModelessBox(box) {
    var width = 560; // .modal-box.wide
    applyModelessPos(box, settingsPos || { x: (window.innerWidth - width) / 2, y: 70 });
  }
  function applyModelessPos(box, pos) {
    var width = box.offsetWidth || 560;
    // Always leave ~120px of the panel (and its heading) on screen to grab.
    settingsPos = {
      x: Math.min(Math.max(pos.x, 120 - width), window.innerWidth - 120),
      y: Math.min(Math.max(pos.y, 0), window.innerHeight - 40),
    };
    box.style.left = settingsPos.x + "px";
    box.style.top = settingsPos.y + "px";
  }
  (function enableModelessDrag() {
    var root = document.getElementById("modalRoot");
    var box = document.getElementById("modalBox");
    var dragging = false, from = [0, 0], start = [0, 0];
    box.addEventListener("mousedown", function (ev) {
      if (!root.classList.contains("modeless")) return;
      if (!ev.target.closest("h3")) return; // the panel's heading is its title bar
      dragging = true;
      from = [ev.clientX, ev.clientY];
      start = [settingsPos.x, settingsPos.y];
      ev.preventDefault(); // no text selection while dragging
    });
    window.addEventListener("mousemove", function (ev) {
      if (!dragging) return;
      applyModelessPos(box, { x: start[0] + ev.clientX - from[0], y: start[1] + ev.clientY - from[1] });
    });
    window.addEventListener("mouseup", function () { dragging = false; });
    window.addEventListener("resize", function () {
      if (settingsPos && root.classList.contains("open")) applyModelessPos(box, settingsPos);
    });
  })();

  // =====================================================================

  function renderNewProjectBody(body, info) {
    if (!body) return;
    var types = info.types || [];
    var selected = null;

    body.innerHTML =
      "<div class='settings-form'>" +
      "<label>Name your Project</label>" +
      "<input type='text' id='npName' placeholder='my-first-project' autocomplete='off'>" +
      "<label>Type of project <span style='color:#5b6289'>— type to jump: h → HTML, HTML5, HTMX</span></label>" +
      "<div class='np-combo'>" +
      "<input type='text' id='npTypeSearch' placeholder='search or pick a type…' autocomplete='off'>" +
      "<div class='np-list' id='npList'></div>" +
      "</div>" +
      "<div class='np-meta' id='npMeta'></div>" +
      "<div class='actions' style='margin-top:12px;display:flex;gap:8px;align-items:center'>" +
      "<button class='btn primary' id='npCreate' style='background:#3b5bdb;border:none;color:#fff;border-radius:6px;padding:7px 16px;font-size:12.5px;cursor:pointer'>Create Project</button>" +
      "<span id='npStatus' style='font-size:11.5px;color:#8b93b8'></span>" +
      "</div>" +
      "<label style='margin-top:14px'>Setup console</label>" +
      "<div class='np-console' id='npConsole'><div class='np-line dim'>" +
      escapeHtml("workbench: " + info.root) + "</div></div>" +
      "</div>";

    var listEl = document.getElementById("npList");
    var searchEl = document.getElementById("npTypeSearch");
    var metaEl = document.getElementById("npMeta");

    // Prefix matches first — typing "h" must reach the HTML family before
    // anything that merely contains an h.
    function rank(query) {
      var q = (query || "").trim().toLowerCase();
      if (!q) return types.slice();
      var starts = [], contains = [];
      types.forEach(function (t) {
        var hay = [t.id, t.label].concat(t.keywords || []).map(function (x) { return String(x).toLowerCase(); });
        if (hay.some(function (h) { return h.indexOf(q) === 0; })) starts.push(t);
        else if (hay.some(function (h) { return h.indexOf(q) >= 0; })) contains.push(t);
      });
      return starts.concat(contains);
    }

    function describe(t) {
      if (!t) return "";
      var bits = [];
      if (t.needs_env) bits.push("creates its own environment");
      if (t.sqlite) bits.push("SQLite database");
      if (t.steps && t.steps.length) bits.push(t.steps.length + " setup step" + (t.steps.length === 1 ? "" : "s"));
      if (!t.available) bits.push("⚠ " + (t.runtime || "runtime") + " not installed on this machine");
      return escapeHtml(t.description) + (bits.length ? " <span style='color:#6c7399'>· " + bits.join(" · ") + "</span>" : "");
    }

    function draw(query) {
      var matches = rank(query);
      listEl.innerHTML = "";
      matches.forEach(function (t, i) {
        var row = document.createElement("div");
        row.className = "np-item" + (t.available ? "" : " unavailable");
        row.dataset.id = t.id;
        row.innerHTML = "<span class='np-label'>" + escapeHtml(t.label) + "</span>" +
          (t.available ? "" : "<span class='np-warn'>missing</span>");
        row.addEventListener("click", function () { choose(t.id); });
        listEl.appendChild(row);
      });
      // Auto-select the best match so typing "htmx" then Create just works.
      if (matches.length) choose(matches[0].id, true);
      else { selected = null; metaEl.textContent = "no matching project type"; }
    }

    function choose(id, keepFocus) {
      selected = types.filter(function (t) { return t.id === id; })[0] || null;
      Array.prototype.forEach.call(listEl.children, function (el) {
        el.classList.toggle("selected", el.dataset.id === id);
      });
      var sel = listEl.querySelector(".np-item.selected");
      if (sel && sel.scrollIntoView) sel.scrollIntoView({ block: "nearest" });
      metaEl.innerHTML = describe(selected);
      if (!keepFocus) searchEl.focus();
    }

    searchEl.addEventListener("input", function () { draw(searchEl.value); });
    searchEl.addEventListener("keydown", function (ev) {
      var rows = Array.prototype.slice.call(listEl.children);
      var idx = rows.findIndex(function (r) { return r.classList.contains("selected"); });
      if (ev.key === "ArrowDown" && idx < rows.length - 1) { choose(rows[idx + 1].dataset.id, true); ev.preventDefault(); }
      else if (ev.key === "ArrowUp" && idx > 0) { choose(rows[idx - 1].dataset.id, true); ev.preventDefault(); }
      else if (ev.key === "Enter") { ev.preventDefault(); document.getElementById("npCreate").click(); }
    });
    draw("");

    document.getElementById("npCreate").addEventListener("click", function () {
      createProject(selected, info);
    });
    document.getElementById("npName").focus();
  }

  function createProject(selected, info) {
    var nameEl = document.getElementById("npName");
    var statusEl = document.getElementById("npStatus");
    var consoleEl = document.getElementById("npConsole");
    var btn = document.getElementById("npCreate");

    function line(text, cls) {
      var el = document.createElement("div");
      el.className = "np-line " + (cls || "");
      el.textContent = text;
      consoleEl.appendChild(el);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    if (!nameEl.value.trim()) { statusEl.textContent = "name the project first"; nameEl.focus(); return; }
    if (!selected) { statusEl.textContent = "pick a project type"; return; }

    btn.disabled = true;
    statusEl.textContent = "creating…";
    consoleEl.innerHTML = "";

    var proto = location.protocol === "https:" ? "wss://" : "ws://";
    var ws = new WebSocket(proto + location.host + "/ws/workbench");
    ws.onopen = function () {
      ws.send(JSON.stringify({ name: nameEl.value.trim(), template: selected.id }));
    };
    ws.onmessage = function (ev) {
      var msg = JSON.parse(ev.data);
      if (msg.type === "log") {
        line(msg.line, { cmd: "cmd", err: "err", ok: "ok" }[msg.stream] || "");
      } else if (msg.type === "step") {
        statusEl.textContent = "step " + msg.index + "/" + msg.total + " — " + msg.label;
      } else if (msg.type === "done") {
        btn.disabled = false;
        if (msg.ok) {
          statusEl.textContent = "created — opened in the editor";
          line("→ " + msg.path, "ok");
          // Clear the name: leaving it filled meant the next click was
          // guaranteed to fail with "already exists".
          nameEl.value = "";
          // Point the editor at the new project so it's immediately usable.
          fetch("/api/project-dir", {
            method: "PUT", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ path: msg.path }),
          }).then(function () { if (window.__editor) window.__editor.reloadTree(); });
        } else {
          statusEl.textContent = "failed";
          line(msg.error || "setup did not complete", "err");
        }
        ws.close();
      }
    };
    ws.onerror = function () { btn.disabled = false; statusEl.textContent = "connection failed"; };
  }

      "Drop skills from other agents into the <code>external_skills/</code> folder " +
      "(see <code>external_skills/README.md</code>) and hit Import to fold them " +
      "into the brain. Each agent folder becomes its own branch." +
      "</div>" +
      "<button id='importExternalBtn'>Import external skills</button>" +
      "<div id='externalImportResult' style='font-size:11px;color:#6ee7b7;margin-top:6px'></div>" +

      "<h4>Shortcuts</h4>" +
      "<div style='font-size:11.5px;color:#8b93b8;margin-bottom:7px'>" +
      "Puts DariusAI (with the brain icon, not Python's) on your desktop and in the Start Menu. " +
      "Pin <i>that</i> shortcut to the taskbar to keep the icon there too.</div>" +
      "<button id='installShortcutsBtn'>Create desktop &amp; Start Menu shortcuts</button>" +
      "<div id='shortcutsResult' style='font-size:11px;color:#6ee7b7;margin-top:6px'></div>";

    body.innerHTML = html;

    body.querySelectorAll("[data-activate]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        fetch("/api/providers/" + encodeURIComponent(btn.dataset.activate) + "/activate", { method: "PUT" })
          .then(refreshSettingsData);
      });
    });
    body.querySelectorAll("[data-delete-provider]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        if (!confirm("Delete provider \"" + btn.dataset.deleteProvider + "\"?")) return;
        fetch("/api/providers/" + encodeURIComponent(btn.dataset.deleteProvider), { method: "DELETE" })
          .then(refreshSettingsData);
      });
    });
    body.querySelectorAll("[data-edit-provider]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        var p = providers.find(function (x) { return x.name === btn.dataset.editProvider; });
        showProviderForm(p);
      });
    });
    document.getElementById("addProviderBtn").addEventListener("click", function () { showProviderForm(null); });

        document.getElementById("installShortcutsBtn").addEventListener("click", function (ev) {
      var out = document.getElementById("shortcutsResult");
      ev.target.disabled = true;
      out.style.color = "#6ee7b7";
      out.textContent = "creating…";
      fetch("/api/shortcuts", { method: "POST" }).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(function (data) {
        out.textContent = "created: " + data.created.join(" · ");
      }).catch(function (e) {
        out.style.color = "#f87171";
        out.textContent = e.message;
      }).finally(function () { ev.target.disabled = false; });
    });

    // External skills import: scan the external_skills/ folder and fold
    // every SKILL.md into the brain. New nodes appear on the next graph
    // fetch, and the brain visibly grows as the import count climbs.
    var importBtn = document.getElementById("importExternalBtn");
    if (importBtn) {
      importBtn.addEventListener("click", function (ev) {
        var out = document.getElementById("externalImportResult");
        ev.target.disabled = true;
        out.style.color = "#6ee7b7";
        out.textContent = "scanning external_skills/…";
        fetch("/api/import-external", { method: "POST" }).then(function (r) {
          if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
          return r.json();
        }).then(function (data) {
          var msg = "imported " + data.imported + " skill(s)";
          if (data.agents && data.agents.length) {
            msg += " from " + data.agents.join(", ");
          }
          if (data.skipped) {
            msg += " (skipped " + data.skipped + ")";
          }
          out.textContent = msg;
        }).catch(function (e) {
          out.style.color = "#f87171";
          out.textContent = e.message;
        }).finally(function () { ev.target.disabled = false; });
      });
    }

    document.getElementById("startWithWindowsCheck").addEventListener("change", function (ev) {
      fetch("/api/start-with-windows", {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ enabled: ev.target.checked }),
      }).then(function (r) { return r.json(); }).then(function (data) { ev.target.checked = data.enabled; });
    });
  }

  function refreshSettingsData() {
    Promise.all([
      fetch("/api/project-dir").then(function (r) { return r.json(); }),
      fetch("/api/providers").then(function (r) { return r.json(); }),
      fetch("/api/start-with-windows").then(function (r) { return r.json(); }),
    ]).then(function (results) { renderSettingsBody(results[0], results[1], results[2]); });
  }

  function showProviderForm(existing) {
    var container = document.getElementById("providerForm");
    var isNew = !existing;
    container.innerHTML =
      "<div class='settings-form'>" +
      "<label>Provider</label>" +
      (isNew ? "<select id='pfPreset'><option value=''>choose a provider…</option></select>" : "") +
      "<input type='text' id='pfName' value=\"" + (existing ? escapeHtml(existing.name) : "") + "\"" + (isNew ? "" : " disabled") + " placeholder='e.g. anthropic'>" +
      "<label>Base URL</label><input type='text' id='pfBaseUrl' value=\"" + (existing ? escapeHtml(existing.base_url) : "") + "\" placeholder='https://api.anthropic.com'>" +
      "<label>Model <span id='pfModelNote' style='color:#5b6289'>— save a key to load the list</span></label>" +
      "<div style='display:flex;gap:6px'>" +
      "<select id='pfModel' style='flex:1'><option value=\"" + (existing ? escapeHtml(existing.model) : "") + "\">" +
      (existing && existing.model ? escapeHtml(existing.model) : "(no model selected)") + "</option></select>" +
      "<button type='button' id='pfLoadModels' style='background:#1b1e38;border:1px solid rgba(255,255,255,0.15);color:#cfd3ec;border-radius:6px;padding:0 12px;font-size:11.5px;cursor:pointer'>↻ Load</button>" +
      "</div>" +
      "<label>API key" + (existing && existing.has_api_key ? " (leave blank to keep the current key)" : "") + "</label>" +
      "<input type='password' id='pfApiKey' placeholder='" + (existing && existing.has_api_key ? existing.api_key_masked : "sk-ant-…") + "'>" +
      "<div class='actions' style='margin-top:10px;display:flex;gap:8px'>" +
      "<button class='btn primary' id='pfSave' style='background:#3b5bdb;border:none;color:#fff;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer'>Save</button>" +
      "<button id='pfCancel' style='background:#1b1e38;border:1px solid rgba(255,255,255,0.15);color:#e6e9f5;border-radius:6px;padding:6px 14px;font-size:12px;cursor:pointer'>Cancel</button>" +
      "</div><div class='settings-err' id='pfErr'></div>" +
      "</div>";

    document.getElementById("pfCancel").addEventListener("click", function () { container.innerHTML = ""; });

    // ---- provider presets + model discovery ---------------------------
    var presetSel = document.getElementById("pfPreset");
    if (presetSel) {
      fetch("/api/provider-presets").then(function (r) { return r.json(); }).then(function (list) {
        list.forEach(function (p) {
          var opt = document.createElement("option");
          opt.value = p.name; opt.textContent = p.label;
          opt.dataset.baseUrl = p.base_url;
          presetSel.appendChild(opt);
        });
      }).catch(function () { /* presets are a convenience; typing a name still works */ });
      presetSel.addEventListener("change", function () {
        var opt = presetSel.options[presetSel.selectedIndex];
        if (!opt.value) return;
        document.getElementById("pfName").value = opt.value;
        document.getElementById("pfBaseUrl").value = opt.dataset.baseUrl || "";
      });
    }

    function loadModels(name) {
      var sel = document.getElementById("pfModel");
      var note = document.getElementById("pfModelNote");
      if (!sel || !note) return Promise.resolve();
      var chosen = sel.value;
      note.textContent = "— loading…"; note.style.color = "#5b6289";
      return fetch("/api/providers/" + encodeURIComponent(name) + "/models").then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(function (data) {
        sel.innerHTML = "";
        if (!data.models.length) {
          sel.innerHTML = "<option value=''>(provider returned no usable models)</option>";
        }
        data.models.forEach(function (m) {
          var opt = document.createElement("option");
          opt.value = m.id;
          opt.textContent = m.label + (m.free === true ? "  · free" : "");
          if (m.id === chosen) opt.selected = true;
          sel.appendChild(opt);
        });
        var msg = "— " + data.models.length + " model" + (data.models.length === 1 ? "" : "s");
        var warn = false;
        if (data.source === "documented") {
          msg += " from the published catalogue (live list unavailable)";
          warn = true;
        } else if (data.free_only && data.free_filter === "applied") {
          msg += ", free only (of " + data.total + ")";
        } else if (data.free_filter === "unverifiable") {
          msg += " — provider published no pricing, so none could be confirmed free";
          warn = true;
        }
        note.textContent = msg;
        note.title = data.note || data.url || "";
        note.style.color = warn ? "#f0b45f" : "#6ee7b7";
      }).catch(function (e) {
        note.textContent = "— " + e.message;
        note.style.color = "#f87171";
      });
    }

    document.getElementById("pfLoadModels").addEventListener("click", function () {
      var name = document.getElementById("pfName").value.trim();
      if (!name) { document.getElementById("pfErr").textContent = "name is required"; return; }
      loadModels(name);
    });
    if (existing && existing.has_api_key) loadModels(existing.name); // key already saved — fill it now
    document.getElementById("pfSave").addEventListener("click", function () {
      var name = document.getElementById("pfName").value.trim();
      var errEl = document.getElementById("pfErr");
      if (!name) { errEl.textContent = "name is required"; return; }
      var keyInput = document.getElementById("pfApiKey").value;
      var payload = {
        base_url: document.getElementById("pfBaseUrl").value.trim(),
        model: document.getElementById("pfModel").value.trim(),
      };
      if (keyInput) payload.api_key = keyInput; // blank = leave existing key untouched (server-side semantics)
      fetch("/api/providers/" + encodeURIComponent(name), {
        method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
      }).then(function (r) {
        if (!r.ok) return r.json().then(function (e) { throw new Error(e.detail || ("HTTP " + r.status)); });
        return r.json();
      }).then(function () {
        // Saving a key is exactly what unlocks discovery, so it triggers the
        // fetch right here and the form stays open for the model to be
        // picked from the result — closing it would mean saving twice to
        // choose a model you were never shown.
        if (keyInput) {
          var nameField = document.getElementById("pfName");
          if (nameField) nameField.disabled = true;
          var keyField = document.getElementById("pfApiKey");
          keyField.value = ""; keyField.placeholder = "key saved ✓";
          return loadModels(name);
        }
        container.innerHTML = "";
        refreshSettingsData();
      }).catch(function (e) { errEl.textContent = e.message; });
    });
  }

  // =====================================================================
  // Menu bar
  // =====================================================================
  function closeAllMenus() { document.querySelectorAll(".menu.open").forEach(function (m) { m.classList.remove("open"); }); }
  document.querySelectorAll(".menu").forEach(function (menu) {
    menu.addEventListener("click", function (ev) {
      if (ev.target.classList.contains("menu-item")) return; // handled below
      var wasOpen = menu.classList.contains("open");
      closeAllMenus();
      if (!wasOpen) menu.classList.add("open");
    });
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".menu")) closeAllMenus();
  });

  // pywebview injects window.pywebview.api asynchronously after the page
  // loads (it fires a "pywebviewready" event when it's actually available)
  // — capturing it once into a variable at script-load time can freeze in
  // `null` forever if that hasn't happened yet. Look it up fresh on every
  // call instead.
  function getDesktopApi() { return (window.pywebview && window.pywebview.api) || null; }

  // Every "I'm done with this app" gesture in the page — the ✕ button and
  // File -> Exit — ends the process. `quit` is the Python side's single
  // shutdown path; `close` is only a fallback for an older bridge, and
  // window.close() for when the page is open in a plain browser instead of
  // the desktop window.
  function quitApp() {
    var d = getDesktopApi();
    if (d && d.quit) d.quit();
    else if (d && d.close) d.close();
    else window.close();
  }

  function isEditableElement(el) {
    if (!el) return false;
    var tag = (el.tagName || "").toUpperCase();
    return tag === "INPUT" || tag === "TEXTAREA" || !!el.isContentEditable;
  }

  function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(function () { return true; }).catch(function () { return false; });
    }
    return Promise.resolve(false);
  }

  function copyFromCurrentSelection() {
    if (activeCM && activeCM.hasFocus && activeCM.hasFocus()) {
      var cmText = activeCM.getSelection ? activeCM.getSelection() : "";
      if (cmText) return copyTextToClipboard(cmText);
    }
    var selection = window.getSelection ? window.getSelection().toString() : "";
    if (!selection) return Promise.resolve(false);
    return copyTextToClipboard(selection);
  }

  function cutFocusedEditable() {
    var el = document.activeElement;
    if (!isEditableElement(el)) return;
    try { document.execCommand("cut"); } catch (e) {}
  }

  function pasteIntoFocusedTarget() {
    var el = document.activeElement;
    if (isEditableElement(el)) {
      try { document.execCommand("paste"); } catch (e) {}
      return;
    }
    if (!(activeCM && activeCM.hasFocus && activeCM.hasFocus())) return;
    if (navigator.clipboard && navigator.clipboard.readText) {
      navigator.clipboard.readText().then(function (text) {
        if (text) activeCM.replaceSelection(text);
      }).catch(function () {});
    }
  }

  function selectAllInCurrentSurface() {
    if (activeCM && activeCM.hasFocus && activeCM.hasFocus()) {
      activeCM.execCommand("selectAll");
      return;
    }
    var el = document.activeElement;
    if (isEditableElement(el) && typeof el.select === "function") {
      el.select();
      return;
    }
    var sel = window.getSelection && window.getSelection();
    if (!sel) return;
    var range = document.createRange();
    range.selectNodeContents(document.body);
    sel.removeAllRanges();
    sel.addRange(range);
  }

  var MENU_ACTIONS = {
    "new-project": function () { openModal("newproject"); },
    "open-folder": function () {
      var desktopApi = getDesktopApi();
      if (desktopApi && desktopApi.pick_folder) {
        desktopApi.pick_folder().then(function (path) {
          if (!path) return;
          fetch("/api/project-dir", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: path }) })
            .then(function (r) { return r.json(); }).then(function () { if (window.__editor) window.__editor.reloadTree(); });
        });
      } else {
        var path = prompt("Project folder path:");
        if (!path) return;
        fetch("/api/project-dir", { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ path: path }) })
          .then(function (r) { return r.json(); }).then(function () { if (window.__editor) window.__editor.reloadTree(); })
          .catch(function () { alert("Could not open that folder."); });
      }
    },
    "show-layout-options": function () { openModal("layout-options"); },
    "exit": quitApp,
    "undo": function () { if (activeCM) activeCM.undo(); },
    "redo": function () { if (activeCM) activeCM.redo(); },
    "copy": function () { copyFromCurrentSelection(); },
    "cut": cutFocusedEditable,
    "paste": pasteIntoFocusedTarget,
    "select-all": selectAllInCurrentSurface,
    "find": function () { if (activeCM) activeCM.execCommand("findPersistent"); },
    "show-settings": function () { openModal("settings"); },
    "show-help": function () { openModal("help"); },
    "show-about": function () { openModal("about"); },
  };
  document.querySelectorAll(".menu-item").forEach(function (item) {
    item.addEventListener("click", function () {
      closeAllMenus();
      var action = MENU_ACTIONS[item.dataset.action];
      if (action) action();
    });
  });

  document.addEventListener("keydown", function (ev) {
    var mod = ev.ctrlKey || ev.metaKey;
    if (!mod || ev.altKey) return;
    var key = String(ev.key || "").toLowerCase();
    if (key === "c") {
      copyFromCurrentSelection().then(function () {});
      return;
    }
    if (key === "x") {
      cutFocusedEditable();
      return;
    }
    if (key === "v") {
      pasteIntoFocusedTarget();
      return;
    }
    if (key === "a") {
      selectAllInCurrentSurface();
      ev.preventDefault();
    }
  });

  // pywebview's drag handler is a mousedown listener on <body> that walks up
  // from the event target looking for the drag region, so a press on a window
  // button would also start dragging the window. Stopping propagation at the
  // button keeps the press from ever reaching that listener (`no-drag` CSS
  // isn't enough — WebView2 doesn't implement app-region at all).
  document.querySelectorAll("#titlebar .win-btn, #btnReload").forEach(function (btn) {
    btn.addEventListener("mousedown", function (ev) { ev.stopPropagation(); });
  });
  document.getElementById("btnReload").addEventListener("click", function () { location.reload(); });

  document.getElementById("btnClose").addEventListener("click", quitApp);
  document.getElementById("btnMinimize").addEventListener("click", function () {
    var d = getDesktopApi();
    if (d && d.minimize) d.minimize();
  });

  function toggleMaximize() {
    var desktopApi = getDesktopApi();
    if (!desktopApi || !desktopApi.toggle_maximize) return;
    // pywebview's js_api bridge returns a Promise for every exposed method.
    desktopApi.toggle_maximize().then(function (isMaximized) {
      var btn = document.getElementById("btnMaximize");
      // The maximize/restore affordance is an inline SVG. Toggling textContent
      // would wipe it; instead swap a class and let CSS pick which one shows.
      btn.classList.toggle("maximized", isMaximized);
      btn.title = isMaximized ? "Restore" : "Maximize";
    });
  }
  document.getElementById("btnMaximize").addEventListener("click", toggleMaximize);
  // Double-clicking the drag region is the standard OS convention for
  // maximize/restore — a frameless window doesn't get that for free.
  document.getElementById("titlebar").addEventListener("dblclick", function (ev) {
    if (ev.target.closest(".win-btn")) return;
    toggleMaximize();
  });

  // =====================================================================
  // Bootstrap — mount the three panels into the window manager
  // =====================================================================
  var neuralHost = document.createElement("div");
  neuralHost.id = "neuralCanvasWrap"; neuralHost.style.position = "absolute"; neuralHost.style.inset = "0";
  var neuralPanel = WM.createPanel("neural", "Neural View", neuralHost);

  var chatHost = document.createElement("div");
  chatHost.style.position = "absolute"; chatHost.style.inset = "0";
  var chatPanel = WM.createPanel("chat", "Chat", chatHost);

  var editorHost = document.createElement("div");
  editorHost.style.position = "absolute"; editorHost.style.inset = "0";
  var editorPanel = WM.createPanel("editor", "Editor", editorHost);

  WM.init();

  var neuralApi = buildNeuralView(neuralHost);
  var chatApi = buildChatView(chatHost);
  var editorApi = buildEditorView(editorHost);
  window.__editor = editorApi;
  // Expose the neural API on the window so the Layout Options modal can
  // reach the label/animation toggles without an explicit dependency on the
  // buildNeuralView closure.
  window.__neural = neuralApi;

  window.addEventListener("resize", function () { neuralApi.resize(); });
})();
</script>
</body>
</html>
