[project]
name = "dariusai-harness"
version = "0.75.0a0"  # keep in step with dariusai.__version__ (tests/test_version.py enforces it)
description = "Self-learning polyglot coding agent with a persistent, queryable skill graph"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "anthropic>=0.40",
    "networkx>=3.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13",
    "ddgs>=9",
    "httpx>=0.27",
    "pywebview>=5.3",
    "pystray>=0.19",
    "Pillow>=10.0",
    "python-dotenv>=1.0",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[project.scripts]
dariusai = "dariusai.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
